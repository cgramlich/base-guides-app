    // After a sign-in (called once the profile is read and the column is there): THE MERGE RULE above.
    async function copyUpDevicePayGrade(accountGrade) {
      const device = readDevicePayGrade();
      if (!device) return;
      if (!accountGrade) {
        const result = await writeAccountPayGrade(device);
        console.log(ACCOUNT_LOG + " pay grade copied up from this device: " + result);
        if (result !== "ok") return; // the device keeps its grade for a later try
      }
      LS.set(DEVICE_PAY_GRADE_KEY, null);
      emitPayGrade();
    }

    // The picker: the grades in the website's groups, "No pay grade" to remove it, Save and Cancel.
    function PayGradePicker({ initial, onSaved, onCancel, idSuffix }) {
      const [choice, setChoice] = useState(initial || "");
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const id = "pay-grade-" + idSuffix;
      const save = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await setPayGrade(choice || null);
        setBusy(false);
        if (result === "failed") { setMessage(PAY_GRADE_TEXT.failed); return; }
        onSaved(result);
      };
      return (
        <form className="acct-name-form" onSubmit={save} data-pay-grade-picker={idSuffix}>
          <label className="fld-l" htmlFor={id}>{PAY_GRADE_TEXT.pickLabel}</label>
          <div className="acct-name">
            <select id={id} className="fld pay-grade-sel" value={choice} onChange={(e) => setChoice(e.target.value)}>
              <option value="">{PAY_GRADE_TEXT.noGrade}</option>
              {PAY_GRADE_GROUPS.map((group) => (
                <optgroup key={group.label} label={group.label}>
                  {group.grades.map((g) => <option key={g} value={g}>{g}</option>)}
                </optgroup>
              ))}
            </select>
            <button type="submit" className="btn-quiet" disabled={busy}>{busy ? "Saving..." : PAY_GRADE_TEXT.save}</button>
            <button type="button" className="btn-quiet" onClick={onCancel} disabled={busy}>{PAY_GRADE_TEXT.cancel}</button>
          </div>
          {message ? <div className="acct-msg" role="alert">{message}</div> : null}
        </form>
      );
    }

    // The Pay grade row of the account screen: the grade and "Change", or "No pay grade yet" and
    // "Add your pay grade"; the line under it says where the grade is kept.
    function PayGradeRow({ account }) {
      const payGrade = usePayGrade();
      const [editing, setEditing] = useState(false);
      const [note, setNote] = useState("");
      if (!account.profileRead) return <dd>Reading.</dd>;
      const where = payGrade.unavailable ? PAY_GRADE_TEXT.unavailable : (payGrade.inAccount ? PAY_GRADE_TEXT.inAccount : PAY_GRADE_TEXT.onPhone);
      return (
        <dd data-pay-grade-row={payGrade.grade ? "set" : "none"} data-pay-grade-where={payGrade.inAccount ? "account" : "device"}>
          {editing ? (
            <PayGradePicker idSuffix="account" initial={payGrade.grade}
              onSaved={(result) => { setEditing(false); setNote(result === "unavailable" ? PAY_GRADE_TEXT.unavailable : ""); }}
              onCancel={() => setEditing(false)} />
          ) : (
            <div className="acct-name">
              <span>{payGrade.grade || PAY_GRADE_TEXT.none}</span>
              <button type="button" className="btn-quiet" onClick={() => { setNote(""); setEditing(true); }}>{payGrade.grade ? PAY_GRADE_TEXT.change : PAY_GRADE_TEXT.add}</button>
            </div>
          )}
          <div className="faint tiny" style={{ marginTop: 4 }}>{note || where}</div>
        </dd>
      );
    }

    /* ---------------- NAMES (one word per thing, the website's) ----------------
       RULE (auditor round 3, items 1 to 4; Chris's card 2026-11-24, names "Use all four"): the
       newsletter is "MilSpo Minute", the list of bases is "Find a base", the checklist is "PCS
       checklist", the tool is "Compare bases". The app says the same words as milspoliving.com.
       Where the app already agreed: "MilSpo Minute" in the sign-in sentence (SIGN_IN_TEXT) and
       "Compare bases" in WEBSITE_TOOLS. Changed here: the way back from a guide and the heading of
       the list read "Find a base" (they said "All bases" and "Guide"), and the Plan screen is headed
       "PCS checklist" (it said "Your PCS plan").
       NOT changed: the five tab labels (Home, Guide, Map, Plan, Saved). The auditor's tab redesign
       is a separate proposal Chris has not approved, so the tab that holds the checklist is still
       called "Plan" and the tab that lists the bases "Home". */
    const FIND_A_BASE = "Find a base";
    const PCS_CHECKLIST = "PCS checklist";
    /** The way back from a guide to the list of bases (Home). A button, so a keyboard reaches it. */
    // `label` is where Back goes: "Home" (the first screen) or the list's own name. The App knows which.
    function BackToList({ onBack, label }) {
      return <button type="button" className="back" onClick={onBack}><Icon name="back" size={15} /> {label || FIND_A_BASE}</button>;
    }

    /* ---------------- Screens ---------------- */
    // A single base card (shared by Home and Saved).
    // The line under a post's name that names its hub ("Joint Base San Antonio"), so a reader who
    // found "JBSA Lackland" knows which installation it belongs to. Nothing for a base without a parent.
    function ParentLine({ b, bases }) {
      if (!b.parent || !bases) return null;
      const parent = bases.find((x) => x.slug === b.parent);
      if (!parent) return null;
      return <div className="meta-line parent-line">Part of {parent.name.replace(/\s*\(.*$/, "")}</div>;
    }

    // RULE (auditor round 2, item 3): the "Guide ready" label is gone. Every base in the index has a
    // guide, so the label told the reader nothing; only "Coming soon" (an entry not ready) is marked.
    function BaseCard({ b, onOpen, saved, onToggleSave, bases, onSetMyBase }) {
      return (
        <div className={"card" + (b.ready ? " tap" : "")} onClick={() => b.ready && onOpen(b.slug)}>
          {onSetMyBase && b.ready ? (
            <button type="button" className="mybase-pick" onClick={(e) => { e.stopPropagation(); onSetMyBase({ slug: b.slug, name: b.name }); }}>
              <Icon name="home" size={14} />This is my base
            </button>
          ) : null}
          <div className="between">
            <div style={{ minWidth: 0 }}>
              <div className="base-name">
                {b.name}
                {b.region === "OCONUS" ? <span className="pill oconus">OCONUS</span> : null}
                {b.ready ? null : <span className="pill soon">Coming soon</span>}
              </div>
              <div className="meta-line">{[b.branch, b.state].filter(Boolean).join("  -  ")}</div>
              <ParentLine b={b} bases={bases} />
            </div>
            <div className="card-actions">
              <button className="iconbtn" style={saved.includes(b.slug) ? { color: "var(--accent)" } : null} onClick={(e) => { e.stopPropagation(); onToggleSave(b.slug); }} aria-label="Save">
                <Icon name={saved.includes(b.slug) ? "bookmarkOn" : "bookmark"} size={18} />
              </button>
              {b.ready ? <span className="card-go"><Icon name="cardchev" size={20} /></span> : null}
            </div>
          </div>
        </div>
      );
    }

    const BRANCH_FILTERS = [["all", "All"], ["army", "Army"], ["air force", "Air Force"], ["navy", "Navy"], ["marine", "Marines"], ["coast guard", "Coast Guard"], ["space", "Space Force"], ["joint", "Joint"]];
    const STATE_NAMES = {
      AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado",
      CT: "Connecticut", DE: "Delaware", DC: "District of Columbia", FL: "Florida", GA: "Georgia",
      HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa", KS: "Kansas", KY: "Kentucky",
      LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan", MN: "Minnesota",
      MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire",
      NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota",
      OH: "Ohio", OK: "Oklahoma", OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina",
      SD: "South Dakota", TN: "Tennessee", TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia",
      WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming",
    };
    function stateTokens(s) { return (s || "").split("/").map((x) => x.trim()).filter(Boolean); }
    function stateFull(t) { return STATE_NAMES[t] || t; }
    function stateLabel(s) { return stateTokens(s).map(stateFull).join(" / ") || "Other"; }

    /* ---------------- TIERS: main family bases first ----------------
       RULE (auditor round 2, item 3; Chris's screenshots 2026-11-24): every list of bases puts the
       places families live FIRST. Sorted by name alone, the Air National Guard wings ("101 ARW",
       "102 IW" ...) led every list because a digit sorts before a letter, and a family saw a wall
       of codes. The three tiers are the website's (Chris, decision card 2026-11-22):
         1 where families live: main and joint bases, in the U.S., its territories and abroad, plus the
           Coast Guard bases, the Academy and the training centers;
         2 smaller and specialized posts: depots, arsenals, labs, ranges, schools, support sites, DLA
           sites, and the Coast Guard's sectors, air stations, stations, units and offices;
         3 Guard, Reserve, recruiting and ROTC: Air National Guard wings, Guard training sites, Reserve
           bases, Army recruiting battalions, Army Cadet Command offices.
       WARNING: this MIRRORS the website's rules in milspoliving src/lib/guide-tiers.ts (the slug lists
       and the name rules are copied from there, 2026-11-24). The two must change together. The
       website also reads the DoD directory's site type, which the backend index does not carry; here
       a wing is "a name that starts with a digit", a recruiting battalion "a slug starting usard-",
       and a Cadet Command office "a slug starting us-army-cadet-command". ROAD NOT TAKEN: a tier
       field in the backend index, which would be the one place for the rule; proposed to the lead. */
    const TIER1_BY_SLUG = new Set([
      "redstone-arsenal", "aberdeen-proving-ground", "naval-support-activity-annapolis-u-s-naval-academy",
      "mcrd-parris-island", "mcrd-san-diego",
      "coast-guard-base-alameda", "coast-guard-base-boston", "coast-guard-base-honolulu", "coast-guard-base-kodiak",
      "coast-guard-base-los-angeles-long-beach", "coast-guard-base-portsmouth", "coast-guard-base-seattle",
      "ucsg-galveston", "ucsg-ketchikan", "ucsg-new-orleans", "uscg-cleveland", "uscg-miami-beach", "uscg-academy",
      "tracen-cape-may", "tracen-petaluma", "tracen-yorktown", "coast-guard-atc-mobile",
      "naval-air-weapons-station-china-lake", "u-s-army-garrison-white-sands-missile-range", "dugway-proving-ground",
      "yuma-proving-ground", "naval-support-activity-bethesda-home-of-walter-reed-national-military-medical-center",
      "naval-support-activity-mid-south", "naval-support-activity-hampton-roads",
    ]);
    const TIER2_BY_SLUG = new Set([
      "carlisle-barracks", "presidio-of-monterey", "naval-support-activity-monterey", "marine-corps-mountain-warfare-training-center-mwtc",
      "fort-a-p-hill", "fort-hunter-liggett", "fort-mccoy", "camp-parks", "pohakuloa-training-area", "avon-park-air-force-range",
      "orchard-combat-training-center", "natick-soldier-systems-center-nssc", "fort-detrick", "arnold-afb", "stennis-space-center",
      "surface-combat-systems-center-wallops-island", "newport-news-shipyard", "naval-medical-center-portsmouth", "pentagon-air-force",
      "marine-barracks-washington", "mccs-hampton-roads", "blount-island-command", "mcsf-new-orleans", "marine-corps-logistics-base-albany",
      "mclb-barstow", "nsf-thurmont", "ussouthcom-u-s-army-garrison-miami", "naval-air-station-oceana-dam-neck-annex", "rivanna-station",
    ]);
    const TIER2_NAME_RULES = [
      /\bdepot\b/i, /\barsenal\b/i, /\bammunition plant\b/i, /\blaborator|\bresearch\b/i,
      /\bproving ground\b|\bmissile range\b|\bweapons station\b/i, /\bspace force station\b/i,
      /\bocean terminal\b|\bstorage activity\b/i, /^naval support activity\b/i,
    ];
    function inFiftyStates(state) {
      const parts = stateTokens(state);
      return parts.length > 0 && parts.every((t) => !!STATE_NAMES[t]);
    }
    function guideTier(b) {
      const slug = b.slug || "", name = b.name || "", branch = b.branch || "", state = b.state || "";
      if (slug.indexOf("usard-") === 0 || slug.indexOf("us-army-cadet-command") === 0) return 3;
      if (/^\d/.test(name)) return 3;                      // an Air National Guard wing
      if (branch === "Defense Logistics Agency") return 2;
      if (TIER1_BY_SLUG.has(slug)) return 1;
      if (TIER2_BY_SLUG.has(slug)) return 2;
      if (branch === "National Guard") return 3;
      if (branch === "U.S. Coast Guard") return 2;
      if (/\breserve\b/i.test(branch)) return 3;
      if (!inFiftyStates(state)) return 1;                 // the territories and places abroad
      if (/\bair reserve (base|station)\b|\bARB\b|\bARS\b/i.test(name)) return 3;
      if (TIER2_NAME_RULES.some((re) => re.test(name))) return 2;
      return 1;
    }
    /** Tier first, then name, for every list of bases in the app. */
    function byTierThenName(a, b) {
      const ta = guideTier(a), tb = guideTier(b);
      if (ta !== tb) return ta - tb;
      return (a.name || "").localeCompare(b.name || "");
    }

    /* ---------------- BASE SEARCH: one rule for every box that finds a base by typing ----------------
       Used by Home's search box and by "Moving to" on the PCS checklist (PlanBaseField), so the two
       can never find different things for the same letters.
       RULE (Chris, decision card 2026-11-24): a base is listed ONCE. A hub entry (index.json
       "hub": true, today Joint Base San Antonio) is the umbrella over posts that have their own
       guides ("parts"); the posts are what families look for, so the posts are always listed and
       the hub appears only when the reader types the hub's own name ("San Antonio", "Joint Base",
       "JBSA"), never for a post's name ("Lackland" used to return two results) and never in an
       unfiltered list, where its posts already stand. The hub's name in the index carries the
       post names in brackets, so a plain match on the name would find it for "lackland": that is
       why the hub is matched on its name with the bracket part removed.
       ROAD NOT TAKEN: dropping the hub entry from the index. Rejected: its guide file still exists
       and saved-base rows may point at its slug, so the entry stays and is only hidden from search.
       `typed` is what the reader typed, trimmed and in lower case. "" matches every base but a hub. */
    function baseSearchText(b) { return (b.name + " " + (b.state || "") + " " + stateTokens(b.state).map(stateFull).join(" ")).toLowerCase(); }
    function hubSearchName(b) { return (b.name || "").replace(/\s*\(.*$/, "").toLowerCase(); }
    function baseMatchesSearch(b, typed) {
      if (b.hub) return !!typed && (hubSearchName(b).indexOf(typed) !== -1 || typed === "jbsa" || typed.indexOf("jbsa ") === 0);
      return !typed || baseSearchText(b).indexOf(typed) !== -1;
    }

    // ADD TO HOME SCREEN (auditor round 2, item 25; Chris 2026-11-24). RULE: one quiet line, only in a
    // browser tab (not once the app is installed: display-mode standalone, or Safari's navigator.standalone),
    // on the first screen only and near its top (under the hero, or under the question's one line),
    // dismissible, and remembered on the device so it is never shown twice. The words follow the phone:
    // Safari on iPhone and iPad has Share then "Add to Home Screen"; Chrome on Android has the menu then
    // "Add to Home screen" or "Install app". Nothing is detected beyond the user agent string, and a wrong
    // guess only changes the wording, never the behaviour.
    function isInstalledApp() {
      try { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; } catch (e) { return false; }
    }
    function AddToHomeScreenHint() {
      const [hidden, setHidden] = useState(() => isInstalledApp() || !!LS.get("bg_a2hs_dismissed", false));
      if (hidden) return null;
      const ua = navigator.userAgent || "";
      const apple = /iPhone|iPad|iPod/i.test(ua);
      const words = apple
        ? "Keep this app on your phone: tap Share, then Add to Home Screen."
        : "Keep this app on your phone: open the browser menu, then Add to Home screen or Install app.";
      const dismiss = () => { LS.set("bg_a2hs_dismissed", true); setHidden(true); };
      return (
        <div className="a2hs" role="note">
          <span>{words}</span>
          <button onClick={dismiss} aria-label="Dismiss this hint">Got it</button>
        </div>
      );
    }

    // The list view only (BrowseAllBases, below): one quiet row above the list. "My base: <name>"
    // opens the guide; with none listed, "No base listed. Add your base" turns on picking mode
    // there. Signed out it shows the device's value, signed in the account's; it never shows a
    // base of anyone else's.
    function MyBaseHomeRow({ myBase, bases, onOpen, onPick, picking }) {
      const name = myBaseName(myBase, bases);
      if (myBase.slug) {
        return (
          <button type="button" className="mybase-row" data-my-base="set" onClick={() => onOpen(myBase.slug)}>
            <Icon name="home" size={16} /><span className="mybase-lbl">My base:</span><span className="mybase-name">{name}</span><Icon name="cardchev" size={16} />
          </button>
        );
      }
      return (
        <>
          <div className="mybase-row mybase-none" data-my-base="none">
            <Icon name="home" size={16} /><span className="mybase-lbl">{NO_BASE_LISTED}</span>
            <button type="button" className="btn-quiet" onClick={onPick} aria-pressed={picking}>{picking ? "Pick it below" : "Add your base"}</button>
          </div>
          <div className="faint tiny mybase-explained">{MY_BASE_EXPLAINED}</div>
        </>
      );
    }

    /* ---------------- FIRST SCREEN: "My base" (the Home tab) ----------------
       WHAT THIS IS: the screen the app opens on. With a base set (MY BASE, above) it is that base:
       its name, the local time there, the weather, a drive time on request, the next step of the
       move, three actions and the saved bases. With none set it asks one question, "Where are you
       headed?". The list of every base, which Home used to be, is BrowseAllBases at the end of
       this section, behind "Browse all bases".
       DECISION (Chris, two decision cards 2026-11-25): the job, "the website is where a family
       decides; the app is what they carry on the way and on the ground"; first build, "My base
       first screen only"; look, "Yes, match the website" (FIRST SCREEN LOOK in the style block);
       paid lookups, "Free data first, then a cap"; stores, "Stay a web app for now".
       WHAT IT DELIBERATELY DOES NOT DO (left out by the same cards; do not start them from here):
       the guide kept in the pocket, Near me, the shared checklist, reminders, a new tab bar, the
       other screens in this look.

       THE RULES OF THIS SCREEN (each is repeated beside the code that keeps it):
       1. NO PAID LOOKUP WITHOUT A TAP. Drawing this screen calls only what LIVE_DATA_COST (CONFIG)
          marks "free": the base's own guide record and the weather. A lookup marked "paid" waits
          for a tap that asks for it.
       2. THE ASK BOX IS NOT CALLED FROM HERE. "Ask a question about this base" opens the guide
          with the question field ready. A question is sent, and costs, only when the reader sends
          it there.
       3. LOCATION IS ASKED ONLY AT THE TAP THAT NEEDS IT: the drive time button. Opening the screen
          never raises the phone's location prompt.
       4. NOTHING INVENTED (the accuracy rule). A value that could not be loaded says so in words;
          it is never a guess and never an old number shown as today's. */
    const FIRST_LOG = "[FIRST]";

    /* FIRST SCREEN MEMORY: what this phone keeps about the base on the first screen, under
       "bg_first_screen": { slug, name, line, toneMain, toneMark, tz, lat, lng }.
       WHY it exists: (1) the launch mark in the HTML draws this hero before the app has compiled,
       and all it can read is browser storage (LAUNCH MARK, "the first screen at first paint");
       (2) while a signed-in reader's account is still being read, and with no connection at all,
       the screen can open on the base it showed last time instead of on the question.
       It is a copy for drawing, never a source: each value is replaced as soon as the real one loads.
       RULE: it is kept only while a base is shown here. Once the reader is known to have none
       (cleared, or signed out: MY BASE's WARNING) it is deleted, so signing out still leaves no
       base on this device.
       ROAD NOT TAKEN: reading the guide the service worker cached. It holds the same facts, but
       only after an asynchronous cache read, which is too late for the first paint. */
    const FIRST_SCREEN_MEMORY_KEY = "bg_first_screen";
    const HEX_COLOUR = /^#[0-9a-f]{6}$/i;
    function readFirstScreenMemory() {
      const kept = LS.get(FIRST_SCREEN_MEMORY_KEY, null);
      return kept && typeof kept.slug === "string" && SLUG_SHAPE.test(kept.slug) ? kept : null;
    }
    function forgetFirstScreen() {
      try { localStorage.removeItem(FIRST_SCREEN_MEMORY_KEY); } catch (e) { /* storage blocked: nothing was kept either */ }
    }
    /** True while nobody can say yet whether a signed-in reader has a base (the profile is not read). */
    function accountNotReadYet(account) {
      return account.status === "loading" || (account.status === "signed-in" && !account.profileRead);
    }
    /** The base the first screen shows: the reader's (MY BASE); or, only while the account is still
        being read, the one this phone showed last time; or null, which draws the question. */
    function baseShownFirst(myBase, account, bases) {
      if (myBase.slug) return { slug: myBase.slug, name: myBaseName(myBase, bases) };
      const kept = accountNotReadYet(account) ? readFirstScreenMemory() : null;
      return kept ? { slug: kept.slug, name: kept.name || kept.slug.replace(/-/g, " ") } : null;
    }

    // THE SEAM (FIRST SCREEN LOOK in the style block): while the first screen is up, the top bar
    // and the tab bar take its ground. A layout effect, not an effect, so the bars and the screen
    // change in the same paint when the reader comes back to Home from another tab.
    function useFirstScreenLook(active) {
      React.useLayoutEffect(() => {
        const root = document.documentElement;
        if (active) root.setAttribute("data-screen", "first"); else root.removeAttribute("data-screen");
        return () => root.removeAttribute("data-screen");
      }, [active]);
    }

    // The base's own guide record, for its time zone and its place on the map. The base index
    // carries neither, so this is the one fetch the first screen makes for its base.
    // WHY the whole guide: it is the record the guide screen fetches and the service worker keeps
    // (sw.js, per-base data: network first, then the last good copy), so a base opened before
    // loads here with no connection, and "Open the guide" then opens from the same copy.
    // ROAD NOT TAKEN: a small backend route with only tz and coords. It would be a second thing
    // to cache and keep in step with the guide, to save one request the app makes anyway.
    function useGuideRecord(slug, attempt) {
      const [record, setRecord] = useState({ slug: null, status: "loading", guide: null });
      useEffect(() => {
        let live = true;
        setRecord({ slug, status: "loading", guide: null });
        console.log(FIRST_LOG + " guide record for " + slug + ": loading (try " + (attempt + 1) + ")");
        fetchJSON(baseUrl(slug))
          .then((guide) => {
            if (!live) return;
            console.log(FIRST_LOG + " guide record for " + slug + ": loaded (time zone " + (guide.tz || "none") + ", place " + (guide.coords ? "yes" : "none") + ")");
            setRecord({ slug, status: "ready", guide });
          })
          .catch((error) => {
            if (!live) return;
            console.warn(FIRST_LOG + " guide record for " + slug + ": not loaded (" + error.message + ")");
            setRecord({ slug, status: "failed", guide: null });
          });
        return () => { live = false; };
      }, [slug, attempt]);
      return record.slug === slug ? record : { slug, status: "loading", guide: null };
    }

    // The weather at a point, from the backend's /api/weather. `wanted` is RULE 1: false means
    // "do not load it yet" (a paid provider waits for the reader's tap).
    function useWeatherAt(lat, lng, wanted) {
      const [weather, setWeather] = useState({ status: "idle", data: null });
      useEffect(() => {
        if (!wanted || lat == null || lng == null) { setWeather({ status: "idle", data: null }); return undefined; }
        let live = true;
        setWeather({ status: "loading", data: null });
        fetchJSON(apiUrl("/api/weather?lat=" + lat + "&lng=" + lng))
          .then((data) => {
            if (!live) return;
            console.log(FIRST_LOG + " weather: loaded (" + (data && data.current ? "a forecast" : "no forecast for this place") + ", " + ((data && data.alerts) || []).length + " alerts)");
            setWeather({ status: "ready", data: data || {} });
          })
          .catch((error) => {
            if (!live) return;
            console.warn(FIRST_LOG + " weather: not loaded (" + error.message + ")");
            setWeather({ status: "failed", data: null });
          });
        return () => { live = false; };
      }, [lat, lng, wanted]);
      return weather;
    }

    // The clock at the base, as words ("Tue 9:41 PM"); null without a time zone. Ticks twice a minute.
    function useClockAt(tz) {
      const [, tick] = useState(0);
      useEffect(() => { const id = setInterval(() => tick((n) => n + 1), 30000); return () => clearInterval(id); }, []);
      if (!tz) return null;
      try { return new Intl.DateTimeFormat([], { timeZone: tz, weekday: "short", hour: "numeric", minute: "2-digit" }).format(new Date()); }
      catch (e) { return null; }
    }

    /* The next step of the move: the FIRST step of the PCS checklist that is not ticked, in the
       checklist's own order (PCS_BUCKETS, the Plan tab). Nothing is worked out beyond that: the
       words are the checklist's, the date is the move date plus that part's offset, exactly as
       the Plan tab shows it. Answers null with no move date, { allDone: true } with every step
       ticked. The plan and its ticks stay on the phone ("bg_pcs", "bg_pcs_done"), as before. */
    function nextPcsStep(moveDateText, tickedById) {
      if (!moveDateText) return null;
      const move = new Date(moveDateText + "T00:00:00");
      if (isNaN(move.getTime())) return null;
      for (const part of PCS_BUCKETS) {
        for (let index = 0; index < part.tasks.length; index += 1) {
          if (!tickedById[part.key + "-" + index]) return { allDone: false, move, task: part.tasks[index], partLabel: part.label, due: addDays(move, part.offset) };
        }
      }
      return { allDone: true, move };
    }
    function NextStepBlock({ bases, onOpenPlan }) {
      // Read when the screen opens. The plan changes only on the Plan tab, and coming back from
      // there draws this screen anew, so it cannot go stale while it is on screen.
      const [plan] = useState(() => LS.get("bg_pcs", { moveDate: "", base: "" }));
      const [ticked] = useState(() => LS.get("bg_pcs_done", {}));
      const step = nextPcsStep(plan.moveDate, ticked);
      if (!step) {
        return (
          <section className="fs-section" data-first="move-not-set">
            <span className="w-label">Your move</span>
            <button type="button" className="w-btn-quiet" onClick={onOpenPlan}>Set your move date</button>
            <p className="w-caption">It puts a date on each step of the {PCS_CHECKLIST}, and the next step shows here.</p>
          </section>
        );
      }
      const daysLeft = daysUntil(step.move);
      const movingTo = plan.base ? (bases || []).find((b) => b.slug === plan.base) : null;
      const countdown = daysLeft >= 0
        ? (daysLeft === 1 ? "1 day" : daysLeft + " days") + " until your move (" + fmtDate(step.move) + ")"
        : "Your move date was " + fmtDate(step.move);
      return (
        <section className="fs-section" data-first="move-set">
          <span className="w-label">Next step</span>
          {step.allDone
            ? <p className="fs-step w-display">Every step on your checklist is ticked.</p>
            : <><p className="fs-step w-display">{step.task}</p><p className="w-caption">{step.partLabel}, around {fmtDate(step.due)}.</p></>}
          <p className="w-caption">{countdown}{movingTo ? ", to " + movingTo.name : ""}.</p>
          <button type="button" className="w-btn-quiet" onClick={onOpenPlan}>Open the {PCS_CHECKLIST}</button>
        </section>
      );
    }

    /* "Drive time from where you are now": a BUTTON, never automatic.
       RULE 3 (Chris, card 2026-11-25; the browser's own rule too): the phone's location is asked
       for inside this button's tap and nowhere else on the screen. Opening the screen calls
       neither the phone's location nor /api/directions.
       WHAT IT CALLS, once per tap: the backend's /api/directions, which today asks OSRM's public
       server (OpenStreetMap roads, no key, no charge, no live traffic; backend main.py, read
       2026-11-25). So this lookup is "free" in LIVE_DATA_COST, and it still waits for the tap
       because of the location. WARNING: if the backend moves directions to a paid provider this
       stays correct (it is already tap-only); change LIVE_DATA_COST with it.
       The location goes into that one request and is not stored by the app or written to the log. */
    function DriveTimeFromHere({ baseName, lat, lng, recordStatus }) {
      const [drive, setDrive] = useState({ status: "idle" });
      const live = useRef(true);
      useEffect(() => () => { live.current = false; }, []);
      const hasPlace = lat != null && lng != null;
      const ask = () => {
        if (!navigator.geolocation) { console.warn(FIRST_LOG + " drive time: this browser has no location service"); setDrive({ status: "no-location" }); return; }
        console.log(FIRST_LOG + " drive time: the reader tapped; asking the phone for its location");
        setDrive({ status: "locating" });
        navigator.geolocation.getCurrentPosition((position) => {
          if (!live.current) return;
          console.log(FIRST_LOG + " drive time: location given; asking the backend for the drive");
          setDrive({ status: "loading" });
          fetchJSON(apiUrl("/api/directions?from_lat=" + position.coords.latitude + "&from_lng=" + position.coords.longitude + "&to_lat=" + lat + "&to_lng=" + lng))
            .then((answer) => {
              if (!live.current) return;
              const usable = answer && typeof answer.duration_min === "number";
              console.log(FIRST_LOG + " drive time: " + (usable ? "answered (" + answer.duration_min + " min, source " + (answer.source || "not named") + ")" : "the answer had no time in it"));
              setDrive(usable ? { status: "ready", minutes: answer.duration_min, miles: answer.distance_mi, source: answer.source } : { status: "failed" });
            })
            .catch((error) => { if (!live.current) return; console.warn(FIRST_LOG + " drive time: not loaded (" + error.message + ")"); setDrive({ status: "failed" }); });
        }, (error) => {
          if (!live.current) return;
          // code 1 is the browser's "permission denied"; 2 and 3 mean it could not find the phone in time.
          const refused = !!error && error.code === 1;
          console.warn(FIRST_LOG + " drive time: " + (refused ? "location not shared" : "the phone gave no location"));
          setDrive({ status: refused ? "refused" : "no-location" });
        }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 });
      };
      const busy = drive.status === "locating" || drive.status === "loading";
      const buttonWords = drive.status === "locating" ? "Finding where you are..." : drive.status === "loading" ? "Working out the drive..." : "Drive time from where you are now";
      let outcome = null;
      if (drive.status === "ready") {
        outcome = (
          <>
            <p className="fs-result w-display" data-first="drive-result">{driveWords(drive.minutes, drive.miles)}</p>
            <p className="w-caption">From where you are now to {baseName}. {drive.source === "osrm" ? "A driving estimate from OpenStreetMap roads (OSRM), without live traffic." : "A driving estimate."}</p>
          </>
        );
      } else if (drive.status === "refused") {
        outcome = <p className="fs-note" data-first="drive-refused">Your location was not shared, so there is no drive time. To get one, allow location for this site in your browser, then tap again.</p>;
      } else if (drive.status === "no-location") {
        outcome = <p className="fs-note" data-first="drive-no-location">Your phone could not give a location just now. Try again in a moment.</p>;
      } else if (drive.status === "failed") {
        outcome = <p className="fs-note" data-first="drive-failed">The drive time could not be loaded. Check your connection and try again.</p>;
      }
      return (
        <section className="fs-section" data-first="drive">
          <span className="w-label">Getting there</span>
          {hasPlace ? (
            <>
              <button type="button" className="w-btn w-btn-secondary" onClick={ask} disabled={busy}>{buttonWords}</button>
              {drive.status === "idle" ? <p className="w-caption">Your phone asks for your location when you tap this, not before.</p> : null}
              {outcome}
            </>
          ) : (
            <p className="w-caption" data-first="drive-no-place">{recordStatus === "loading" ? "Loading where this base is..."
              : recordStatus === "failed" ? "A drive time needs to know where this base is, and that could not be loaded."
              : "No drive time for this base yet: its place on the map is not in the guide."}</p>
          )}
        </section>
      );
    }

    // "Saved bases" under the first screen, as a short list. The reader's own base is left out:
    // it is the screen. RULE kept from the Saved tab (SavedWhereLine; Chris, "After they try a
    // tool"): the sign-in line is offered only under a list that has something in it.
    const FIRST_SCREEN_SAVED_SHOWN = 5; // "a short list"; an account keeps at most MAX_SAVED_BASES, a phone's own list has no cap
    function SavedBasesShort({ bases, saved, myBaseSlug, account, inAccount, onOpen, onOpenSavedTab, onOpenAccount }) {
      const others = (saved || []).filter((slug) => slug !== myBaseSlug);
      if (!others.length) return null;
      const rows = others.slice(0, FIRST_SCREEN_SAVED_SHOWN).map((slug) => {
        const listed = (bases || []).find((b) => b.slug === slug);
        // Before the base list has loaded the slug is all there is; it reads well enough for a moment.
        return listed
          ? { slug, name: listed.name, meta: [listed.branch, listed.state].filter(Boolean).join(" · "), opens: !!listed.ready }
          : { slug, name: slug.replace(/-/g, " "), meta: "", opens: true };
      });
      return (
        <section className="fs-section" data-first="saved">
          <span className="w-label">Saved bases</span>
          <ul className="fs-rows">
            {rows.map((row) => (
              <li key={row.slug}>
                {row.opens ? (
                  <button type="button" className="fs-row" onClick={() => onOpen(row.slug)}>
                    <span><span className="fs-row-name">{row.name}</span>{row.meta ? <span className="fs-row-meta">{row.meta}</span> : null}</span>
                    <span className="fs-row-go"><Icon name="cardchev" size={20} /></span>
                  </button>
                ) : (
                  <div className="fs-row"><span><span className="fs-row-name">{row.name}</span><span className="fs-row-meta">{[row.meta, "Guide coming soon"].filter(Boolean).join(" · ")}</span></span></div>
                )}
              </li>
            ))}
          </ul>
          {others.length > rows.length ? <button type="button" className="w-btn-quiet" onClick={onOpenSavedTab}>All {others.length} saved bases</button> : null}
          <p className="w-caption">{savedExplained(inAccount)}</p>
          <SavedWhereLine account={account} inAccount={inAccount} onOpenAccount={onOpenAccount} />
        </section>
      );
    }

    // The first screen WITH a base. `base` is { slug, name } from baseShownFirst.
    function MyBaseFirstScreen({ base, bases, saved, account, inAccount, onOpen, onOpenAsk, onOpenMap, onOpenTab, onOpenAccount, onBrowse, onChoose }) {
      const [attempt, setAttempt] = useState(0);
      const record = useGuideRecord(base.slug, attempt);
      const guide = record.guide;
      // What the phone kept from last time, for this same base only (FIRST SCREEN MEMORY).
      const [keptAtOpen] = useState(readFirstScreenMemory);
      const kept = keptAtOpen && keptAtOpen.slug === base.slug ? keptAtOpen : null;
      const listed = (bases || []).find((b) => b.slug === base.slug) || null;

      const branch = (listed && listed.branch) || (guide && guide.branch) || "";
      const stateWords = listed && listed.state ? stateLabel(listed.state) : (guide && Array.isArray(guide.states) ? guide.states.map(stateFull).join(" / ") : "");
      const line = [branch, stateWords].filter(Boolean).join(" · ") || (kept && typeof kept.line === "string" ? kept.line : "");
      const keptTone = kept && HEX_COLOUR.test(kept.toneMain || "") && HEX_COLOUR.test(kept.toneMark || "") ? { main: kept.toneMain, mark: kept.toneMark } : null;
      const tone = branch ? branchTone(branch) : (keptTone || BRANCH_TONE_NEUTRAL);
      // RULE 4: the guide's own values when it loaded; else what the phone kept; else none, said in words below.
      const tz = guide ? (guide.tz || null) : (kept && typeof kept.tz === "string" ? kept.tz : null);
      const place = guide ? (guide.coords || null) : (kept && typeof kept.lat === "number" && typeof kept.lng === "number" ? { lat: kept.lat, lng: kept.lng } : null);
      const lat = place && typeof place.lat === "number" ? place.lat : null;
      const lng = place && typeof place.lng === "number" ? place.lng : null;

      useEffect(() => {
        LS.set(FIRST_SCREEN_MEMORY_KEY, { slug: base.slug, name: base.name, line, toneMain: tone.main, toneMark: tone.mark, tz, lat, lng });
      }, [base.slug, base.name, line, tone.main, tone.mark, tz, lat, lng]);

      // RULE 1 (NO PAID LOOKUP WITHOUT A TAP): the weather loads by itself only while its provider
      // is marked free in LIVE_DATA_COST (today the National Weather Service). Marked paid, it
      // waits for the reader's tap on "Show the weather".
      const [weatherAsked, setWeatherAsked] = useState(false);
      const weatherWanted = LIVE_DATA_COST.weather === "free" || weatherAsked;
      const weather = useWeatherAt(lat, lng, weatherWanted);
      const clock = useClockAt(tz);

      const waitingWords = record.status === "loading" ? "Loading..." : "Could not load";
      const timeWords = clock || (record.status === "ready" ? "Not in the guide" : waitingWords);
      let weatherWords; let weatherLine = "";
      const now = weather.status === "ready" ? weather.data.current : null;
      if (lat == null) weatherWords = record.status === "ready" ? "Not for this base" : waitingWords;
      else if (!weatherWanted) weatherWords = <button type="button" className="w-btn-quiet" onClick={() => { console.log(FIRST_LOG + " weather: the reader asked for it"); setWeatherAsked(true); }}>Show the weather</button>;
      else if (weather.status === "failed") weatherWords = "Could not load";
      else if (weather.status !== "ready") weatherWords = "Loading...";
      else if (!now) { weatherWords = "No forecast"; weatherLine = "The weather service has no forecast for this base right now."; }
      else {
        weatherWords = now.temp + "°" + (now.unit || "");
        const parts = [now.short];
        if (weather.data.high != null) parts.push("high " + weather.data.high + "°");
        if (weather.data.low != null) parts.push("low " + weather.data.low + "°");
        if (weather.data.precip != null) parts.push(weather.data.precip + "% chance of precipitation");
        weatherLine = parts.filter(Boolean).join(", ") + ".";
      }
      const alerts = weather.status === "ready" ? (weather.data.alerts || []) : [];
      const [alertsOpen, setAlertsOpen] = useState(false);

      return (
        <div className="fs" data-first-screen="base">
          <header className="fs-hero" style={{ "--fs-tone-main": tone.main, "--fs-tone-mark": tone.mark }}>
            <div className="w-label">My base</div>
            <h1 className="fs-name w-display">{base.name}</h1>
            <div className="fs-bar" />
            <div className="fs-branch"><span className="fs-dot" /><span>{line}</span></div>
            <div className="fs-facts">
              <div className="fs-fact"><span className="w-label">Local time</span><span className="fs-fact-v" data-first="time">{timeWords}</span></div>
              <div className="fs-fact"><span className="w-label">Weather</span><span className="fs-fact-v" data-first="weather">{weatherWords}</span></div>
              <div className="fs-fact-sub" data-first="weather-line">{weatherLine}{now ? " National Weather Service." : ""}</div>
            </div>
          </header>

          {record.status === "failed" ? (
            <div className="fs-section">
              <p className="fs-note" data-first="record-failed">
                This base's details could not be loaded{kept && (kept.tz || kept.lat != null) ? ", so the time above comes from what this phone kept last time" : ""}. Check your connection.
                <br /><button type="button" className="w-btn-quiet" onClick={() => setAttempt((n) => n + 1)}>Try again</button>
              </p>
            </div>
          ) : null}
          {/* RULE: a warning from the weather service is never hidden. Every alert's name is always
              on the screen. One alert shows its notice with it; with more than one the notices open
              on a tap, so three warnings do not push the actions off a phone's screen. */}
          {alerts.length ? (
            <div className="fs-section" data-first="alerts">
              <p className="fs-note">
                <strong>{alerts.length === 1 ? "Weather alert: " : "Weather alerts: "}{alerts.map((alert) => alert.event).join(", ")}</strong>
                {alerts.length === 1 || alertsOpen
                  ? alerts.map((alert, index) => (alert.headline ? <React.Fragment key={index}><br />{alert.headline}</React.Fragment> : null))
                  : <><br /><button type="button" className="w-btn-quiet" onClick={() => setAlertsOpen(true)}>Read the {alerts.length} notices</button></>}
              </p>
            </div>
          ) : null}
          {/* RULE (2026-11-25): the install hint sits UNDER the weather alerts. A warning is the first
              thing under the hero; a tip about the app never pushes it down the screen. */}
          <div className="fs-section fs-hint"><AddToHomeScreenHint /></div>

          <DriveTimeFromHere baseName={base.name} lat={lat} lng={lng} recordStatus={record.status} />
          <NextStepBlock bases={bases} onOpenPlan={() => onOpenTab("plan")} />

          <section className="fs-section" data-first="actions">
            <span className="w-label">This base</span>
            <div className="fs-actions">
              <button type="button" className="w-btn w-btn-primary" onClick={() => onOpen(base.slug)}>Open the guide</button>
              {/* RULE 2 (THE ASK BOX IS NOT CALLED FROM HERE): this opens the guide with the question
                  field ready. Nothing is sent to /api/ai until the reader sends a question there. */}
              <button type="button" className="w-btn w-btn-secondary" onClick={() => onOpenAsk(base.slug)}>Ask a question about this base</button>
              {/* This screen never calls /api/places. WARNING: the Map tab it opens loads the
                  Google-backed places by itself (MapScreen), which costs; this tap is the reader
                  asking for them, so RULE 1 holds. Do not load places here "to save a tap". */}
              <button type="button" className="w-btn w-btn-secondary" onClick={() => onOpenMap(base.slug)}>Places near the base</button>
            </div>
          </section>

          <SavedBasesShort bases={bases} saved={saved} myBaseSlug={base.slug} account={account} inAccount={inAccount}
            onOpen={onOpen} onOpenSavedTab={() => onOpenTab("saved")} onOpenAccount={onOpenAccount} />

          <div className="fs-section fs-foot">
            <button type="button" className="w-btn-quiet" onClick={onBrowse}>Browse all bases</button>
            <button type="button" className="w-btn-quiet" onClick={onChoose}>Change my base</button>
          </div>
        </div>
      );
    }

    /* The first screen WITHOUT a base: one question. Typing finds a base by BASE SEARCH (the rule
       Home's list and the PCS checklist use, so the Joint Base San Antonio hub is hidden here the
       same way); tapping one makes it My base through the MY BASE store, unchanged, and the screen
       then opens on it. A base without a guide yet is listed but cannot be picked, as on the list.
       `currentName` is set when the reader came here from "Change my base". */
    function WhereHeadedScreen({ bases, loading, loadFailed, onRetry, saved, account, inAccount, currentName, onPick, onKeep, onOpen, onOpenTab, onOpenAccount, onBrowse }) {
      const [typed, setTyped] = useState("");
      const typedLower = typed.trim().toLowerCase();
      const allMatches = typedLower ? (bases || []).filter((b) => baseMatchesSearch(b, typedLower)).sort(byTierThenName) : [];
      const matches = allMatches.slice(0, PLAN_BASE_MATCHES_SHOWN);
      const noList = !bases || !bases.length;
      return (
        <div className="content fs fs-ask" data-first-screen="question">
          {currentName ? <button type="button" className="w-btn-quiet fs-keep" onClick={onKeep}><Icon name="back" size={15} />&nbsp;Keep {currentName}</button> : null}
          {/* The coin and the line are what the launch mark in the HTML draws before the app has
              compiled (LAUNCH MARK), in the same box, so nothing moves when the app takes over. */}
          <div className="home-hero">
            <img className="home-logo" src={ASSETS.logoMark} alt={BRAND} />
            <div className="home-tag">{HOME_TAGLINE}</div>
          </div>
          <h1 className="fs-question w-display">Where are you headed?</h1>
          <input className="fs-field" type="search" value={typed} onChange={(e) => setTyped(e.target.value)} placeholder="Search base or state" aria-label="Search for the base you are headed to" autoComplete="off" />
          {noList && loading ? <p className="w-caption fs-what" role="status">Loading the list of bases...</p> : null}
          {/* A failed load and an empty list are different things (App, loadBases): only the first offers Try again. */}
          {noList && !loading && loadFailed ? (
            <p className="fs-note fs-what" data-first="index-failed">Couldn't load the base guides. Check your connection and try again.
              <br /><button type="button" className="w-btn-quiet" onClick={onRetry}>Try again</button></p>
          ) : null}
          {matches.length ? (
            <ul className="fs-rows fs-matches">
              {matches.map((b) => (
                <li key={b.slug}>
                  {b.ready ? (
                    <button type="button" className="fs-row" data-first="match" onClick={() => onPick({ slug: b.slug, name: b.name })}>
                      <span><span className="fs-row-name">{b.name}</span><span className="fs-row-meta">{[b.branch, b.state].filter(Boolean).join(" · ")}</span></span>
                      <span className="fs-row-go"><Icon name="cardchev" size={20} /></span>
                    </button>
                  ) : (
                    <div className="fs-row"><span><span className="fs-row-name">{b.name}</span><span className="fs-row-meta">{[b.branch, b.state, "Guide coming soon"].filter(Boolean).join(" · ")}</span></span></div>
                  )}
                </li>
              ))}
            </ul>
          ) : (typedLower && !noList ? <p className="w-caption fs-what">No bases match.</p> : null)}
          {allMatches.length > matches.length ? <p className="w-caption fs-what">Showing the first {matches.length}. Keep typing to narrow the list.</p> : null}
          <p className="w-caption fs-what">Pick a base and it becomes My base: this screen then opens on it, with its local time, weather, guide and your next step.</p>
          <div className="fs-section fs-hint"><AddToHomeScreenHint /></div>
          <button type="button" className="w-btn-quiet" onClick={onBrowse}>Browse all bases</button>
          <SavedBasesShort bases={bases} saved={saved} myBaseSlug={null} account={account} inAccount={inAccount}
            onOpen={onOpen} onOpenSavedTab={() => onOpenTab("saved")} onOpenAccount={onOpenAccount} />
        </div>
      );
    }

    // The Home tab: the first screen, or the list behind "Browse all bases". `view` lives in the
    // App ("first" | "choose" | "browse") so that Back from a guide returns to the list the reader
    // opened it from; tapping the Home tab always returns to the first screen.
    function Home(props) {
      const { view, onView, bases, myBase, account, onSetMyBase } = props;
      useFirstScreenLook(view !== "browse");
      const shown = baseShownFirst(myBase, account, bases);
      // FIRST SCREEN MEMORY's rule: once the reader is known to have no base, the phone forgets the last one.
      const knownToHaveNone = !myBase.slug && !accountNotReadYet(account);
      useEffect(() => { if (knownToHaveNone) forgetFirstScreen(); }, [knownToHaveNone]);
      // The first screen opens at its top. Without this, coming back from a long guide left it
      // scrolled part of the way down, with the hero cut off (the page keeps its scroll across tabs).
      React.useLayoutEffect(() => { if (view !== "browse") window.scrollTo(0, 0); }, [view]);

      if (view === "browse") return <BrowseAllBases {...props} onBackToFirst={() => onView("first")} />;
      if (shown && view !== "choose") {
        return <MyBaseFirstScreen base={shown} bases={bases} saved={props.saved} account={account} inAccount={props.inAccount}
          onOpen={props.onOpen} onOpenAsk={props.onOpenAsk} onOpenMap={props.onOpenMap} onOpenTab={props.onOpenTab} onOpenAccount={props.onOpenAccount}
          onBrowse={() => onView("browse")} onChoose={() => onView("choose")} />;
      }
      const pick = (base) => { console.log(FIRST_LOG + " picked " + base.slug + " as My base"); onView("first"); onSetMyBase(base); };
      return <WhereHeadedScreen bases={bases} loading={props.loading} loadFailed={props.loadFailed} onRetry={props.onRetry}
        saved={props.saved} account={account} inAccount={props.inAccount} currentName={shown ? shown.name : null}
        onPick={pick} onKeep={() => onView("first")} onOpen={props.onOpen} onOpenTab={props.onOpenTab} onOpenAccount={props.onOpenAccount}
        onBrowse={() => onView("browse")} />;
    }

    // The list of every base: what Home was through 0.27, now behind "Browse all bases" on the
    // first screen. Kept whole (search, location, sort, the branch chips, picking My base on a
    // row); it lost only the coin, which belongs to the first screen, and gained a way back.
    function BrowseAllBases({ bases, loading, loadFailed, onRetry, onOpen, saved, onToggleSave, myBase, onSetMyBase, onBackToFirst }) {
      const [q, setQ] = useState("");
      const [branch, setBranch] = useState("all");
      const [loc, setLoc] = useState("all");
      const [sortBy, setSortBy] = useState("state");
      // Picking mode ("Add your base" on the row): the search box takes focus and every card gets a
      // one-tap "This is my base"; the first pick ends it. Nothing else on the list changes.
      const [picking, setPicking] = useState(false);
      const searchRef = useRef(null);
      const startPicking = () => { setPicking(true); setTimeout(() => { if (searchRef.current) searchRef.current.focus(); }, 0); };
      const pickMyBase = (base) => { setPicking(false); onSetMyBase(base); };
      const cardPick = picking ? pickMyBase : null;
      const top = (
        <>
          <button type="button" className="back" onClick={onBackToFirst}><Icon name="back" size={15} /> Home</button>
          <h2 className="screen-h">{FIND_A_BASE}</h2>
        </>
      );
      if (loading) return <div className="content">{top}<div className="center"><div className="spin" /></div></div>;
      // A failed load and a genuinely empty list are different things: only the second is "No bases yet".
      if ((!bases || !bases.length) && loadFailed) return (
        <div className="content">
          {top}
          <div className="center">
            <div>Couldn't load the base guides. Check your connection and try again.</div>
            <button className="btn-quiet" style={{ marginTop: 12 }} onClick={onRetry}>Try again</button>
          </div>
        </div>
      );
      if (!bases || !bases.length) return <div className="content">{top}<div className="center">No bases yet.</div></div>;

      const ql = q.trim().toLowerCase();
      const isJoint = (b) => {
        const s = (b.branch || "").toLowerCase(), n = (b.name || "").toLowerCase();
        return s.indexOf("/") !== -1 || n.indexOf("joint base") !== -1 || n.indexOf("jbsa") !== -1;
      };
      const matchBranch = (b) => {
        if (branch === "all") return true;
        if (branch === "joint") return isJoint(b);
        return (b.branch || "").toLowerCase().indexOf(branch) !== -1;  // a joint base shows under each of its services too
      };
      const matchLoc = (b) => loc === "all" || stateTokens(b.state).indexOf(loc) !== -1;
      const filtered = bases.filter((b) => matchBranch(b) && matchLoc(b) && baseMatchesSearch(b, ql));
      const locOptions = Array.from(new Set(bases.flatMap((b) => stateTokens(b.state)))).sort((a, b) => stateFull(a).localeCompare(stateFull(b)));

      let body;
      if (!filtered.length) {
        body = <div className="pending">No bases match your filters.</div>;
      } else if (sortBy === "name") {
        body = [...filtered].sort(byTierThenName)
          .map((b) => <BaseCard key={b.slug} b={b} bases={bases} onOpen={onOpen} saved={saved} onToggleSave={onToggleSave} onSetMyBase={cardPick} />);
      } else {
        const groups = {};
        filtered.forEach((b) => { const k = b.state || "Other"; (groups[k] = groups[k] || []).push(b); });
        const keys = Object.keys(groups).sort((a, b) => stateLabel(a).localeCompare(stateLabel(b)));
        keys.forEach((k) => groups[k].sort(byTierThenName));
        body = keys.map((k) => (
          <div key={k}>
            <div className="state-header">{stateLabel(k)}</div>
            {groups[k].map((b) => <BaseCard key={b.slug} b={b} bases={bases} onOpen={onOpen} saved={saved} onToggleSave={onToggleSave} onSetMyBase={cardPick} />)}
          </div>
        ));
      }

      return (
        <div className="content">
          {top}
          <MyBaseHomeRow myBase={myBase} bases={bases} onOpen={onOpen} onPick={startPicking} picking={picking} />
          <div className="home-controls">
            {picking ? <div className="pick-hint mybase-hint" role="status">Search for your base, then tap "This is my base" on it.</div> : null}
            <input ref={searchRef} className="fld home-search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search base or state" />
            <div className="home-selects">
              <select className="fld" value={loc} onChange={(e) => setLoc(e.target.value)}>
                <option value="all">All locations</option>
                {locOptions.map((t) => <option key={t} value={t}>{stateFull(t)}</option>)}
              </select>
              <select className="fld" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                <option value="state">Sort: by state</option>
                <option value="name">Sort: name (A-Z)</option>
              </select>
            </div>
            <div className="chips">
              {BRANCH_FILTERS.map(([k, l]) => <button key={k} className={"chip pick" + (branch === k ? " chip-on" : "")} onClick={() => setBranch(k)}>{l}</button>)}
            </div>
          </div>
          {body}
        </div>
      );
    }

    // Local time at the base (ticks). tz is an IANA zone on the base record.
    function LocalTime({ tz }) {
      const words = useClockAt(tz);
      return words ? <div className="localtime">{words} local time</div> : null;
    }

    function BaseDetail({ slug, onBack, backLabel, focusAsk, saved, onToggleSave, myBase, onSetMyBase }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [openId, setOpenId] = useState(null);
      const [story, setStory] = useState(null);
      useEffect(() => {
        let live = true;
        setData(null); setErr(null); setStory(null);
        fetchJSON(baseUrl(slug)) // per-base fetch ON DEMAND - the architecture in action
          .then((d) => { if (live) { setData(d); setOpenId(d.sections && d.sections[0] ? d.sections[0].id : null); } })
          .catch((e) => { if (live) setErr(e.message); });
        // The story is a separate on-demand fetch. Most bases have none (404), and a failed story
        // fetch must never block the guide, so any error just means "no story section".
        const url = storyUrl(slug);
        if (url) fetchJSON(url).then((d) => { if (live) setStory(d); }).catch(() => {});
        return () => { live = false; };
      }, [slug]);

      if (err) return <div className="content"><BackToList onBack={onBack} label={backLabel} /><div className="center">Could not load this guide.<br />{err}</div></div>;
      if (!data) return <div className="content"><BackToList onBack={onBack} label={backLabel} /><div className="center"><div className="spin" /></div></div>;

      return (
        <div className="content">
          <BackToList onBack={onBack} label={backLabel} />
          <div className="basehero" style={{ borderTopColor: branchColor(data.branch) }}>
            <div className="between">
              <h1>{data.name}</h1>
              <div className="basehero-actions">
                {/* "This is my base" sets this guide as the reader's base (MY BASE store); pressed again it
                    clears it. The App shows the outcome and names the base it replaced. */}
                <button type="button" className={"mybase-btn" + (myBase.slug === slug ? " on" : "")} aria-pressed={myBase.slug === slug}
                  onClick={() => onSetMyBase(myBase.slug === slug ? null : { slug, name: data.name })}>
                  <Icon name="home" size={14} />{myBase.slug === slug ? "My base" : "This is my base"}
                </button>
                <button className="iconbtn" style={saved.includes(slug) ? { color: "var(--accent)" } : null} onClick={() => onToggleSave(slug)} aria-label="Save">
                  <Icon name={saved.includes(slug) ? "bookmarkOn" : "bookmark"} size={20} />
                </button>
              </div>
            </div>
            {data.tagline ? <div className="tag">{data.tagline}</div> : null}
            <div className="basehero-meta">{[data.branch, (data.states || []).join(" / ")].filter(Boolean).join("  ·  ")}</div>
            <LocalTime tz={data.tz} />
          </div>
          <LiveWeather coords={data.coords} />
          <AskBox slug={slug} sections={data.sections || []} focusOnOpen={focusAsk} onOpenSection={(id) => {
            setOpenId(id);
            setTimeout(() => { const el = document.getElementById("sec-" + id); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
          }} />
          <div style={{ marginTop: 12 }}>
            {withStorySection(data.sections || [], story).map((s) => (
              <Accordion key={s.id} s={s} coords={data.coords}
                open={openId === s.id}
                onToggle={() => setOpenId(openId === s.id ? null : s.id)} />
            ))}
          </div>
          <div className="feedback">
            <span className="feedback-q">Stationed here or spot something off?</span>
            <a className="feedback-link" href={"mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Base guide feedback: " + data.name) + "&body=" + encodeURIComponent("Base: " + data.name + "\n\nType (correction / clarification / enhancement):\n\nDetails:\n")} target="_blank" rel="noopener noreferrer">Suggest a correction or improvement</a>
            <div className="feedback-note">Real families keep these guides accurate. Thank you.</div>
          </div>
          {/* Every guide here has the same page on the website (a post of a joint base has its own page too),
              so the link always uses this guide's slug. The website has the parts the app leaves out: the map
              of towns and schools, the compare and rank tools. */}
          <div className="website-guide-link">
            <a href={WEBSITE_URL + "/bases/" + encodeURIComponent(slug)} target="_blank" rel="noopener noreferrer">Read this guide on the website</a>
          </div>
        </div>
      );
    }

    // ---- PCS timeline (general guidance; user confirms specifics with orders/TMO) ----
    const PCS_BUCKETS = [
      { key: "d90", label: "90+ days out", offset: -90, tasks: ["Read the installation guide; shortlist neighborhoods", "Decide on-base (join the waitlist) vs off-base", "If buying: get pre-approved; connect with a base-area lender/realtor"] },
      { key: "d60", label: "~60 days out", offset: -60, tasks: ["Schedule your household goods (HHG) move with the transportation office", "Start medical/dental records transfer (note EFMP if it applies)", "Research schools and request enrollment requirements"] },
      { key: "d30", label: "~30 days out", offset: -30, tasks: ["Confirm move dates; arrange temporary lodging (TLE/TLA)", "Give notice to your landlord or list your home; schedule utilities", "Update DEERS; gather in-processing paperwork"] },
      { key: "d14", label: "~2 weeks out", offset: -14, tasks: ["Confirm pack-out dates with the movers", "Finalize travel (route/flights, pets, lodging en route)", "Change bank/address; set aside documents to hand-carry"] },
      { key: "week", label: "Move week", offset: -3, tasks: ["Supervise pack-out; photograph and keep your own inventory", "Final walkthrough; cancel local utilities", "Hand-carry: orders, IDs, medical records, valuables"] },
      { key: "arr", label: "Arrival", offset: 0, tasks: ["In-process at the installation; report to your unit", "Pick up keys / begin off-base move-in", "Set up utilities, internet, and vehicle registration"] },
      { key: "post", label: "First 30 days", offset: 14, tasks: ["Enroll kids in school; transfer TRICARE/medical", "Register vehicles per the state; update license & insurance", "Locate essentials: commissary, MTF, childcare, MWR"] },
    ];
    const PCS_MILESTONES = [
      { label: "Schedule HHG move", offsetDays: -60 }, { label: "Confirm dates & lodging", offsetDays: -30 },
      { label: "Pack-out week", offsetDays: -5 }, { label: "Move day", offsetDays: 0 },
      { label: "In-process at new base", offsetDays: 1 }, { label: "School & vehicle registration", offsetDays: 14 },
    ];
    function fmtDate(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
    function addDays(base, n) { const d = new Date(base); d.setDate(d.getDate() + n); return d; }
    function daysUntil(d) { return Math.ceil((d - new Date()) / 86400000); }
    function icsPad(n) { return String(n).padStart(2, "0"); }
    function icsDate(d) { return d.getFullYear() + icsPad(d.getMonth() + 1) + icsPad(d.getDate()); }
    function buildICS(moveDate, baseName) {
      const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MilSpo Living//Base Guides//EN", "CALSCALE:GREGORIAN"];
      PCS_MILESTONES.forEach((m, i) => {
        const d = addDays(moveDate, m.offsetDays);
        L.push("BEGIN:VEVENT", "UID:milspo-" + i + "-" + icsDate(d) + "@milspoliving",
          "DTSTART;VALUE=DATE:" + icsDate(d), "DTEND;VALUE=DATE:" + icsDate(addDays(d, 1)),
          "SUMMARY:PCS - " + m.label, "DESCRIPTION:" + (baseName ? "PCS to " + baseName : "PCS milestone") + " (MilSpo Living)", "END:VEVENT");
      });
      L.push("END:VCALENDAR"); return L.join("\r\n");
    }
    function downloadFile(text, filename, mime) {
      const b = new Blob([text], { type: mime }); const u = URL.createObjectURL(b);
      const a = document.createElement("a"); a.href = u; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
    }

    // "Moving to" on the PCS checklist: type a few letters, tap the base.
    // RULE (auditor round 3, item 26; Chris's card 2026-11-24 "The clear fixes, one batch"): this was
    // a dropdown of every base in the index (553 options on a phone), and it listed the Joint Base
    // San Antonio hub entry that Home hides. It now finds a base by BASE SEARCH, the rule Home uses.
    // The move date beside it stays the phone's own date picker: the most reliable date control.
    // The stored value is unchanged (bg_pcs.base, a slug), so a plan made before this still shows,
    // also one that names the hub.
    const PLAN_BASE_MATCHES_SHOWN = 8; // the same count as the account screen's My base search
    function PlanBaseField({ bases, slug, onChange }) {
      const [typed, setTyped] = useState("");
      const [searching, setSearching] = useState(false);
      const chosen = slug ? (bases || []).find((b) => b.slug === slug) : null;
      // Before the base list has loaded the slug is all there is; it reads well enough for a moment.
      const chosenName = chosen ? chosen.name : (slug ? slug.replace(/-/g, " ") : "");
      const typedLower = typed.trim().toLowerCase();
      const allMatches = typedLower ? (bases || []).filter((b) => baseMatchesSearch(b, typedLower)).sort(byTierThenName) : [];
      const matches = allMatches.slice(0, PLAN_BASE_MATCHES_SHOWN);
      const pick = (b) => { onChange(b.slug); setTyped(""); setSearching(false); };
      if (slug && !searching) {
        return (
          <div className="plan-base" data-plan-base="set">
            <span className="plan-base-name">{chosenName}</span>
            <button type="button" className="btn-quiet" onClick={() => { setTyped(""); setSearching(true); }}>Change</button>
            <button type="button" className="btn-quiet" onClick={() => onChange("")}>Clear</button>
          </div>
        );
      }
      return (
        <div data-plan-base="search">
          <input id="plan-base" className="fld" type="search" value={typed} onChange={(e) => setTyped(e.target.value)} placeholder="Search base or state" autoFocus={searching} />
          {matches.length ? (
            <ul className="lst plan-base-matches">
              {matches.map((b) => (
                <li key={b.slug}>
                  <button type="button" className="plan-base-match" onClick={() => pick(b)}>
                    <span className="t">{b.name}</span>
                    <span className="d">{[b.branch, b.state].filter(Boolean).join("  -  ")}</span>
                  </button>
                </li>
              ))}
            </ul>
          ) : (typedLower ? <div className="faint tiny" style={{ marginTop: 6 }}>No bases match.</div> : null)}
          {allMatches.length > matches.length ? <div className="faint tiny" style={{ marginTop: 6 }}>Showing the first {matches.length}. Keep typing to narrow the list.</div> : null}
          {slug ? <button type="button" className="btn-quiet" style={{ marginTop: 6 }} onClick={() => setSearching(false)}>Cancel</button> : null}
        </div>
      );
    }

    function PlanScreen({ bases, onOpen }) {
      const [pcs, setPcs] = useState(() => LS.get("bg_pcs", { moveDate: "", base: "" }));
      const [done, setDone] = useState(() => LS.get("bg_pcs_done", {}));
      const save = (next) => { setPcs(next); LS.set("bg_pcs", next); };
      const toggleDone = (id) => setDone((p) => { const n = { ...p, [id]: !p[id] }; LS.set("bg_pcs_done", n); return n; });
      const move = pcs.moveDate ? new Date(pcs.moveDate + "T00:00:00") : null;
      const baseObj = bases ? bases.find((b) => b.slug === pcs.base) : null;
      const until = move ? daysUntil(move) : null;
      return (
        <div className="content">
          <h2 className="screen-h">{PCS_CHECKLIST}</h2>
          <div className="card">
            <label className="fld-l" htmlFor="plan-move-date">Move date</label>
            <input id="plan-move-date" className="fld" type="date" value={pcs.moveDate} onChange={(e) => save({ ...pcs, moveDate: e.target.value })} />
            <label className="fld-l" htmlFor="plan-base" style={{ marginTop: 12 }}>Moving to</label>
            <PlanBaseField bases={bases} slug={pcs.base} onChange={(slug) => save({ ...pcs, base: slug })} />
          </div>
          {!move ? <div className="pending" style={{ padding: "6px 2px" }}>Enter your move date to put a date on each step.</div> : (
            <div>
              <div className="muted small" style={{ margin: "4px 2px 12px" }}>{until >= 0 ? until + " days until your move (" + fmtDate(move) + ")" : "Move date was " + fmtDate(move)}</div>
              {baseObj && until != null && until >= 0 && until <= 90 ? (
                <div className="bridge">
                  <div className="bridge-h">Talk to a vetted realtor at {baseObj.name}</div>
                  <p>You're about {until} days out - a good time to connect with a {baseObj.name}-area realtor who knows the neighborhoods, schools, and the buy-vs-rent math. No pressure, no spam.</p>
                  <a className="btn-gold" href={"mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Realtor intro for " + baseObj.name) + "&body=" + encodeURIComponent("I'm PCSing to " + baseObj.name + " around " + fmtDate(move) + " and would like an introduction to a vetted realtor.")}>Request an introduction</a>
                </div>
              ) : null}
              <div className="between" style={{ margin: "4px 2px 10px" }}>
                <h3 style={{ fontSize: 16 }}>Your steps, by date</h3>
                <button className="btn-quiet" onClick={() => downloadFile(buildICS(move, baseObj ? baseObj.name : ""), "pcs-timeline.ics", "text/calendar")}><Icon name="download" size={15} /> Add to calendar</button>
              </div>
              {PCS_BUCKETS.map((bk) => {
                const d = addDays(move, bk.offset);
                return (
                  <div className="acc open" key={bk.key} style={{ marginBottom: 10 }}>
                    <div className="acc-head" style={{ cursor: "default" }}>
                      <span className="sec-ic"><Icon name="calendar" size={16} /></span>
                      <h3 style={{ fontSize: 15, flex: 1 }}>{bk.label}</h3>
                      <span className="muted tiny">{fmtDate(d)}</span>
                    </div>
                    <div className="acc-body">
                      {bk.tasks.map((t, i) => {
                        const id = bk.key + "-" + i;
                        return (
                          <label key={i} className="task">
                            <input type="checkbox" checked={!!done[id]} onChange={() => toggleDone(id)} />
                            <span className={done[id] ? "task-done" : ""}>{t}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              <div className="srcline">General PCS guidance - confirm specifics with your orders, the transportation office (TMO), and your installation.</div>
            </div>
          )}
        </div>
      );
    }

    // One line under the saved list about where the list lives. RULE (website; Chris, "After they
    // try a tool"): the account is offered only after a tool was used, so the offer appears under a
    // list that has something in it, never on an empty screen.
    function SavedWhereLine({ account, inAccount, onOpenAccount }) {
      if (account.status === "off" || account.status === "loading") return null;
      if (inAccount) return <div className="faint tiny" style={{ margin: "2px 2px 12px" }}>Kept in your account and shown on every device you sign in on.</div>;
      if (account.status === "signed-out") return (
        <div className="muted small saved-where">
          <span>Saved on this phone only.</span>
          <button className="btn-quiet" onClick={onOpenAccount}>Sign in to keep them on every device</button>
        </div>
      );
      return null;
    }

    function SavedScreen({ bases, saved, onToggleSave, onOpen, account, inAccount, onOpenAccount }) {
      const list = (bases || []).filter((b) => saved.includes(b.slug));
      const explained = <p className="faint tiny saved-explained">{savedExplained(inAccount)}</p>;
      if (!list.length) return <div className="content"><h2 className="screen-h">Saved</h2><div className="center">No saved bases yet.<br />Tap the bookmark on a base to save it here.</div>{explained}</div>;
      // Only a base with a guide can be compared ("Coming soon" has no page on the website).
      const slugsWithGuide = list.filter((b) => b.ready).map((b) => b.slug);
      return (
        <div className="content">
          <h2 className="screen-h">Saved</h2>
          <SavedWhereLine account={account} inAccount={inAccount} onOpenAccount={onOpenAccount} />
          {list.map((b) => (
            <div key={b.slug} className={"card" + (b.ready ? " tap" : "")} onClick={() => b.ready && onOpen(b.slug)}>
              <div className="between">
                <div style={{ minWidth: 0 }}>
                  <div className="base-name">{b.name}{b.ready ? null : <span className="pill soon">Coming soon</span>}</div>
                  <div className="meta-line">{[b.branch, b.state].filter(Boolean).join("  -  ")}</div>
                  <ParentLine b={b} bases={bases} />
                </div>
                <div className="card-actions">
                  <button className="iconbtn" style={{ color: "var(--accent)" }} onClick={(e) => { e.stopPropagation(); onToggleSave(b.slug); }} aria-label="Remove"><Icon name="bookmarkOn" size={18} /></button>
                  {b.ready ? <span className="card-go"><Icon name="cardchev" size={20} /></span> : null}
                </div>
              </div>
            </div>
          ))}
          <CompareSavedLink slugs={slugsWithGuide} />
          {explained}
        </div>
      );
    }

    /* ---------------- ACCOUNT SCREENS ---------------- */
    // A password box with its rule beside it and a Show / Hide switch (the contract: "at least 12
    // characters, say so beside the field; show/hide toggle"). autoComplete is "current-password" to
    // sign in and "new-password" to set one, so a password manager offers the right thing.
    function PasswordField({ id, label, autoComplete, value, onChange, showRule = true }) {
      const [shown, setShown] = useState(false);
      return (
        <div className="pw-field">
          <label className="fld-l" htmlFor={id}>{label}</label>
          <div className="acct-name">
            <input id={id} className="fld" type={shown ? "text" : "password"} autoComplete={autoComplete} autoCapitalize="none" autoCorrect="off" spellCheck={false}
              maxLength={PASSWORD_MAX_CHARS} value={value} onChange={(e) => onChange(e.target.value)} aria-describedby={showRule ? id + "-rule" : undefined} />
            <button type="button" className="btn-quiet" aria-pressed={shown} aria-controls={id} onClick={() => setShown(!shown)}>{shown ? "Hide" : "Show"}</button>
          </div>
          {showRule ? <div id={id + "-rule"} className="faint tiny pw-rule" data-pw-rule={value.length >= PASSWORD_MIN_CHARS ? "met" : "short"}>{SIGN_IN_TEXT.passwordRule}</div> : null}
        </div>
      );
    }

    // The Password row of the account screen (optional; ACCOUNT, RULES, and PASSWORD_MIN_CHARS).
    // With one (account.passwordSet, from the metadata flag): "Set" and "Change", which asks for the
    // current password too ("secure password change" may require it). Without: "Not set" and "Set a
    // password", new password only; if Supabase still answers that it wants the current one, that
    // box appears. Both boxes are emptied after every try, whatever the answer.
    function PasswordRow({ account }) {
      const [editing, setEditing] = useState(false);
      const [askCurrent, setAskCurrent] = useState(false);
      const [current, setCurrent] = useState("");
      const [next, setNext] = useState("");
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const [done, setDone] = useState("");
      const known = !!account.passwordSet;
      const needCurrent = known || askCurrent;
      const open = () => { setEditing(true); setAskCurrent(false); setCurrent(""); setNext(""); setMessage(""); setDone(""); };
      const close = () => { setEditing(false); setCurrent(""); setNext(""); setMessage(""); };
      const save = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await setPassword(next, needCurrent ? current : "");
        setBusy(false);
        setCurrent(""); setNext("");
        if (result === "ok") { setEditing(false); setDone(known ? "Your password is changed." : "Your password is set. You can sign in with it or with a code."); return; }
        if (result === "current-needed") setAskCurrent(true);
        setMessage(PASSWORD_MESSAGE[result] || PASSWORD_MESSAGE.failed);
      };
      if (!editing) {
        return (
          <dd data-password-row={known ? "set" : "not-set"}>
            <div className="acct-name">
              <span>{known ? "Set" : "Not set"}</span>
              <button type="button" className="btn-quiet" onClick={open}>{known ? "Change" : "Set a password"}</button>
            </div>
