    /* ---------------- STORY (the website's long-form story, from the shared database) ----------------
       RULE (Chris, decision card 2026-11-22): the app shows the same story as milspoliving.com.
       The story files in the website repo are the source; the backend serves the copy in the
       guide_stories table with its figures already filled by the database function the website
       uses. So this code only draws what it is given. The one number it works out is the worked-
       example total: each stored row is ONE year of dollars, times the years, then added up - the
       website's rule (src/lib/guide-math.ts), so a typed total can never disagree with its rows.
       ACCURACY: a figure the database could not fill arrives as "[figure missing]" and the backend
       counts them (missing_figures); the story then shows a notice instead of passing it silently.
       A block with the wrong shape is skipped, not guessed (the website's parseBlock rule). */
    const STORY_SECTION_ID = "where_to_live";
    const STORY_SECTION_TITLE = "Where to live"; // the website's name for the story part of a guide

    /* WHERE THE STORY GOES: right after the decision section (type "killer"), which is where the
       website shows it - inside the decision part, or as its own part just after it when the story
       has a section title. Without a decision section it goes second. */
    function withStorySection(sections, story) {
      if (!story || !Array.isArray(story.blocks) || story.blocks.length === 0) return sections;
      const storySection = { id: STORY_SECTION_ID, type: "story", title: story.section_title || STORY_SECTION_TITLE, data: story };
      const decisionAt = sections.findIndex((s) => s.type === "killer");
      const at = decisionAt >= 0 ? decisionAt + 1 : Math.min(1, sections.length);
      return [...sections.slice(0, at), storySection, ...sections.slice(at)];
    }

    const storyText = (v) => (typeof v === "string" ? v.trim() : "");
    const storyTextList = (v) => (Array.isArray(v) ? v.map(storyText).filter(Boolean) : []);
    const storyDollars = (v) => (typeof v === "number" && isFinite(v) && v >= 0 ? Math.round(v) : null);
    const formatDollars = (n) => "$" + n.toLocaleString("en-US");

    // One block in the shape the renderer can draw, or null (the same checks as the website).
    function storyBlockShape(raw) {
      if (!raw || typeof raw !== "object") return null;
      const t = storyText(raw.t);
      if (["head", "subhead", "p", "pullquote", "disclaimer"].includes(t)) {
        const text = storyText(raw.text);
        return text ? { t, text } : null;
      }
      if (t === "math") {
        const sides = storyTextList(raw.sides);
        const years = storyDollars(raw.years);
        const rows = (Array.isArray(raw.rows) ? raw.rows : []).map((r) => {
          const a = storyDollars(r && r.a), b = storyDollars(r && r.b), label = storyText(r && r.label);
          return a === null || b === null || !label ? null : { label, a, b, how: storyText(r.how) };
        }).filter(Boolean);
        if (sides.length !== 2 || !years || rows.length === 0) return null;
        return { t, label: storyText(raw.label) || "By the numbers", title: storyText(raw.title), sides, years, rows,
                 assumptions: storyTextList(raw.assumptions), note: storyText(raw.note) };
      }
      if (t === "sidebar") {
        const paragraphs = storyTextList(raw.paragraphs);
        const scenarios = (Array.isArray(raw.scenarios) ? raw.scenarios : [])
          .map((x) => ({ tag: storyText(x && x.tag), text: storyText(x && x.text) })).filter((x) => x.text);
        if (paragraphs.length === 0 && scenarios.length === 0) return null;
        return { t, label: storyText(raw.label), title: storyText(raw.title), paragraphs, scenarios, foot: storyText(raw.foot) };
      }
      if (t === "places") {
        const items = (Array.isArray(raw.items) ? raw.items : [])
          .map((x) => ({ name: storyText(x && x.name), stat: storyText(x && x.stat), text: storyText(x && x.text) }))
          .filter((x) => x.name && x.text);
        return items.length ? { t, items } : null;
      }
      return null;
    }

    function StoryMath({ b }) {
      const rows = b.rows.map((r) => ({ ...r, a: r.a * b.years, b: r.b * b.years }));
      const totalA = rows.reduce((sum, r) => sum + r.a, 0);
      const totalB = rows.reduce((sum, r) => sum + r.b, 0);
      const span = b.years === 1 ? "one year" : b.years + " years";
      return (
        <div className="story-box">
          <div className="story-label">{b.label}, cost over {span}</div>
          {b.title ? <div className="story-title">{b.title}</div> : null}
          <table className="dec">
            <thead><tr><th>Cost</th><th className="num">{b.sides[0]}</th><th className="num">{b.sides[1]}</th></tr></thead>
            <tbody>
              {rows.map((r, i) => (
                <React.Fragment key={i}>
                  <tr className={r.how ? "story-has-how" : null}>
                    <td>{r.label}</td><td className="num">{formatDollars(r.a)}</td><td className="num">{formatDollars(r.b)}</td>
                  </tr>
                  {/* The working of a row spans the table so the figures keep their width on a phone. */}
                  {r.how ? <tr className="story-how"><td colSpan={3}>A year: {r.how}</td></tr> : null}
                </React.Fragment>
              ))}
              <tr className="story-total"><td>Total over {span}</td><td className="num">{formatDollars(totalA)}</td><td className="num">{formatDollars(totalB)}</td></tr>
            </tbody>
          </table>
          {b.assumptions.length ? (
            <div className="story-small">What the example assumes:<ul>{b.assumptions.map((x, i) => <li key={i}>{x}</li>)}</ul></div>
          ) : null}
          {b.note ? <p style={{ marginTop: 8 }}>{b.note}</p> : null}
        </div>
      );
    }

    function StoryBlock({ b }) {
      switch (b.t) {
        case "head": return <h4 className="story-h">{b.text}</h4>;
        case "subhead": return <div className="story-sh">{b.text}</div>;
        case "p": return <p>{b.text}</p>;
        case "pullquote": return <blockquote className="story-quote">{b.text}</blockquote>;
        case "disclaimer": return <p className="story-disclaimer">{b.text}</p>;
        case "math": return <StoryMath b={b} />;
        case "sidebar":
          return (
            <div className="story-box">
              {b.label ? <div className="story-label">{b.label}</div> : null}
              {b.title ? <div className="story-title">{b.title}</div> : null}
              {b.paragraphs.map((x, i) => <p key={i}>{x}</p>)}
              {b.scenarios.length ? (
                <ul>{b.scenarios.map((x, i) => <li key={i}>{x.tag ? <strong>{x.tag}: </strong> : null}{x.text}</li>)}</ul>
              ) : null}
              {b.foot ? <div className="story-small">{b.foot}</div> : null}
            </div>
          );
        case "places":
          return (
            <ul className="lst" style={{ margin: "8px 0 12px" }}>
              {b.items.map((x, i) => (
                <li key={i}><div className="t">{x.name}{x.stat ? <span className="faint"> &middot; {x.stat}</span> : null}</div><div className="d">{x.text}</div></li>
              ))}
            </ul>
          );
        default: return null;
      }
    }

    function StoryBody({ data }) {
      const blocks = (data.blocks || []).map(storyBlockShape).filter(Boolean);
      // Only labelled http(s) links, the website's rule (the backend applies it too).
      const sources = (data.sources || []).filter((x) => x && x.label && /^https?:\/\//i.test(x.url || ""));
      return (
        <div>
          {data.missing_figures > 0 ? (
            <div className="live-note story-missing">Some figures in this story could not be loaded right now and show as "[figure missing]". Check the sources below.</div>
          ) : null}
          {blocks.map((b, i) => <StoryBlock key={i} b={b} />)}
          {sources.length ? (
            <div className="story-sources">
              Sources

                ))}

    }

    function SectionBody({ s, coords }) {

        case "rentbuy": return <RentBuy data={s.data} />;
        case "pcs_first30": return <PCSFirst30 data={s.data} />;
        case "faq": return <FAQ data={s.data} />;
        case "story": return <StoryBody data={s.data} />;
        case "places_pending":
          return <div className="live-note">{s.note || "Live nearby recommendations (Google Places) appear here in the app."}</div>;

    }
    // Accuracy provenance: a section's official source travels with it, next to its check line.
    //
    // RULE (Chris, decision card 2026-11-23, "Convert to advice"): a June 2026 section that no
    // official page could confirm has been rewritten as plain advice. It carries "advice": true and
    // "confirm_with" (who to ask) and NO "verified" date, and shows "Our advice. Confirm with <who>."
    // where other sections show their date - the same words milspoliving.com uses
    // (src/lib/guide-check-notes.ts in the website repo).
    // ACCURACY RULE: an advice section is NEVER shown as checked or dated. Advice is tested first,
    // so even a stray "verified" left on one cannot surface: a date would claim an official page
    // confirmed it, and nothing in advice is a fact a page can confirm. Its source link stays,
    // because that is where the reader goes to confirm.
    // A section with no date and no advice shows its source alone, or no line at all.
    function sectionCheckLine(s) {
      if (s.advice) {
        const confirmWith = typeof s.confirm_with === "string" ? s.confirm_with.trim() : "";
        return confirmWith ? "Our advice. Confirm with " + confirmWith + "." : "Our advice.";
      }
      // Same word as the website ("Checked <date>"), so a family reads one term in both places
      // (Chris, decision card 2026-11-23 "Use 'Checked' in the app").
      return s.verified ? "Checked " + s.verified : "";
    }
    function SrcLine({ s }) {
      const checkLine = sectionCheckLine(s);
      if (!s.source && !checkLine) return null;
      return (
        <div className="srcline">
          {s.source ? <a href={s.source.url} target="_blank" rel="noopener noreferrer">Source: {s.source.label}</a> : null}
          {s.source && checkLine ? " · " : null}
          {checkLine ? <span>{checkLine}</span> : null}
        </div>
      );
    }
    function Accordion({ s, open, onToggle, coords }) {
      return (
        <div className={"acc" + (open ? " open" : "")} id={"sec-" + s.id}>
          <div className="acc-head" onClick={onToggle}>
            <span className="sec-ic"><Icon name={sectionIcon(s.id)} size={18} /></span>
            <h3>{sectionName(s)}</h3>
            <span className="acc-chev"><Icon name="chevron" size={18} /></span>
          </div>
          {open ? <div className="acc-body"><SectionBody s={s} coords={coords} /><SrcLine s={s} /></div> : null}
        </div>

    }

    // Tiny markdown renderer (AI answers come back as markdown). Builds React
    // nodes (no dangerouslySetInnerHTML). Handles bold, links, headings, lists,
    // blockquotes, and horizontal rules - enough for the assistant's output.
    // RULE (auditor round 2, item 21; Chris 2026-11-24): no markdown mark may show as text. Bold,
    // italic and links are drawn; a mark the model left unpaired (a lone "**" or "*") is dropped, and
    // a doubled quote ("") becomes one quote. Dropping is safer than showing: a stray asterisk reads
    // as a footnote that never comes.
    function mdClean(text) {
      return String(text).replace(/""+/g, '"').replace(/''+/g, "'");
    }
    function mdStripMarks(text) { return String(text).replace(/\*\*/g, "").replace(/(^|\s)\*(?=\s|$)/g, "$1"); }
    function mdInline(text, kp) {
      const nodes = []; let rest = mdClean(text); let k = 0;
      const re = /(\*\*([^*]+)\*\*)|(\[([^\]]+)\]\((https?:[^)]+)\))|(\*([^*\s][^*]*?)\*)/;
      while (rest.length) {
        const m = rest.match(re);
        if (!m) { nodes.push(mdStripMarks(rest)); break; }
        if (m.index > 0) nodes.push(mdStripMarks(rest.slice(0, m.index)));
        if (m[1]) nodes.push(<strong key={kp + "b" + (k++)}>{m[2]}</strong>);
        else if (m[3]) nodes.push(<a key={kp + "l" + (k++)} href={m[5]} target="_blank" rel="noopener noreferrer">{m[4]}</a>);
        else nodes.push(<em key={kp + "i" + (k++)}>{m[7]}</em>);
        rest = rest.slice(m.index + m[0].length);
      }
      return nodes;
    }
    function Markdown({ text }) {
      const lines = String(text).replace(/\r/g, "").split("\n");
      const blocks = []; let para = [], list = [];
      const flushP = () => { if (para.length) { blocks.push({ t: "p", x: para.join(" ") }); para = []; } };
      const flushL = () => { if (list.length) { blocks.push({ t: "ul", items: list.slice() }); list = []; } };
      for (const ln of lines) {
        const s = ln.trim();
        if (!s) { flushP(); flushL(); continue; }
        if (/^###\s+/.test(s)) { flushP(); flushL(); blocks.push({ t: "h3", x: s.replace(/^###\s+/, "") }); }
        else if (/^#{1,2}\s+/.test(s)) { flushP(); flushL(); blocks.push({ t: "h2", x: s.replace(/^#{1,2}\s+/, "") }); }
        else if (/^[-*]\s+/.test(s)) { flushP(); list.push(s.replace(/^[-*]\s+/, "")); }
        else if (/^\d+[.)]\s+/.test(s)) { flushP(); list.push(s.replace(/^\d+[.)]\s+/, "")); }
        else if (/^>\s?/.test(s)) { flushP(); flushL(); blocks.push({ t: "q", x: s.replace(/^>\s?/, "") }); }
        else if (/^---+$/.test(s)) { flushP(); flushL(); blocks.push({ t: "hr" }); }
        else { flushL(); para.push(s); }
      }
      flushP(); flushL();
      return (
        <div className="md">
          {blocks.map((b, i) => {
            if (b.t === "h2") return <h3 key={i} className="md-h">{mdInline(b.x, "h" + i)}</h3>;
            if (b.t === "h3") return <div key={i} className="md-h3">{mdInline(b.x, "h" + i)}</div>;
            if (b.t === "ul") return <ul key={i} className="md-ul">{b.items.map((it, j) => <li key={j}>{mdInline(it, "li" + i + "_" + j)}</li>)}</ul>;
            if (b.t === "q") return <div key={i} className="md-quote">{mdInline(b.x, "q" + i)}</div>;
            if (b.t === "hr") return <hr key={i} className="md-hr" />;
            return <p key={i}>{mdInline(b.x, "p" + i)}</p>;
          })}
        </div>
      );
    }

    // SOURCE CHIPS (auditor round 2, item 21; Chris 2026-11-24). RULE: every answer names the guide
    // sections it drew on, as tappable chips that open that section.
    //
    // WHERE THE CHIPS COME FROM (Chris, decision card 2026-11-26, "App chips": "Build it"): the
    // backend names the sections an answer used (relay field `sections`, asked for with
    // `want_sections`; backend 0.4.0). Those are the chips: see namedChips below.
    // RULE (same card): when the answer used no section, or the model did not say, NO chip is
    // shown. A guessed chip under an "I don't have that" answer would point at a source that
    // did not answer the question.
    //
    // THE GUESS BELOW (sourceChips) IS THE FALLBACK FOR AN OLD BACKEND ONLY: one that answers
    // without a `sections` field. It matches the answer against each section's own words: one
    // point for every distinct word of six letters or more that the answer and the section share,
    // plus three when the answer names the section's title; the three best with at least three
    // points are shown. WARNING: that is a match, not the model's own statement. ROAD NOT TAKEN:
    // using the guess whenever the backend names nothing (the second option on the card).
    function sectionText(sec) {
      const d = sec && sec.data;
      if (!d) return "";
      if (typeof d === "string") return d;
      if (Array.isArray(d)) return d.map((x) => (typeof x === "string" ? x : JSON.stringify(x))).join(" ");
      return JSON.stringify(d);
    }
    function longWords(text) {
      return new Set(String(text).toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter((w) => w.length >= 6));
    }
    function sourceChips(answer, sections) {
      if (!answer || !sections || !sections.length) return [];
      const aw = longWords(answer);
      const al = String(answer).toLowerCase();
      return sections
        .filter((sec) => sec && sec.id && sec.title && sec.type !== "pending" && sec.type !== "places_pending")
        .map((sec) => {
          let score = 0;
          longWords(sectionText(sec)).forEach((w) => { if (aw.has(w)) score += 1; });
          // An answer may name a part by its stored title (what the model was given) or by the
          // name on screen (SECTION NAMES); either counts. The chip shows the name on screen.
          const shownName = sectionName(sec);
          if ([sec.title, shownName].some((name) => al.indexOf(String(name).toLowerCase()) !== -1)) score += 3;
          return { id: sec.id, title: shownName, score };
        })
        .filter((x) => x.score >= 3)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);
    }

    // The chips for the sections the backend named, in the backend's order.
    // RULE (accuracy; the same rule as the backend's own check): a chip is shown only for a
    // section this guide really has on screen and that is not unverified. An id the app does not
    // know is left out: a chip that opens nothing is worse than no chip.
    function namedChips(named, sections) {
      const byId = new Map((sections || [])
        .filter((sec) => sec && sec.id && sec.type !== "pending" && sec.type !== "places_pending")
        .map((sec) => [sec.id, sec]));
      const chips = [];
      (named || []).forEach((entry) => {
        const sec = entry && byId.get(entry.id);
        if (sec && !chips.some((chip) => chip.id === sec.id)) chips.push({ id: sec.id, title: sectionName(sec) });
      });
      return chips.slice(0, 3);
    }

    // "Ask about this base" - grounded AI Q&A via the backend.
    function AskBox({ slug, sections, onOpenSection, focusOnOpen }) {
      const [q, setQ] = useState("");
      const [a, setA] = useState(null);
      // The sections the backend named for the answer on screen. null = the backend sent no list
      // (an old backend): only then is the guess used.
      const [named, setNamed] = useState(null);
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState(false);
      const inputRef = useRef(null);
      // The first screen's "Ask a question about this base" lands here: the field is brought into
      // view and takes the cursor. RULE (FIRST SCREEN, rule 2): nothing is sent by arriving; the
      // paid call below still happens only when the reader sends a question.
      useEffect(() => {
        if (!focusOnOpen || !inputRef.current) return;
        inputRef.current.scrollIntoView({ block: "center" });
        inputRef.current.focus({ preventScroll: true });
      }, [focusOnOpen]);
      const ask = async () => {
        const question = q.trim();
        if (!question) return;
        setLoading(true); setA(null); setNamed(null); setErr(false);
        try {
          const d = await postJSON(apiUrl("/api/ai/relay"), { slug, question, want_sections: true });
          setA(d.answer || "(no answer)");
          setNamed(Array.isArray(d.sections) ? d.sections : null);
          console.log("[ASK] answer received: sections named by the backend =", Array.isArray(d.sections) ? d.sections.map((s) => s.id).join(",") || "none" : "no list (old backend)", "stated =", d.sections_stated);
        } catch (e) { setErr(true); console.log("[ASK] the question could not be answered:", e && e.message); }
        setLoading(false);
      };
      const clear = () => {
        setQ(""); setA(null); setNamed(null); setErr(false);
        if (inputRef.current) inputRef.current.focus();
      };
      return (
        <div className="ask">
          <div className="ask-title">Ask about this base</div>
          <div className="ask-row">
            <div className="ask-inputwrap">
              <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)}
                placeholder="e.g. Where should we live?"
                onKeyDown={(e) => { if (e.key === "Enter") ask(); }} />
              {q ? <button className="ask-clear" onClick={clear} aria-label="Clear question" title="Clear">&times;</button> : null}
            </div>
            <button onClick={ask} disabled={loading}>{loading ? "..." : "Ask"}</button>
          </div>
          {loading ? <div className="ask-ans faint ask-thinking"><span className="spin spin-sm" />Thinking&hellip;</div> : null}
          {err ? <div className="ask-ans faint">Couldn't reach the assistant. Start the backend and try again.</div> : null}
          {a ? <div className="ask-ans"><Markdown text={a} />
            {(() => { const chips = named ? namedChips(named, sections) : sourceChips(a, sections); return chips.length ? (
              <div className="ask-chips"><span className="lbl">From this guide:</span>
                {chips.map((c) => <button key={c.id} className="chip-src" onClick={() => onOpenSection && onOpenSection(c.id)}>{c.title}</button>)}
              </div>) : null; })()}
          </div> : null}
          <div className="faint tiny" style={{ marginTop: 6 }}>Answers come only from this guide's verified content.</div>
        </div>
      );
    }

    /* ---------------- ACCOUNT (the same account as milspoliving.com) ----------------
       The reader signs in against the SAME Supabase project the website uses, so the app knows it
       is the same person: saved bases are the website's public.saved_bases rows and a base saved in
       either place shows in both (Chris, decision cards 2026-11-24: "Yes, account then look",
       "6-digit code", "Yes, both now", "No social logins"). The website's finished slice is the
       model (its src/lib/account.ts, account-settings.ts, saved-bases*.ts): the same sentences,
       rules and names, without the Next.js plumbing. This slice is the account only; no restyle.

       RULES
       - The main way in is a code emailed by Supabase Auth (email OTP). A PASSWORD IS OPTIONAL
         (Chris, decision card "Sign-in", 2026-11-26: "Code now, password next", and 2026-11-27 "Do
         next"; the shared contract with the website of 2026-11-27): a signed-in reader may set one
         on the account screen and then sign in with it ("Use a password instead"). Nobody is ever
         asked for one. There is no reset flow: a forgotten password is replaced by signing in with a
         code and setting a new one. The rules of the password are with PASSWORD_MIN_CHARS below.
         ROAD NOT TAKEN (the rule before 2026-11-26): "no password, ever". Chris asked for a way in
         that never needs the mailbox, kept beside the code.
         WARNING: the code's LENGTH is a project setting (Supabase Auth, "email OTP length": 8 on
         2026-11-24, 6 in older projects, up to 10). The app never assumes a length: it accepts
         CODE_MIN_DIGITS to CODE_MAX_DIGITS. The first test (2026-11-24) failed because the app
         demanded exactly six digits and cut an 8-digit code short.
         WHY a code and not the website's link: a store app cannot rely on an emailed link opening
         the app, and a link completes only on the device that asked for it; a code works on the
         web, the installed PWA and the native builds alike.
       - Email only. ROAD NOT TAKEN (Chris, "No social logins"): Apple or Google sign-in would tie
         a military family to a third identity provider, and offering any third-party login brings
         Apple's "Sign in with Apple" requirement with it.
       - The first code makes the account (shouldCreateUser). There is no separate sign-up step.
       - The role (member / editor / owner) is read from public.profiles, the account's own row,
         and never set from here. editor and owner are set by hand in the database.
       - The first name is OPTIONAL (Chris, 2026-11-24, after the first test: "the header must
         make the state obvious", decision card "On the sign-in screen"). It is asked above the
         address on the sign-in screen, kept in public.profiles.first_name (FIRST_NAME_MAX_CHARS)
         and greets the reader in the top bar as "Hi <name>", or "Hi there" when none is stored.
         It reaches the database two ways, both the website's contract (2026-11-24): as user
         metadata on signInWithOtp (a database trigger copies it when the account is made), and
         through the database function set_first_name once signed in. After every sign-in the
         typed name is also sent through set_first_name when the profile has none yet, which gives
         an existing account its name and covers a trigger that did not fire. ROAD NOT TAKEN:
         updating profiles.first_name from the client; the function is the one place the trim and
         length rules live, shared with the website. Until the website's migration is applied the
         function is missing and the screen says "Not available yet", like the delete functions.
         The name is never logged.
       - Logs carry a masked address only (maskEmail), never a code, never a password and never a
         pay grade.
       - Delete my account (Apple rule 5.1.1(v); Chris 2026-11-23): the request is recorded by the
         database function request_account_deletion; the account and its rows are removed 30 days
         later and nothing is sent while it waits; cancel_account_deletion withdraws it. The
         pending request shows as profiles.deletion_requested_at.

       WARNING (supabase-js): never call the client inside the onAuthStateChange callback; it can
       deadlock. The profile read is put on the next tick for that reason.
       WARNING (Supabase dashboard): the "Magic Link" email template must print {{ .Token }}, or the
       reader gets a link and no code. docs/app-accounts.md has the step. */
    const ACCOUNT_LOG = "[ACCOUNT]";
    const SAVED_LOG = "[SAVED]";
    const ACCOUNT_ROLES = ["member", "editor", "owner"];
    const ROLE_LABEL = { member: "Member", editor: "Editor (MilSpo Living team)", owner: "Owner" };
    // Days between the deletion request and the removal (Chris, 2026-11-23). The database job
    // applies the same number; this one only tells the reader the date.
    const DELETION_WAIT_DAYS = 30;
    // The longest first name the database function set_first_name keeps (the website's contract,
    // 2026-11-24). The boxes stop at the same length so the stored name is what the reader typed.
    const FIRST_NAME_MAX_CHARS = 40;
    // The greeting in the top bar. RULE (Chris, 2026-11-24): the header must make the state
    // obvious - signed in reads "Hi <first name>", and "Hi there" while no name is stored, so the
    // address is never the thing that says "signed in" (it stays on the account screen).
    function greeting(firstName) { return firstName ? "Hi " + firstName : "Hi there"; }

    // WORDING RULE (Chris 2026-11-23, memory 152): public text says only that MilSpo Living is
    // "affiliated with MilHousing Network"; nothing about ownership or company structure.
    const PUBLISHER_LINE = BRAND + " is published by MilSpo Life LLC. It is affiliated with MilHousing Network.";
    const PRIVACY_URL = "https://milspoliving.com/privacy";

    /* ---------------- WEBSITE TOOLS (the app links to them, it does not rebuild them) ----------------
       RULE (Chris, decision card 2026-11-24): the website is the front door; the app is the companion
       for the move. A tool is built on the website first and comes to the app only when a family needs
       it in their pocket (saved bases, the checklist, offline guides, alerts). Rank my options, Compare
       bases and Plan my move stay on milspoliving.com; the app opens them in the browser. One account
       serves both, so the saved bases a reader sees there are the same rows as here.
       ROAD NOT TAKEN: rebuilding every website tool in the app. Rejected because each copy doubles the

       WEBSITE_COMPARE_PARAM and WEBSITE_COMPARE_MAX mirror the website's compare page
       (milspoliving src/lib/compare-model.ts: COMPARE_PARAM = 'bases', MAX_COMPARED = 3). */
    const WEBSITE_URL = "https://milspoliving.com";
    const WEBSITE_COMPARE_PARAM = "bases";
    const WEBSITE_COMPARE_MAX = 3;
    const WEBSITE_TOOLS = [
      { label: "Rank my options", path: "/rank", note: "Pick up to 8 bases and set what matters to your family." },
      { label: "Compare bases", path: "/compare", note: "Two or three bases side by side." },

    // Saved screen: the link to the website's Compare, once two or more saved bases have a guide.
    // RULE (auditor round 3, item 27; Chris's card 2026-11-24 "The clear fixes, one batch"): the app
    // still builds no Compare of its own (WEBSITE TOOLS, above). Until now the link sat only on the
    // signed-in account screen, so a signed-out reader never saw it. The bases travel in the

    // WHY the bases as the Saved screen lists them, and not "My base first" as on the account
    // screen (compareOrder): this link sits under that list, so it carries what the reader sees
    // there. Compare shows at most WEBSITE_COMPARE_MAX, so a longer list sends its first three and
    // the line under the link says so.
    function CompareSavedLink({ slugs }) {

      const moreThanFit = slugs.length > WEBSITE_COMPARE_MAX;

        <div className="saved-compare" data-compare-count={Math.min(slugs.length, WEBSITE_COMPARE_MAX)}>
          <a className="btn-plain saved-compare-link" href={websiteToolUrl(compareTool, slugs)} target="_blank" rel="noopener noreferrer">{compareTool.label} on the website</a>
          <div className="faint tiny" style={{ marginTop: 8 }}>
            Opens milspoliving.com with {moreThanFit ? "the first " + WEBSITE_COMPARE_MAX + " of these bases" : "these bases"} side by side.
            {moreThanFit ? " It shows " + WEBSITE_COMPARE_MAX + " at a time; you can change them there." : ""}
          </div>

    // THE PASSWORD (optional; the rule and its history are in ACCOUNT, RULES, above). The contract
    // with the website (2026-11-27) and Chris's Supabase settings of the same day:
    //   - At least PASSWORD_MIN_CHARS characters, said beside every password box and enforced by the
    //     form. Supabase Auth also enforces it (minimum length 12, set in the dashboard 2026-11-27),
    //     but the app does not rely on that setting: a dashboard change must not let a short one in.
    //   - Leaked password protection is on: Supabase refuses a password seen in a data breach
    //     (a weak_password error with the reason "pwned"); the reader is told so in one sentence.
    //   - "Secure password change" may be on: a change can be refused as "reauthentication needed"
    //     when the session is old, and the CURRENT password can be required to change an existing
    //     one. So "Change" asks for the current one (supabase-js 2.119.2, updateUser's
    //     current_password), and a refusal says "Sign in again with a code, then change it." A fresh
    //     code sign-in passes both checks, so a FIRST password set right after one needs nothing else.
    //     ROAD NOT TAKEN: supabase.auth.reauthenticate(), which emails a second code to type before
    //     the change. Signing in again with a code is the same proof with one screen the reader
    //     already knows.
    //   - A wrong password answers one sentence that never says which part was wrong.
    //   - A password is never logged, never put in an address and never kept by the app: it goes
    //     from the box to supabase-js and the box is emptied.
    // PASSWORD_MAX_CHARS: Supabase Auth refuses a password longer than 72 characters (the bcrypt
    // limit); the box stops there so the reader is not refused for a length they cannot see.
    const PASSWORD_MIN_CHARS = 12;
    const PASSWORD_MAX_CHARS = 72;
    const PASSWORD_MESSAGE = {
      "wrong": "That email and password do not match. Try again or sign in with a code.",
      "too-short": "Use at least " + PASSWORD_MIN_CHARS + " characters.",
      "leaked": "That password has appeared in a data leak. Choose another.",
      "weak": "Choose a stronger password.",
      "same": "That is the password you have now. Choose a new one.",
      "reauth": "Sign in again with a code, then change it.",
      "current-needed": "Enter your current password too.",
      "current-wrong": "Your current password did not match. Try again, or sign in again with a code, then change it.",
      "too-many": "Too many tries. Wait a minute, then try again.",
      "failed": "That did not work. Try again in a few minutes.",
    };

    // The sign-in screen's words carry a version: the screen is the record of what a family agreed
    // to (website, account-settings.ts, SIGN_IN_SCREEN_VERSION). The sentences are the website's
    // with one change: the website emails a link, the app emails a code. "-c" (2026-11-24): the
    // optional "First name" box above the address; a reader who signed up on "-b" was never asked.
    // "-d" (2026-11-25): one word dropped, "then MilSpo Minute" (was "then the MilSpo Minute"). The
    // newsletter's one name has no "the" (NAMES, auditor round 3 item 1); the website made the same
    // change to its own copy of the sentence. Nothing a family agreed to changed.
    // "2026-11-27-a": the optional password (the contract with the website of 2026-11-27). The
    // screen offers "Use a password instead" beside the code; "No password: we email you a code."
    // became "We email you a code; a password is optional." The website's copy of the sentence is
    // the website's to change (PROPOSED WORDING, not yet read by Chris).
    const SIGN_IN_SCREEN_VERSION = "2026-11-27-a";
    // The emailed code's length is set in Supabase Auth, not here (see the WARNING above): accept the
    // whole range Supabase allows so a settings change never locks readers out.
    const CODE_MIN_DIGITS = 6;
    const CODE_MAX_DIGITS = 10;
    const SIGN_IN_TEXT = {
      label: "Sign in",
      title: "Save my move",
      whatYouGet: "We keep your saved bases, so you find them on any phone or computer. We email you a code; a password is optional.",
      firstNameLabel: "First name (optional)",
      emailLabel: "Email address",
      // WHY the weekly email is stated here although the sends are later slices on the website:
      // Chris decided 2026-11-23 that every alert is ON from sign-up and that this screen is where
      // that is said. A statement, not a tick box.
      weeklyEmail: "You also get one weekly email: changes at your bases on top (housing allowance and rents, spouse jobs, new stories and guide updates, crime figures), then MilSpo Minute. Be the first to know when new allowance rates come out. Unsubscribe at any time.",
      noCallsNoTexts: PUBLISHER_LINE + " No calls, no texts.",
      button: "Send me a code",
      policyLine: "By continuing you accept our privacy policy.",
      codeLabel: "Code from the email",
      codeButton: "Sign in",
      // The code's life is Supabase's default for an email OTP (one hour; Supabase Auth docs, read 2026-11-24).
      sent: "Check your inbox and enter the code from the email. The code works for one hour. If it does not arrive, look in spam, then ask for a new one.",
      // The password step: the contract's words (2026-11-27).
      usePassword: "Use a password instead",
      useCode: "Use a code instead",
      passwordLabel: "Password",
      passwordRule: "At least " + PASSWORD_MIN_CHARS + " characters.",
      passwordButton: "Sign in",
      forgot: "Forgot it? Sign in with a code, then set a new one.",
    };
    const SIGN_IN_MESSAGE = {
      "bad-email": "Check the email address and try again.",
      // Supabase allows one request per address every 60 seconds (Supabase Auth docs, read 2026-11-23).
      "too-soon": "We sent you a code less than a minute ago. Wait a minute, then ask again.",
      // Supabase's hourly cap on sign-in emails for the whole project (error code
      // over_email_send_rate_limit): not the reader's fault, and not a minute's wait. Found on the
      // first app test, 2026-11-24, when the 2-an-hour test mailer was still on.
      "mailer-busy": "Our sign-in emails are paused for a short while. Please try again in an hour.",
      off: "Accounts are not available here yet.",
      failed: "The code did not go out. Try again in a few minutes.",
      "bad-code": "That code did not work. Check the digits or ask for a new code.",
      "check-failed": "Could not check the code. Try again.",
    };

    /** "chris@gmail.com" -> "c***@gmail.com". A log line never holds a full address. */
    function maskEmail(email) {
      const at = email.lastIndexOf("@");
      if (at < 1) return "***";
      return email.charAt(0) + "***" + email.slice(at);
    }
    // The website's check (email-address.ts): only a sent email proves an address, so a strict
    // pattern would turn away real addresses. Supabase answers with an error for a bad one.
    function isValidEmail(email) {
      if (email.length < 6 || email.length > 254) return false;
      return /^[^\s@<>()",;:\\]+@[^\s@<>()",;:\\]+\.[^\s@<>()",;:\\.]{2,}$/.test(email);
    }

    // One client for the whole app. The session is kept by supabase-js in localStorage (its
    // default), so an installed app stays signed in. detectSessionInUrl is off: nothing arrives in
    // the address bar with a code flow, and the PWA's own ?vcheck= query must never be parsed.
    let supabaseSingleton = null;
    function supabaseClient() {
      if (!ACCOUNTS_ON) return null;
      if (supabaseSingleton) return supabaseSingleton;
      if (!window.supabase || typeof window.supabase.createClient !== "function") {
        console.warn(ACCOUNT_LOG + " supabase-js did not load; accounts are off for this visit");
        return null;
      }
      supabaseSingleton = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
      });
      return supabaseSingleton;
    }

    // The signed-in state, one store for the whole app (read with useAccount). Shapes:
    //   { status: "off" } | { status: "loading" } | { status: "signed-out" } |
    //   { status: "signed-in", user: { id, email }, role, firstName, deletionRequestedAt, currentBaseSlug,
    //     payGrade, payGradeInAccount, profileRead, passwordSet }
    // role, firstName, deletionRequestedAt, currentBaseSlug and payGrade are null until the profile row
    // is read (or when the read failed); firstName stays null when the account has no name,
    // currentBaseSlug when no base is listed, payGrade when no grade is kept. payGradeInAccount is
    // false until the row is read and while the database has no pay_grade column yet (PAY GRADE).
    // passwordSet: whether the account has a password (passwordSetFor).
    const accountListeners = new Set();
    let accountState = ACCOUNTS_ON ? { status: "loading" } : { status: "off" };
    let accountStarted = false;
    function setAccountState(next) { accountState = next; accountListeners.forEach((fn) => fn()); }

    // select("*") and not a column list: the deletion column arrives with the website's delete
    // slice, and a column list naming it would fail the whole read where that migration is not
    // applied yet. RLS returns the account's own row only.
    async function readProfile(supabase, userId) {
      const { data, error } = await supabase.from("profiles").select("*").eq("id", userId).maybeSingle();
      if (error) { console.warn(ACCOUNT_LOG + " profile not read: " + error.message); return null; }
      const firstName = data && typeof data.first_name === "string" ? data.first_name.trim() : "";
      // MY BASE: the slug of the base the holder calls theirs (see the MY BASE store below);
      // null = none listed. A value the shape test refuses is treated as none, never shown.
      const currentBaseSlug = data && typeof data.current_base_slug === "string" && SLUG_SHAPE.test(data.current_base_slug) ? data.current_base_slug : null;
      // PAY GRADE: the column arrives with the website's migration profiles_pay_grade. A row without
      // the key means the column is not in the database yet; the grade then stays on the device.
      const payGradeInAccount = !!data && Object.prototype.hasOwnProperty.call(data, "pay_grade");
      return {
        role: data && ACCOUNT_ROLES.includes(data.role) ? data.role : null,
        firstName: firstName || null,
        deletionRequestedAt: data && typeof data.deletion_requested_at === "string" ? data.deletion_requested_at : null,
        currentBaseSlug,
        payGrade: payGradeInAccount ? cleanPayGrade(data.pay_grade) : null,
        payGradeInAccount,
      };
    }
    // WHETHER THE ACCOUNT HAS A PASSWORD. Supabase does not tell a client, so the website and the app
    // keep a flag of their own in the user's metadata: every successful set or change writes
    // user_metadata.password_set = true (setPassword), and the Password row reads it ("Set" + Change,
    // or "Not set" + Set a password). RULE: the same key and meaning as the website (the lead's
    // instruction, 2026-11-27); change both together.
    // Answers true / false from the flag, or null when the account has no such key yet.
    function metadataPasswordSet(user) {
      const meta = user && user.user_metadata;
      if (!meta || !Object.prototype.hasOwnProperty.call(meta, "password_set")) return null;
      return meta.password_set === true;
    }
    // THE FALLBACK, only when the key is absent (a password set outside both clients, in the
    // Supabase dashboard for example): a session opened WITH a password proves one exists. The "amr"
    // claim of the access token lists how the session was proven ([{ method: "password" | "otp" }]).
    function sessionUsedPassword(session) {
      try {
        const part = String(session.access_token || "").split(".")[1] || "";
        const claims = JSON.parse(atob(part.replace(/-/g, "+").replace(/_/g, "/")));
        return Array.isArray(claims.amr) && claims.amr.some((entry) => entry && entry.method === "password");
      } catch (e) {
        return false;
      }
    }
    function passwordSetFor(session) {
      const flag = metadataPasswordSet(session.user);
      return flag !== null ? flag : sessionUsedPassword(session);
    }
    // The name typed on the sign-in screen, held until the profile is read after that sign-in: an
    // account that has no name yet gets it through set_first_name (see the RULES above). Cleared
    // after one attempt so a later token refresh never resends it.
    let firstNameTypedAtSignIn = "";
    async function refreshProfile() {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return;
      const userId = accountState.user.id;
      const profile = await readProfile(supabase, userId);
      if (accountState.status !== "signed-in" || accountState.user.id !== userId) return;
      setAccountState({ ...accountState, role: profile ? profile.role : null, firstName: profile ? profile.firstName : null,
        deletionRequestedAt: profile ? profile.deletionRequestedAt : null, currentBaseSlug: profile ? profile.currentBaseSlug : null,
        payGrade: profile ? profile.payGrade : null, payGradeInAccount: !!profile && profile.payGradeInAccount,
        profileRead: !!profile });
      const typed = firstNameTypedAtSignIn;
      firstNameTypedAtSignIn = "";
      if (typed && profile && !profile.firstName) await setFirstName(typed);
      if (profile) await copyUpDeviceMyBase(profile.currentBaseSlug);
      if (profile && profile.payGradeInAccount) await copyUpDevicePayGrade(profile.payGrade);
    }
    function applySession(session) {
      if (!session || !session.user) { setAccountState({ status: "signed-out" }); return; }
      const user = { id: session.user.id, email: session.user.email || "" };
      if (accountState.status === "signed-in" && accountState.user.id === user.id) {
        // A token refresh or USER_UPDATED: keep the profile already read; the metadata flag, when
        // present, is the answer (USER_UPDATED brings the one setPassword just wrote).
        const flag = metadataPasswordSet(session.user);
        setAccountState({ ...accountState, user, passwordSet: flag !== null ? flag : (accountState.passwordSet || sessionUsedPassword(session)) });
        return;
      }
      setAccountState({ status: "signed-in", user, role: null, firstName: null, deletionRequestedAt: null, currentBaseSlug: null,
        payGrade: null, payGradeInAccount: false, profileRead: false, passwordSet: passwordSetFor(session) });
      setTimeout(refreshProfile, 0); // next tick: see the deadlock WARNING above
    }
    function startAccount() {
      if (accountStarted) return;
      accountStarted = true;
      const supabase = supabaseClient();
      if (!supabase) { setAccountState({ status: "off" }); return; }
      // INITIAL_SESSION arrives first with the stored session (or null), then every change:
      // SIGNED_IN after verifyOtp, SIGNED_OUT, TOKEN_REFRESHED, USER_UPDATED.
      supabase.auth.onAuthStateChange((_event, session) => applySession(session));
    }
    function subscribeAccount(fn) { accountListeners.add(fn); startAccount(); return () => accountListeners.delete(fn); }
    function accountSnapshot() { return accountState; }
    function useAccount() { return useSyncExternalStore(subscribeAccount, accountSnapshot); }

    /** The name as the database keeps it: trimmed, at most FIRST_NAME_MAX_CHARS, "" when blank. */
    function cleanFirstName(name) { return String(name || "").trim().slice(0, FIRST_NAME_MAX_CHARS); }

    // Step 1: ask for the code. Answers "sent" | "bad-email" | "off" | "too-soon" | "mailer-busy" | "failed".
    // A typed first name travels as user metadata so the database trigger can copy it into the
    // profile when this code makes a new account; blank sends no metadata at all.
    async function sendSignInCode(email, firstName) {
      const address = email.trim();
      if (!isValidEmail(address)) return "bad-email";
      const supabase = supabaseClient();
      if (!supabase) return "off";
      const name = cleanFirstName(firstName);
      const options = name ? { shouldCreateUser: true, data: { first_name: name } } : { shouldCreateUser: true };
      // No emailRedirectTo: with none, Supabase's template still gets {{ .Token }} to print and the
      // link in it (if the template keeps one) is not what signs the reader in here.
      const { error } = await supabase.auth.signInWithOtp({ email: address, options });
      if (error) {
        console.warn(ACCOUNT_LOG + " code not sent for " + maskEmail(address) + ": " + (error.status || "") + " " + error.message);
        // Two different 429s: the per-address minute (too-soon) and the project's hourly email cap.
        if (error.status === 429) return error.code === "over_email_send_rate_limit" ? "mailer-busy" : "too-soon";
        return "failed";
      }
      console.log(ACCOUNT_LOG + " sign-in code sent to " + maskEmail(address));
      return "sent";
    }
    // Step 2: trade the code for a session. Answers "ok" | "bad-code" | "too-soon" | "off" | "check-failed".
    // The session then arrives through onAuthStateChange, and the profile read that follows sends
    // the typed first name to set_first_name when the account has none. The code is never logged.
    async function verifySignInCode(email, code, firstName) {
      const address = email.trim();
      const token = String(code).replace(/\D/g, "");
      if (token.length < CODE_MIN_DIGITS || token.length > CODE_MAX_DIGITS) return "bad-code";
      const supabase = supabaseClient();
      if (!supabase) return "off";
      firstNameTypedAtSignIn = cleanFirstName(firstName);
      const { error } = await supabase.auth.verifyOtp({ email: address, token, type: "email" });
      if (error) {
        firstNameTypedAtSignIn = "";
        console.warn(ACCOUNT_LOG + " code not accepted for " + maskEmail(address) + ": " + (error.status || "") + " " + error.message);
        if (error.status === 429) return "too-soon";
        // 400/401/403/422: wrong, expired or already used. Anything else is the network or the service.
        return error.status >= 400 && error.status < 500 ? "bad-code" : "check-failed";
      }
      console.log(ACCOUNT_LOG + " signed in: " + maskEmail(address));
      return "ok";
    }
    // Sign in with the optional password. Answers "ok" | "wrong" | "too-short" | "too-many" | "off" |
    // "failed"; the keys are PASSWORD_MESSAGE's. The session then arrives through onAuthStateChange
    // and the app lands exactly where a code sign-in lands. RULE (the contract): "wrong" covers an
    // unknown address, an account with no password and a wrong password alike, so the answer never
    // says which part was wrong. The password is never logged.
    async function signInWithPasswordFor(email, password) {
      const address = email.trim();
      if (!isValidEmail(address)) return "wrong";
      if (String(password).length < PASSWORD_MIN_CHARS) return "too-short";
      const supabase = supabaseClient();
      if (!supabase) return "off";
      const { error } = await supabase.auth.signInWithPassword({ email: address, password: String(password) });
      if (error) {
        console.warn(ACCOUNT_LOG + " password sign-in refused for " + maskEmail(address) + ": " + (error.status || "") + " " + (error.code || ""));
        if (error.status === 429) return "too-many";
        return error.status >= 400 && error.status < 500 ? "wrong" : "failed";
      }
      console.log(ACCOUNT_LOG + " signed in with a password: " + maskEmail(address));
      return "ok";
    }
    // Set the first password, or change it (currentPassword: the one the reader has now, "" when
    // setting a first one). Answers "ok" or a PASSWORD_MESSAGE key. Only while signed in.
    // WARNING: the error codes below are Supabase Auth's (auth-js 2.119.2 error-codes, read
    // 2026-11-27). "current password required" and "current password mismatch" have no stable code
    // in that list, so they are also recognised by their message; a change of Supabase's wording
    // makes them read "That did not work", never a wrong statement.
    async function setPassword(newPassword, currentPassword) {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "failed";
      const next = String(newPassword);
      if (next.length < PASSWORD_MIN_CHARS) return "too-short";
      // data.password_set: the flag both clients read (metadataPasswordSet). Supabase merges "data"
      // into the user's metadata, so nothing else stored there is touched.
      const attributes = { password: next, data: { password_set: true } };
      if (currentPassword) attributes.current_password = String(currentPassword);
      const { error } = await supabase.auth.updateUser(attributes);
      const who = maskEmail(accountState.user.email);
      if (error) {
        const code = error.code || "";
        const words = error.message || "";
        console.warn(ACCOUNT_LOG + " password not set for " + who + ": " + (error.status || "") + " " + code);
        if (code === "weak_password") {
          const reasons = Array.isArray(error.reasons) ? error.reasons : [];
          if (reasons.includes("pwned")) return "leaked";
          return reasons.includes("length") ? "too-short" : "weak";
        }
        if (code === "same_password") return "same";
        if (code === "reauthentication_needed" || code === "reauthentication_not_valid" || code === "reauth_nonce_missing") return "reauth";
        if (/current password/i.test(code + " " + words)) return /match|invalid|incorrect|wrong/i.test(code + " " + words) ? "current-wrong" : "current-needed";
        if (error.status === 429) return "too-many";
        return "failed";
      }
      console.log(ACCOUNT_LOG + " password " + (currentPassword ? "changed" : "set") + " for " + who);
      if (accountState.status === "signed-in") setAccountState({ ...accountState, passwordSet: true });
      return "ok";
    }
    /** Signs out on this device only. The store moves to signed-out through the auth listener. */
    async function signOut() {
      const supabase = supabaseClient();
      if (!supabase) return;
      const { error } = await supabase.auth.signOut();
      if (error) console.warn(ACCOUNT_LOG + " sign-out failed: " + error.message);
    }

    // The website's delete slice (built in parallel) adds the two functions. Until its migration is
    // applied, Postgres answers "function does not exist" (42883) or PostgREST PGRST202; the
    // screen then says "Not available yet" instead of failing.
    function isMissingFunction(error) {
      return !!error && (error.code === "42883" || error.code === "PGRST202" ||
        /does not exist|could not find the function/i.test(error.message || ""));
    }
    // Answers "ok" | "unavailable" | "failed" | "off". On "ok" the state carries the request time.
    async function requestAccountDeletion() {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "off";
      const { data, error } = await supabase.rpc("request_account_deletion");
      if (error) {
        console.warn(ACCOUNT_LOG + " deletion request " + (isMissingFunction(error) ? "not available yet" : "failed") + ": " + error.message);
        return isMissingFunction(error) ? "unavailable" : "failed";
      }
      console.log(ACCOUNT_LOG + " account deletion requested");
      if (accountState.status === "signed-in") {
        setAccountState({ ...accountState, deletionRequestedAt: typeof data === "string" ? data : new Date().toISOString() });
      }
      refreshProfile();
      return "ok";
    }
    async function cancelAccountDeletion() {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "off";
      const { error } = await supabase.rpc("cancel_account_deletion");
      if (error) {
        console.warn(ACCOUNT_LOG + " deletion cancel " + (isMissingFunction(error) ? "not available yet" : "failed") + ": " + error.message);
        return isMissingFunction(error) ? "unavailable" : "failed";
      }
      console.log(ACCOUNT_LOG + " account deletion cancelled");
      if (accountState.status === "signed-in") setAccountState({ ...accountState, deletionRequestedAt: null });
      refreshProfile();
      return "ok";
    }

    // The name is written only through the website's database function set_first_name, which
    // trims it, caps it at FIRST_NAME_MAX_CHARS and answers the stored name (null when blank).
    // Answers "ok" | "unavailable" | "failed" | "off". The log line never carries the name.
    async function setFirstName(name) {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "off";
      const userId = accountState.user.id;
      const { data, error } = await supabase.rpc("set_first_name", { name: cleanFirstName(name) });
      if (error) {
        console.warn(ACCOUNT_LOG + " first name " + (isMissingFunction(error) ? "not available yet" : "not saved") + " for " + maskEmail(accountState.user.email) + ": " + error.message);
        return isMissingFunction(error) ? "unavailable" : "failed";
      }
      console.log(ACCOUNT_LOG + " first name saved for " + maskEmail(accountState.user.email));
      if (accountState.status === "signed-in" && accountState.user.id === userId) {
        const stored = typeof data === "string" ? data.trim() : "";
        setAccountState({ ...accountState, firstName: stored || null });
      }
      return "ok";
    }

    /* ---------------- SAVED BASES (the device's list or the account's list) ----------------
       Two stores behind one facade, chosen by the signed-in state (the website's saved-bases.ts):
         - signed OUT, accounts off, or the account list not loaded yet: the DEVICE list, browser
           storage "bg_saved", an array of slugs. Exactly what the app had before accounts.
         - signed IN with the account list loaded: public.saved_bases, the website's rows, read and
           written with the reader's own session.
       The screens see one list of slugs and one action (toggleSavedBase); they do not know which.
       Only slugs are stored; the names come from the base list the app already loads, so a renamed
       base shows its new name.

       RULES
       - An account keeps at most 5 saved bases (MAX_SAVED_BASES; Chris 2026-11-24, card "Saved cap",
         up from 3): the website's limit too. WHY a cap: the weekly email leads with changes at the
         saved bases and must stay short; the website's compare page still shows at most 3. The database trigger saved_bases_limit is the guarantee; the
         app asks before it writes and tells the reader to remove one first.
         ROAD NOT TAKEN: capping the device list too. Chris's card keeps saved bases on the device
         exactly as today when accounts are off; a longer device list is merged as far as it fits.
       - Writes show at once and go to the database behind them. A refused write is logged and the
         list is read again, so the screen never shows a base that was not stored.

       MERGE RULE (website, saved-bases-account.ts; Chris approved the plan 2026-11-23): when the
       account's list first loads on a device that has its own list, the account's bases stay as
       they are; a device base the account does not have is ADDED while the account has room (up to
       3, in the device order); nothing is deleted from the account by signing in. The device list
       is then CLEARED, so the app reads the account from here on and the merge runs once per
       device sign-in. Logged as "[ACCOUNT] saved bases merged: account=N device=M added=K".
       WARNING: that emptied device list is deliberate. Signing out leaves this device with no saved
       bases (they live in the account now); signing in brings them back.

       WARNING: the account list is null until the first read finishes (or when it fails). The facade
       shows the device list in the meantime, and the merge picks up anything saved then. */
    const MAX_SAVED_BASES = 5;
    const DEVICE_SAVED_KEY = "bg_saved"; // stored on readers' devices: a change resets their lists
    const SAVED_TABLE = "saved_bases";
    const SLUG_SHAPE = /^[a-z0-9]+(-[a-z0-9]+)*$/; // the table's own check on base_slug

    function readDeviceSaved() {
      const stored = LS.get(DEVICE_SAVED_KEY, []);
      return Array.isArray(stored) ? stored.filter((s) => typeof s === "string" && SLUG_SHAPE.test(s)) : [];
    }

    const savedListeners = new Set();
    let savedUserId = null;    // the signed-in user whose account list is loaded or loading
    let accountRows = null;    // [{ slug, position }] in position order, or null while not loaded
    let savedLoadCount = 0;
    let savedStarted = false;
    let savedSnapshot = { slugs: readDeviceSaved(), inAccount: false };
    function emitSaved() {
      savedSnapshot = accountRows
        ? { slugs: accountRows.map((r) => r.slug), inAccount: true }
        : { slugs: readDeviceSaved(), inAccount: false };
      savedListeners.forEach((fn) => fn());
    }

    async function readAccountRows(supabase, uid) {
      const { data, error } = await supabase.from(SAVED_TABLE).select("base_slug, position").eq("user_id", uid).order("position");
      if (error) { console.warn(SAVED_LOG + " saved bases not read: " + error.message); return null; }
      return (data || []).filter((r) => typeof r.base_slug === "string")
        .map((r) => ({ slug: r.base_slug, position: typeof r.position === "number" ? r.position : 0 }))
        .slice(0, MAX_SAVED_BASES);
    }
    async function insertAccountRow(supabase, uid, slug, position) {
      const { error } = await supabase.from(SAVED_TABLE).insert({ user_id: uid, base_slug: slug, position });
      if (error) console.warn(SAVED_LOG + " saved base not stored (" + slug + "): " + error.message);
      return !error;
    }
    async function deleteAccountRow(supabase, uid, slug) {
      const { error } = await supabase.from(SAVED_TABLE).delete().eq("user_id", uid).eq("base_slug", slug);
      if (error) console.warn(SAVED_LOG + " saved base not removed (" + slug + "): " + error.message);
      return !error;
    }
    /** After a refused write: read the table again so the screen shows what is really stored. */
    async function reloadAccountRows(uid) {
      const supabase = supabaseClient();
      if (!supabase) return;
      const fresh = await readAccountRows(supabase, uid);
      if (savedUserId !== uid) return;
      if (fresh) accountRows = fresh;
      emitSaved();
    }
    function nextPosition(rows) { return rows.reduce((max, r) => Math.max(max, r.position + 1), 0); }

    /** The first load for a user: the table, then the merge of the device list (rule above). */
    async function loadAccountRows(uid) {
      const supabase = supabaseClient();
      if (!supabase) return;
      const thisLoad = ++savedLoadCount;
      const fromTable = await readAccountRows(supabase, uid);
      if (savedUserId !== uid || thisLoad !== savedLoadCount) return;
      if (!fromTable) { accountRows = null; emitSaved(); return; } // read failed: keep the device list
      const list = [...fromTable];
      const device = readDeviceSaved();
      let added = 0;
      for (const slug of device) {
        if (list.some((r) => r.slug === slug)) continue;
        if (list.length >= MAX_SAVED_BASES) break;
        const position = nextPosition(list);
        if (await insertAccountRow(supabase, uid, slug, position)) { list.push({ slug, position }); added += 1; }
      }
      if (savedUserId !== uid || thisLoad !== savedLoadCount) return;
      if (device.length > 0) {
        LS.set(DEVICE_SAVED_KEY, []);
        console.log(ACCOUNT_LOG + " saved bases merged: account=" + fromTable.length + " device=" + device.length + " added=" + added);
      }
      accountRows = list;
      emitSaved();
    }
    function onAccountChangeForSaved() {
      const account = accountSnapshot();
      const uid = account.status === "signed-in" ? account.user.id : null;
      if (uid === savedUserId) return;
      savedUserId = uid;
      accountRows = null;
      emitSaved();
      if (uid) loadAccountRows(uid);
    }
    function subscribeSaved(fn) {
      savedListeners.add(fn);
      if (!savedStarted) { savedStarted = true; subscribeAccount(onAccountChangeForSaved); onAccountChangeForSaved(); }
      return () => savedListeners.delete(fn);
    }
    function savedBasesSnapshot() { return savedSnapshot; }
    /** { slugs, inAccount }: the list shown, and whether it is the account's or this device's. */
    function useSavedBases() { return useSyncExternalStore(subscribeSaved, savedBasesSnapshot); }

    /** The one save action. Answers "saved" | "removed" | "full" ("full" only for an account list). */
    function toggleSavedBase(slug) {
      if (!accountRows) {
        const slugs = readDeviceSaved();
        const had = slugs.includes(slug);
        LS.set(DEVICE_SAVED_KEY, had ? slugs.filter((x) => x !== slug) : [...slugs, slug]);
        emitSaved();
        return had ? "removed" : "saved";
      }
      const supabase = supabaseClient();
      const uid = savedUserId;
      if (accountRows.some((r) => r.slug === slug)) {
        accountRows = accountRows.filter((r) => r.slug !== slug);
        emitSaved();
        deleteAccountRow(supabase, uid, slug).then((ok) => { if (!ok) reloadAccountRows(uid); });
        return "removed";
      }
      if (accountRows.length >= MAX_SAVED_BASES) return "full";
      const position = nextPosition(accountRows);
      accountRows = [...accountRows, { slug, position }];
      emitSaved();
      insertAccountRow(supabase, uid, slug, position).then((ok) => { if (!ok) reloadAccountRows(uid); });
      return "saved";
    }

    /* ---------------- MY BASE (the one base the reader calls theirs) ----------------
       RULE (Chris, 2026-11-24, decision card "Yes, website and app": "once a base is set, say the
       name of the base under the name; if one's not listed, 'no base listed' and make it easy to
       add"): ONE current base per account, set only by the account holder, with NO history (a change
       replaces the old value, clearing leaves none). It is shown back to its owner (the Home row, the
       guide screen, the account screen) and filled into the reader's own tools (the website's
       Compare link puts it first). Nothing else uses it: no list is built from it, no email is sent
       because of it, no other reader sees it.
       The website's migration profiles_current_base is the one contract for both:
         - public.profiles.current_base_slug (text, null = none listed), read with the profile;
         - supabase.rpc("set_current_base", { slug }): a slug sets it, null clears it, answers the
           stored value; signed-in readers only, and only their own row.
       Two stores behind one facade, as for saved bases: the DEVICE value ("bg_my_base", {slug, name})
       while signed out or before the profile is read; the ACCOUNT value once it is read. On a sign-in
       a device value with no account value is copied up ONCE through the function, then the account
       wins and the device value is cleared (the website does the same, src/lib/current-base.ts).
       WARNING: that cleared device value is deliberate: signing out leaves this device with no base
       listed; signing in brings the account's back.
       ROAD NOT TAKEN: a flag on a saved base ("this one is my current base"). Rejected: the saved
       list is a capped shortlist of bases the reader is weighing, and the current base is one value
       that need not be among the five (a family at Fort Hood weighing three next bases does not want
       Fort Hood taking a place). The name travels with the slug on the device only so Home can show
       it before the base list loads; once the list is here the name comes from the list, so a
       renamed base shows its new name. */
    const DEVICE_MY_BASE_KEY = "bg_my_base";
    const MY_BASE_LOG = "[MYBASE]";
    const NO_BASE_LISTED = "No base listed.";
    // MY BASE AND SAVED, SAID ONCE EACH (auditor round 3, item 24; Chris's card 2026-11-24).
    // The two stay two things (the rule and its road not taken are above). What was missing was a
    // sentence: with one base saved, Home still read "No base listed." and nothing said why. The
    // words follow the website's account page (milspoliving src/components/account-view.tsx: "Your
    // own base (My base, above) is separate and does not take one of the 5 places.").
    // WHY the count is said only for an account: the list kept on a phone has no cap (SAVED BASES).
    const MY_BASE_EXPLAINED = "My base is the base you are at now. It is separate from your saved bases.";
    function savedExplained(inAccount) {
      return "Saved bases are the ones you are weighing. Your own base (My base, on Home) is separate"
        + (inAccount ? " and does not take one of the " + MAX_SAVED_BASES + " places." : ".");
    }
    const myBaseListeners = new Set();
    let myBaseSnapshot = { slug: null, name: null, inAccount: false };
    function readDeviceMyBase() {
      const stored = LS.get(DEVICE_MY_BASE_KEY, null);
      if (!stored || typeof stored.slug !== "string" || !SLUG_SHAPE.test(stored.slug)) return null;
      return { slug: stored.slug, name: typeof stored.name === "string" ? stored.name : null };
    }
    /** { slug, name, inAccount }: the base shown, and whether it is the account's or this device's. */
    function computeMyBase() {
      const account = accountSnapshot();
      if (account.status === "signed-in" && account.profileRead) {
        return { slug: account.currentBaseSlug || null, name: null, inAccount: true };
      }
      const device = readDeviceMyBase();
      return device ? { slug: device.slug, name: device.name, inAccount: false } : { slug: null, name: null, inAccount: false };
    }
    function emitMyBase() { myBaseSnapshot = computeMyBase(); myBaseListeners.forEach((fn) => fn()); }
    let myBaseStarted = false;
    function subscribeMyBase(fn) {
      myBaseListeners.add(fn);
      if (!myBaseStarted) { myBaseStarted = true; subscribeAccount(emitMyBase); emitMyBase(); }
      return () => myBaseListeners.delete(fn);
    }
    function myBaseSnapshotGet() { return myBaseSnapshot; }
    function useMyBase() { return useSyncExternalStore(subscribeMyBase, myBaseSnapshotGet); }
    /** The name to show: from the base list when it knows the slug, else the device's copy, else the slug. */
    function myBaseName(myBase, bases) {
      if (!myBase || !myBase.slug) return null;
      const b = (bases || []).find((x) => x.slug === myBase.slug);
      return b ? b.name : (myBase.name || myBase.slug.replace(/-/g, " "));
    }

    // The account value goes only through set_current_base (the function limits the change to the
    // caller's own row). Answers "ok" | "unavailable" | "failed". The log line carries the slug (a
    // page address, not personal data), never the account's address.
    async function writeAccountMyBase(slug) {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "failed";
      const userId = accountState.user.id;
      const { data, error } = await supabase.rpc("set_current_base", { slug: slug });
      if (error) {
        console.warn(ACCOUNT_LOG + " my base " + (isMissingFunction(error) ? "not available yet" : "not stored") + ": " + error.message);
        return isMissingFunction(error) ? "unavailable" : "failed";
      }
      if (accountState.status === "signed-in" && accountState.user.id === userId) {
        setAccountState({ ...accountState, currentBaseSlug: typeof data === "string" && SLUG_SHAPE.test(data) ? data : null });
      }
      return "ok";
    }
    /** The one action: set ({ slug, name }) or clear (null). Answers "ok" | "unavailable" | "failed". */
    async function setMyBase(base) {
      const slug = base && typeof base.slug === "string" && SLUG_SHAPE.test(base.slug) ? base.slug : null;
      if (base && !slug) return "failed";
      const account = accountSnapshot();
      if (account.status === "signed-in" && account.profileRead) {
        const result = await writeAccountMyBase(slug);
        if (result === "ok") { console.log(MY_BASE_LOG + (slug ? " set to " + slug : " cleared") + " (account)"); emitMyBase(); }
        return result;
      }
      LS.set(DEVICE_MY_BASE_KEY, slug ? { slug, name: base.name || null } : null);
      console.log(MY_BASE_LOG + (slug ? " set to " + slug : " cleared") + " (device)");
      emitMyBase();
      return "ok";
    }
    // After a sign-in (called once the profile is read): a base chosen on this device before signing
    // in goes to the account once, unless the account already has one (then the account wins).
    // Either way the device value is cleared, so the app reads the account from here on.
    async function copyUpDeviceMyBase(accountSlug) {
      const device = readDeviceMyBase();
      if (!device) return;
      if (!accountSlug) {
        const result = await writeAccountMyBase(device.slug);
        console.log(ACCOUNT_LOG + " my base copied up from this device: " + result);
        if (result !== "ok") return; // the device keeps its value for a later try
      }
      LS.set(DEVICE_MY_BASE_KEY, null);
      emitMyBase();
    }
    /** Compare on the website: the reader's base first, then the saved bases, at most WEBSITE_COMPARE_MAX. */
    function compareOrder(myBaseSlug, savedSlugs) {
      const list = myBaseSlug ? [myBaseSlug] : [];
      (savedSlugs || []).forEach((slug) => { if (!list.includes(slug)) list.push(slug); });
      return list.slice(0, WEBSITE_COMPARE_MAX);
    }

    /* ---------------- PAY GRADE (the reader's one grade) ----------------
       DECISION (Chris, decision card "Pay grade", 2026-11-27: "One pay grade that can be edited with
       changes like a promotion."; in chat the same day, "2. Match": the app and the website keep the
       SAME one grade). One grade per reader, or none. Shown and changed on the account screen and on
       a guide's housing allowance card, where it picks the reader's own rate ("Change grade").
       ROAD NOT TAKEN (the rule until 2026-11-27): "a pay grade stays on the device, never in the
       account". It kept the grade away from an email address, but a promotion then had to be typed
       again on every device, which is what the card ends.
       The contract with the website (2026-11-27; its migration profiles_pay_grade, written by the
       website, applied by the lead):
         - public.profiles.pay_grade (text, null = none), read with the profile;
         - supabase.rpc("set_pay_grade", { g }): sets the caller's own row, null clears, answers the
           stored value.
       Two stores behind one facade, as for My base: the DEVICE value ("bg_pay_grade") while signed
       out, before the profile is read, or while the database has no pay_grade column or no
       set_pay_grade function yet ("Not available yet", the grade stays on the phone); the ACCOUNT
       value once the row is read. MERGE at sign-in (the contract): the account's grade wins; a grade
       only this phone holds is copied up once. Then the device copy is cleared, as for My base.
       WARNING: that cleared copy is deliberate: signing out leaves this phone with no grade; signing
       in brings the account's back. A failed copy-up keeps the device copy for the next sign-in.
       PRIVACY: a pay grade is never logged (the log says "a grade"), never put in an address and never
       sent anywhere but the reader's own profile row. */
    const DEVICE_PAY_GRADE_KEY = "bg_pay_grade";
    const PAY_GRADE_LOG = "[PAYGRADE]";
    // THE ALLOWED GRADES, in the order every list shows them. RULE (the contract: "match the website's
    // existing grade list exactly"): a COPY of the website's PAY_GRADES (milspoliving
    // src/lib/pay-grade-rules.ts, read 2026-11-27), which its migration's check constraint holds too.
    // WARNING: change both together. A grade the account holds that is not in this list is read as
    // none, never shown.
    const PAY_GRADES = [
      "E-1", "E-2", "E-3", "E-4", "E-5", "E-6", "E-7", "E-8", "E-9",
      "W-1", "W-2", "W-3", "W-4", "W-5",
      "O-1E", "O-2E", "O-3E",
      "O-1", "O-2", "O-3", "O-4", "O-5", "O-6", "O-7", "O-8", "O-9", "O-10",
    ];
    const PAY_GRADE_GROUPS = [
      { label: "Enlisted", grades: PAY_GRADES.filter((g) => g.startsWith("E-")) },
      { label: "Warrant officer", grades: PAY_GRADES.filter((g) => g.startsWith("W-")) },
      { label: "Officer with prior enlisted service", grades: PAY_GRADES.filter((g) => g.startsWith("O-") && g.endsWith("E")) },
      { label: "Officer", grades: PAY_GRADES.filter((g) => g.startsWith("O-") && !g.endsWith("E")) },
    ];
    // PROPOSED WORDING, not yet read by Chris. "Set your pay grade to see your rate" and "Change
    // grade" are the contract's.
    const PAY_GRADE_TEXT = {
      label: "Pay grade",
      none: "No pay grade yet",
      add: "Add your pay grade",
      change: "Change",
      changeGrade: "Change grade",
      setToSee: "Set your pay grade to see your rate",
      pickLabel: "Your pay grade",
      noGrade: "No pay grade",
      save: "Save",
      cancel: "Cancel",
      inAccount: "Kept in your account. Change it after a promotion.",
      onPhone: "Kept on this phone. Change it after a promotion.",
      unavailable: "Not available yet. Your pay grade stays on this phone.",
      failed: "That did not work. Try again in a few minutes.",
    };
    function cleanPayGrade(stored) { return typeof stored === "string" && PAY_GRADES.includes(stored) ? stored : null; }
    function readDevicePayGrade() { return cleanPayGrade(LS.get(DEVICE_PAY_GRADE_KEY, null)); }

    const payGradeListeners = new Set();
    let payGradeSnapshot = { grade: null, inAccount: false, unavailable: false };
    /** { grade, inAccount, unavailable }: the grade shown, whether it is the account's, and whether a
        signed-in reader's grade is on the phone only because the database is not ready for it. */
    function computePayGrade() {
      const account = accountSnapshot();
      const signedInRead = account.status === "signed-in" && account.profileRead;
      if (signedInRead && account.payGradeInAccount) return { grade: account.payGrade || null, inAccount: true, unavailable: false };
      return { grade: readDevicePayGrade(), inAccount: false, unavailable: signedInRead };
    }
    function emitPayGrade() {
      const next = computePayGrade();
      const same = next.grade === payGradeSnapshot.grade && next.inAccount === payGradeSnapshot.inAccount && next.unavailable === payGradeSnapshot.unavailable;
      if (!same) { payGradeSnapshot = next; payGradeListeners.forEach((fn) => fn()); }
    }
    let payGradeStarted = false;
    function subscribePayGrade(fn) {
      payGradeListeners.add(fn);
      if (!payGradeStarted) { payGradeStarted = true; subscribeAccount(emitPayGrade); emitPayGrade(); }
      return () => payGradeListeners.delete(fn);
    }
    function payGradeSnapshotGet() { return payGradeSnapshot; }
    function usePayGrade() { return useSyncExternalStore(subscribePayGrade, payGradeSnapshotGet); }

    // The account value goes only through set_pay_grade. Answers "ok" | "unavailable" | "failed".
    // A missing function (the migration only half there) moves the reader to the device store.
    async function writeAccountPayGrade(grade) {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "failed";
      const userId = accountState.user.id;
      const { data, error } = await supabase.rpc("set_pay_grade", { g: grade });
      if (error) {
        const missing = isMissingFunction(error);
        console.warn(ACCOUNT_LOG + " pay grade " + (missing ? "not available yet" : "not stored") + ": " + error.message);
        if (missing && accountState.status === "signed-in" && accountState.user.id === userId) setAccountState({ ...accountState, payGradeInAccount: false });
        return missing ? "unavailable" : "failed";
      }
      if (accountState.status === "signed-in" && accountState.user.id === userId) setAccountState({ ...accountState, payGrade: cleanPayGrade(data) });
      return "ok";
    }
    /** The one action: a grade from PAY_GRADES, or null to remove it. Answers "ok" | "unavailable" | "failed".
        "unavailable": kept on this phone because the account cannot hold it yet. */
    async function setPayGrade(grade) {
      const next = cleanPayGrade(grade);
      if (grade && !next) return "failed";
      if (computePayGrade().inAccount) {
        const result = await writeAccountPayGrade(next);
        if (result === "ok") { console.log(PAY_GRADE_LOG + " " + (next ? "a grade set" : "grade removed") + " (account)"); emitPayGrade(); return "ok"; }
        if (result !== "unavailable") return result;
      }
      LS.set(DEVICE_PAY_GRADE_KEY, next);
      console.log(PAY_GRADE_LOG + " " + (next ? "a grade set" : "grade removed") + " (device)");
      emitPayGrade();
      return computePayGrade().unavailable ? "unavailable" : "ok";
    }
