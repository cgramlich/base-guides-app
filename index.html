        if (error.status === 429) return error.code === "over_email_send_rate_limit" ? "mailer-busy" : "too-soon";
        return "failed";
      }
      console.log(ACCOUNT_LOG + " sign-in code sent to " + maskEmail(address));
      return "sent";
    }
    // Step 2: trade the code for a session. Answers "ok" | "bad-code" | "too-soon" | "off" | "check-failed".
    // The session then arrives through onAuthStateChange, and the profile read that follows sends
    // the typed first name to set_first_name when the account has none. The code is never logged.
    async function verifySignInCode(email, code, firstName) {
      const address = email.trim();
      const token = String(code).replace(/\D/g, "");
      if (token.length < CODE_MIN_DIGITS || token.length > CODE_MAX_DIGITS) return "bad-code";
      const supabase = supabaseClient();
      if (!supabase) return "off";
      firstNameTypedAtSignIn = cleanFirstName(firstName);
      const { error } = await supabase.auth.verifyOtp({ email: address, token, type: "email" });
      if (error) {
        firstNameTypedAtSignIn = "";
        console.warn(ACCOUNT_LOG + " code not accepted for " + maskEmail(address) + ": " + (error.status || "") + " " + error.message);
        if (error.status === 429) return "too-soon";
        // 400/401/403/422: wrong, expired or already used. Anything else is the network or the service.
        return error.status >= 400 && error.status < 500 ? "bad-code" : "check-failed";
      }
      console.log(ACCOUNT_LOG + " signed in: " + maskEmail(address));
      return "ok";
    }
    /** Signs out on this device only. The store moves to signed-out through the auth listener. */
    async function signOut() {
      const supabase = supabaseClient();
      if (!supabase) return;
      const { error } = await supabase.auth.signOut();
      if (error) console.warn(ACCOUNT_LOG + " sign-out failed: " + error.message);
    }

    // The website's delete slice (built in parallel) adds the two functions. Until its migration is
    // applied, Postgres answers "function does not exist" (42883) or PostgREST PGRST202; the
    // screen then says "Not available yet" instead of failing.
    function isMissingFunction(error) {
      return !!error && (error.code === "42883" || error.code === "PGRST202" ||
        /does not exist|could not find the function/i.test(error.message || ""));
    }
    // Answers "ok" | "unavailable" | "failed" | "off". On "ok" the state carries the request time.
    async function requestAccountDeletion() {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "off";
      const { data, error } = await supabase.rpc("request_account_deletion");
      if (error) {
        console.warn(ACCOUNT_LOG + " deletion request " + (isMissingFunction(error) ? "not available yet" : "failed") + ": " + error.message);
        return isMissingFunction(error) ? "unavailable" : "failed";
      }
      console.log(ACCOUNT_LOG + " account deletion requested");
      if (accountState.status === "signed-in") {
        setAccountState({ ...accountState, deletionRequestedAt: typeof data === "string" ? data : new Date().toISOString() });
      }
      refreshProfile();
      return "ok";
    }
    async function cancelAccountDeletion() {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "off";
      const { error } = await supabase.rpc("cancel_account_deletion");
      if (error) {
        console.warn(ACCOUNT_LOG + " deletion cancel " + (isMissingFunction(error) ? "not available yet" : "failed") + ": " + error.message);
        return isMissingFunction(error) ? "unavailable" : "failed";
      }
      console.log(ACCOUNT_LOG + " account deletion cancelled");
      if (accountState.status === "signed-in") setAccountState({ ...accountState, deletionRequestedAt: null });
      refreshProfile();
      return "ok";
    }

    // The name is written only through the website's database function set_first_name, which
    // trims it, caps it at FIRST_NAME_MAX_CHARS and answers the stored name (null when blank).
    // Answers "ok" | "unavailable" | "failed" | "off". The log line never carries the name.
    async function setFirstName(name) {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return "off";
      const userId = accountState.user.id;
      const { data, error } = await supabase.rpc("set_first_name", { name: cleanFirstName(name) });
      if (error) {
        console.warn(ACCOUNT_LOG + " first name " + (isMissingFunction(error) ? "not available yet" : "not saved") + " for " + maskEmail(accountState.user.email) + ": " + error.message);
        return isMissingFunction(error) ? "unavailable" : "failed";
      }
      console.log(ACCOUNT_LOG + " first name saved for " + maskEmail(accountState.user.email));
      if (accountState.status === "signed-in" && accountState.user.id === userId) {
        const stored = typeof data === "string" ? data.trim() : "";
        setAccountState({ ...accountState, firstName: stored || null });
      }
      return "ok";
    }

    /* ---------------- SAVED BASES (the device's list or the account's list) ----------------
       Two stores behind one facade, chosen by the signed-in state (the website's saved-bases.ts):
         - signed OUT, accounts off, or the account list not loaded yet: the DEVICE list, browser
           storage "bg_saved", an array of slugs. Exactly what the app had before accounts.
         - signed IN with the account list loaded: public.saved_bases, the website's rows, read and
           written with the reader's own session.
       The screens see one list of slugs and one action (toggleSavedBase); they do not know which.
       Only slugs are stored; the names come from the base list the app already loads, so a renamed
       base shows its new name.

       RULES
       - An account keeps at most 3 saved bases (MAX_SAVED_BASES): the website's limit, because its
         compare page shows at most 3. The database trigger saved_bases_limit is the guarantee; the
         app asks before it writes and tells the reader to remove one first.
         ROAD NOT TAKEN: capping the device list too. Chris's card keeps saved bases on the device
         exactly as today when accounts are off; a longer device list is merged as far as it fits.
       - Writes show at once and go to the database behind them. A refused write is logged and the
         list is read again, so the screen never shows a base that was not stored.

       MERGE RULE (website, saved-bases-account.ts; Chris approved the plan 2026-11-23): when the
       account's list first loads on a device that has its own list, the account's bases stay as
       they are; a device base the account does not have is ADDED while the account has room (up to
       3, in the device order); nothing is deleted from the account by signing in. The device list
       is then CLEARED, so the app reads the account from here on and the merge runs once per
       device sign-in. Logged as "[ACCOUNT] saved bases merged: account=N device=M added=K".
       WARNING: that emptied device list is deliberate. Signing out leaves this device with no saved
       bases (they live in the account now); signing in brings them back.

       WARNING: the account list is null until the first read finishes (or when it fails). The facade
       shows the device list in the meantime, and the merge picks up anything saved then. */
    const MAX_SAVED_BASES = 3;
    const DEVICE_SAVED_KEY = "bg_saved"; // stored on readers' devices: a change resets their lists
    const SAVED_TABLE = "saved_bases";
    const SLUG_SHAPE = /^[a-z0-9]+(-[a-z0-9]+)*$/; // the table's own check on base_slug

    function readDeviceSaved() {
      const stored = LS.get(DEVICE_SAVED_KEY, []);
      return Array.isArray(stored) ? stored.filter((s) => typeof s === "string" && SLUG_SHAPE.test(s)) : [];
    }

    const savedListeners = new Set();
    let savedUserId = null;    // the signed-in user whose account list is loaded or loading
    let accountRows = null;    // [{ slug, position }] in position order, or null while not loaded
    let savedLoadCount = 0;
    let savedStarted = false;
    let savedSnapshot = { slugs: readDeviceSaved(), inAccount: false };
    function emitSaved() {
      savedSnapshot = accountRows
        ? { slugs: accountRows.map((r) => r.slug), inAccount: true }
        : { slugs: readDeviceSaved(), inAccount: false };
      savedListeners.forEach((fn) => fn());
    }

    async function readAccountRows(supabase, uid) {
      const { data, error } = await supabase.from(SAVED_TABLE).select("base_slug, position").eq("user_id", uid).order("position");
      if (error) { console.warn(SAVED_LOG + " saved bases not read: " + error.message); return null; }
      return (data || []).filter((r) => typeof r.base_slug === "string")
        .map((r) => ({ slug: r.base_slug, position: typeof r.position === "number" ? r.position : 0 }))
        .slice(0, MAX_SAVED_BASES);
    }
    async function insertAccountRow(supabase, uid, slug, position) {
      const { error } = await supabase.from(SAVED_TABLE).insert({ user_id: uid, base_slug: slug, position });
      if (error) console.warn(SAVED_LOG + " saved base not stored (" + slug + "): " + error.message);
      return !error;
    }
    async function deleteAccountRow(supabase, uid, slug) {
      const { error } = await supabase.from(SAVED_TABLE).delete().eq("user_id", uid).eq("base_slug", slug);
      if (error) console.warn(SAVED_LOG + " saved base not removed (" + slug + "): " + error.message);
      return !error;
    }
    /** After a refused write: read the table again so the screen shows what is really stored. */
    async function reloadAccountRows(uid) {
      const supabase = supabaseClient();
      if (!supabase) return;
      const fresh = await readAccountRows(supabase, uid);
      if (savedUserId !== uid) return;
      if (fresh) accountRows = fresh;
      emitSaved();
    }
    function nextPosition(rows) { return rows.reduce((max, r) => Math.max(max, r.position + 1), 0); }

    /** The first load for a user: the table, then the merge of the device list (rule above). */
    async function loadAccountRows(uid) {
      const supabase = supabaseClient();
      if (!supabase) return;
      const thisLoad = ++savedLoadCount;
      const fromTable = await readAccountRows(supabase, uid);
      if (savedUserId !== uid || thisLoad !== savedLoadCount) return;
      if (!fromTable) { accountRows = null; emitSaved(); return; } // read failed: keep the device list
      const list = [...fromTable];
      const device = readDeviceSaved();
      let added = 0;
      for (const slug of device) {
        if (list.some((r) => r.slug === slug)) continue;
        if (list.length >= MAX_SAVED_BASES) break;
        const position = nextPosition(list);
        if (await insertAccountRow(supabase, uid, slug, position)) { list.push({ slug, position }); added += 1; }
      }
      if (savedUserId !== uid || thisLoad !== savedLoadCount) return;
      if (device.length > 0) {
        LS.set(DEVICE_SAVED_KEY, []);
        console.log(ACCOUNT_LOG + " saved bases merged: account=" + fromTable.length + " device=" + device.length + " added=" + added);
      }
      accountRows = list;
      emitSaved();
    }
    function onAccountChangeForSaved() {
      const account = accountSnapshot();
      const uid = account.status === "signed-in" ? account.user.id : null;
      if (uid === savedUserId) return;
      savedUserId = uid;
      accountRows = null;
      emitSaved();
      if (uid) loadAccountRows(uid);
    }
    function subscribeSaved(fn) {
      savedListeners.add(fn);
      if (!savedStarted) { savedStarted = true; subscribeAccount(onAccountChangeForSaved); onAccountChangeForSaved(); }
      return () => savedListeners.delete(fn);
    }
    function savedBasesSnapshot() { return savedSnapshot; }
    /** { slugs, inAccount }: the list shown, and whether it is the account's or this device's. */
    function useSavedBases() { return useSyncExternalStore(subscribeSaved, savedBasesSnapshot); }

    /** The one save action. Answers "saved" | "removed" | "full" ("full" only for an account list). */
    function toggleSavedBase(slug) {
      if (!accountRows) {
        const slugs = readDeviceSaved();
        const had = slugs.includes(slug);
        LS.set(DEVICE_SAVED_KEY, had ? slugs.filter((x) => x !== slug) : [...slugs, slug]);
        emitSaved();
        return had ? "removed" : "saved";
      }
      const supabase = supabaseClient();
      const uid = savedUserId;
      if (accountRows.some((r) => r.slug === slug)) {
        accountRows = accountRows.filter((r) => r.slug !== slug);
        emitSaved();
        deleteAccountRow(supabase, uid, slug).then((ok) => { if (!ok) reloadAccountRows(uid); });
        return "removed";
      }
      if (accountRows.length >= MAX_SAVED_BASES) return "full";
      const position = nextPosition(accountRows);
      accountRows = [...accountRows, { slug, position }];
      emitSaved();
      insertAccountRow(supabase, uid, slug, position).then((ok) => { if (!ok) reloadAccountRows(uid); });
      return "saved";
    }

    /* ---------------- Screens ---------------- */
    // A single base card (shared by Home and Saved).
    function BaseCard({ b, onOpen, saved, onToggleSave }) {
      return (
        <div className={"card" + (b.ready ? " tap" : "")} onClick={() => b.ready && onOpen(b.slug)} style={{ borderLeft: "4px solid " + branchColor(b.branch) }}>
          <div className="between">
            <div style={{ minWidth: 0 }}>
              <div className="base-name">
                {b.name}
                {b.region === "OCONUS" ? <span className="pill oconus">OCONUS</span> : null}
                {b.ready ? <span className="pill ready">Guide ready</span> : <span className="pill soon">Coming soon</span>}
              </div>
              <div className="meta-line">{[b.branch, b.state].filter(Boolean).join("  -  ")}</div>
            </div>
            <div className="card-actions">
              <button className="iconbtn" style={saved.includes(b.slug) ? { color: "var(--accent)" } : null} onClick={(e) => { e.stopPropagation(); onToggleSave(b.slug); }} aria-label="Save">
                <Icon name={saved.includes(b.slug) ? "bookmarkOn" : "bookmark"} size={18} />
              </button>
              {b.ready ? <span className="card-go"><Icon name="cardchev" size={20} /></span> : null}
            </div>
          </div>
        </div>
      );
    }

    const BRANCH_FILTERS = [["all", "All"], ["army", "Army"], ["air force", "Air Force"], ["navy", "Navy"], ["marine", "Marines"], ["coast guard", "Coast Guard"], ["space", "Space Force"], ["joint", "Joint"]];
    const STATE_NAMES = {
      AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado",
      CT: "Connecticut", DE: "Delaware", DC: "District of Columbia", FL: "Florida", GA: "Georgia",
      HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa", KS: "Kansas", KY: "Kentucky",
      LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan", MN: "Minnesota",
      MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire",
      NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota",
      OH: "Ohio", OK: "Oklahoma", OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina",
      SD: "South Dakota", TN: "Tennessee", TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia",
      WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming",
    };
    function stateTokens(s) { return (s || "").split("/").map((x) => x.trim()).filter(Boolean); }
    function stateFull(t) { return STATE_NAMES[t] || t; }
    function stateLabel(s) { return stateTokens(s).map(stateFull).join(" / ") || "Other"; }

    function Home({ bases, loading, loadFailed, onRetry, onOpen, saved, onToggleSave }) {
      const [q, setQ] = useState("");
      const [branch, setBranch] = useState("all");
      const [loc, setLoc] = useState("all");
      const [sortBy, setSortBy] = useState("state");
      if (loading) return <div className="center"><div className="spin" /></div>;
      // A failed load and a genuinely empty list are different things: only the second is "No bases yet".
      if ((!bases || !bases.length) && loadFailed) return (
        <div className="center">
          <div>Couldn't load the base guides. Check your connection and try again.</div>
          <button className="btn-quiet" style={{ marginTop: 12 }} onClick={onRetry}>Try again</button>
        </div>
      );
      if (!bases || !bases.length) return <div className="center">No bases yet.</div>;

      const ql = q.trim().toLowerCase();
      const isJoint = (b) => {
        const s = (b.branch || "").toLowerCase(), n = (b.name || "").toLowerCase();
        return s.indexOf("/") !== -1 || n.indexOf("joint base") !== -1 || n.indexOf("jbsa") !== -1;
      };
      const matchBranch = (b) => {
        if (branch === "all") return true;
        if (branch === "joint") return isJoint(b);
        return (b.branch || "").toLowerCase().indexOf(branch) !== -1;  // a joint base shows under each of its services too
      };
      const matchLoc = (b) => loc === "all" || stateTokens(b.state).indexOf(loc) !== -1;
      const matchQ = (b) => {
        if (!ql) return true;
        const hay = (b.name + " " + (b.state || "") + " " + stateTokens(b.state).map(stateFull).join(" ")).toLowerCase();
        return hay.indexOf(ql) !== -1;
      };
      const filtered = bases.filter((b) => matchBranch(b) && matchLoc(b) && matchQ(b));
      const locOptions = Array.from(new Set(bases.flatMap((b) => stateTokens(b.state)))).sort((a, b) => stateFull(a).localeCompare(stateFull(b)));

      let body;
      if (!filtered.length) {
        body = <div className="pending">No bases match your filters.</div>;
      } else if (sortBy === "name") {
        body = [...filtered].sort((a, b) => a.name.localeCompare(b.name))
          .map((b) => <BaseCard key={b.slug} b={b} onOpen={onOpen} saved={saved} onToggleSave={onToggleSave} />);
      } else {
        const groups = {};
        filtered.forEach((b) => { const k = b.state || "Other"; (groups[k] = groups[k] || []).push(b); });
        const keys = Object.keys(groups).sort((a, b) => stateLabel(a).localeCompare(stateLabel(b)));
        keys.forEach((k) => groups[k].sort((a, b) => a.name.localeCompare(b.name)));
        body = keys.map((k) => (
          <div key={k}>
            <div className="state-header">{stateLabel(k)}</div>
            {groups[k].map((b) => <BaseCard key={b.slug} b={b} onOpen={onOpen} saved={saved} onToggleSave={onToggleSave} />)}
          </div>
        ));
      }

      return (
        <div className="content">
          <div className="home-hero">
            <img className="home-logo" src={ASSETS.logoMark} alt="MilSpo Living" />
            <div className="home-tag">Guides for your next duty station.</div>
          </div>
          <div className="home-controls">
            <input className="fld home-search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search base or state" />
            <div className="home-selects">
              <select className="fld" value={loc} onChange={(e) => setLoc(e.target.value)}>
                <option value="all">All locations</option>
                {locOptions.map((t) => <option key={t} value={t}>{stateFull(t)}</option>)}
              </select>
              <select className="fld" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                <option value="state">Sort: by state</option>
                <option value="name">Sort: name (A-Z)</option>
              </select>
            </div>
            <div className="chips">
              {BRANCH_FILTERS.map(([k, l]) => <button key={k} className={"chip pick" + (branch === k ? " chip-on" : "")} onClick={() => setBranch(k)}>{l}</button>)}
            </div>
          </div>
          {body}
        </div>
      );
    }

    // Local time at the base (ticks). tz is an IANA zone on the base record.
    function LocalTime({ tz }) {
      const [, tick] = useState(0);
      useEffect(() => { const id = setInterval(() => tick((n) => n + 1), 30000); return () => clearInterval(id); }, []);
      if (!tz) return null;
      let s;
      try { s = new Intl.DateTimeFormat([], { timeZone: tz, weekday: "short", hour: "numeric", minute: "2-digit" }).format(new Date()); }
      catch (e) { return null; }
      return <div className="localtime">{s} local time</div>;
    }

    function BaseDetail({ slug, onBack, saved, onToggleSave }) {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [openId, setOpenId] = useState(null);
      const [story, setStory] = useState(null);
      useEffect(() => {
        let live = true;
        setData(null); setErr(null); setStory(null);
        fetchJSON(baseUrl(slug)) // per-base fetch ON DEMAND - the architecture in action
          .then((d) => { if (live) { setData(d); setOpenId(d.sections && d.sections[0] ? d.sections[0].id : null); } })
          .catch((e) => { if (live) setErr(e.message); });
        // The story is a separate on-demand fetch. Most bases have none (404), and a failed story
        // fetch must never block the guide, so any error just means "no story section".
        const url = storyUrl(slug);
        if (url) fetchJSON(url).then((d) => { if (live) setStory(d); }).catch(() => {});
        return () => { live = false; };
      }, [slug]);

      if (err) return <div className="content"><span className="back" onClick={onBack}><Icon name="back" size={15} /> All bases</span><div className="center">Could not load this guide.<br />{err}</div></div>;
      if (!data) return <div className="content"><span className="back" onClick={onBack}><Icon name="back" size={15} /> All bases</span><div className="center"><div className="spin" /></div></div>;

      return (
        <div className="content">
          <span className="back" onClick={onBack}><Icon name="back" size={15} /> All bases</span>
          <div className="basehero" style={{ borderTopColor: branchColor(data.branch) }}>
            <div className="between">
              <h1>{data.name}</h1>
              <button className="iconbtn" style={saved.includes(slug) ? { color: "var(--accent)" } : null} onClick={() => onToggleSave(slug)} aria-label="Save">
                <Icon name={saved.includes(slug) ? "bookmarkOn" : "bookmark"} size={20} />
              </button>
            </div>
            {data.tagline ? <div className="tag">{data.tagline}</div> : null}
            <div className="basehero-meta">{[data.branch, (data.states || []).join(" / ")].filter(Boolean).join("  ·  ")}</div>
            <LocalTime tz={data.tz} />
          </div>
          <LiveWeather coords={data.coords} />
          <AskBox slug={slug} />
          <div style={{ marginTop: 12 }}>
            {withStorySection(data.sections || [], story).map((s) => (
              <Accordion key={s.id} s={s} coords={data.coords}
                open={openId === s.id}
                onToggle={() => setOpenId(openId === s.id ? null : s.id)} />
            ))}
          </div>
          <div className="feedback">
            <span className="feedback-q">Stationed here or spot something off?</span>
            <a className="feedback-link" href={"mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Base guide feedback: " + data.name) + "&body=" + encodeURIComponent("Base: " + data.name + "\n\nType (correction / clarification / enhancement):\n\nDetails:\n")} target="_blank" rel="noopener noreferrer">Suggest a correction or improvement</a>
            <div className="feedback-note">Real families keep these guides accurate. Thank you.</div>
          </div>
        </div>
      );
    }

    function Stub({ label, note }) {
      return <div className="content"><div className="center"><strong style={{ color: "var(--text-dim)" }}>{label}</strong><br />{note}</div></div>;
    }

    // ---- PCS timeline (general guidance; user confirms specifics with orders/TMO) ----
    const PCS_BUCKETS = [
      { key: "d90", label: "90+ days out", offset: -90, tasks: ["Read the installation guide; shortlist neighborhoods", "Decide on-base (join the waitlist) vs off-base", "If buying: get pre-approved; connect with a base-area lender/realtor"] },
      { key: "d60", label: "~60 days out", offset: -60, tasks: ["Schedule your household goods (HHG) move with the transportation office", "Start medical/dental records transfer (note EFMP if it applies)", "Research schools and request enrollment requirements"] },
      { key: "d30", label: "~30 days out", offset: -30, tasks: ["Confirm move dates; arrange temporary lodging (TLE/TLA)", "Give notice to your landlord or list your home; schedule utilities", "Update DEERS; gather in-processing paperwork"] },
      { key: "d14", label: "~2 weeks out", offset: -14, tasks: ["Confirm pack-out dates with the movers", "Finalize travel (route/flights, pets, lodging en route)", "Change bank/address; set aside documents to hand-carry"] },
      { key: "week", label: "Move week", offset: -3, tasks: ["Supervise pack-out; photograph and keep your own inventory", "Final walkthrough; cancel local utilities", "Hand-carry: orders, IDs, medical records, valuables"] },
      { key: "arr", label: "Arrival", offset: 0, tasks: ["In-process at the installation; report to your unit", "Pick up keys / begin off-base move-in", "Set up utilities, internet, and vehicle registration"] },
      { key: "post", label: "First 30 days", offset: 14, tasks: ["Enroll kids in school; transfer TRICARE/medical", "Register vehicles per the state; update license & insurance", "Locate essentials: commissary, MTF, childcare, MWR"] },
    ];
    const PCS_MILESTONES = [
      { label: "Schedule HHG move", offsetDays: -60 }, { label: "Confirm dates & lodging", offsetDays: -30 },
      { label: "Pack-out week", offsetDays: -5 }, { label: "Move day", offsetDays: 0 },
      { label: "In-process at new base", offsetDays: 1 }, { label: "School & vehicle registration", offsetDays: 14 },
    ];
    function fmtDate(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
    function addDays(base, n) { const d = new Date(base); d.setDate(d.getDate() + n); return d; }
    function daysUntil(d) { return Math.ceil((d - new Date()) / 86400000); }
    function icsPad(n) { return String(n).padStart(2, "0"); }
    function icsDate(d) { return d.getFullYear() + icsPad(d.getMonth() + 1) + icsPad(d.getDate()); }
    function buildICS(moveDate, baseName) {
      const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//MilSpo Living//Base Guides//EN", "CALSCALE:GREGORIAN"];
      PCS_MILESTONES.forEach((m, i) => {
        const d = addDays(moveDate, m.offsetDays);
        L.push("BEGIN:VEVENT", "UID:milspo-" + i + "-" + icsDate(d) + "@milspoliving",
          "DTSTART;VALUE=DATE:" + icsDate(d), "DTEND;VALUE=DATE:" + icsDate(addDays(d, 1)),
          "SUMMARY:PCS - " + m.label, "DESCRIPTION:" + (baseName ? "PCS to " + baseName : "PCS milestone") + " (MilSpo Living)", "END:VEVENT");
      });
      L.push("END:VCALENDAR"); return L.join("\r\n");
    }
    function downloadFile(text, filename, mime) {
      const b = new Blob([text], { type: mime }); const u = URL.createObjectURL(b);
      const a = document.createElement("a"); a.href = u; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
    }

    function PlanScreen({ bases, onOpen }) {
      const [pcs, setPcs] = useState(() => LS.get("bg_pcs", { moveDate: "", base: "" }));
      const [done, setDone] = useState(() => LS.get("bg_pcs_done", {}));
      const save = (next) => { setPcs(next); LS.set("bg_pcs", next); };
      const toggleDone = (id) => setDone((p) => { const n = { ...p, [id]: !p[id] }; LS.set("bg_pcs_done", n); return n; });
      const move = pcs.moveDate ? new Date(pcs.moveDate + "T00:00:00") : null;
      const baseObj = bases ? bases.find((b) => b.slug === pcs.base) : null;
      const until = move ? daysUntil(move) : null;
      return (
        <div className="content">
          <h2 className="screen-h">Your PCS plan</h2>
          <div className="card">
            <label className="fld-l">Move date</label>
            <input className="fld" type="date" value={pcs.moveDate} onChange={(e) => save({ ...pcs, moveDate: e.target.value })} />
            <label className="fld-l" style={{ marginTop: 12 }}>Moving to</label>
            <select className="fld" value={pcs.base} onChange={(e) => save({ ...pcs, base: e.target.value })}>
              <option value="">Select a base</option>
              {(bases || []).map((b) => <option key={b.slug} value={b.slug}>{b.name}</option>)}
            </select>
          </div>
          {!move ? <div className="pending" style={{ padding: "6px 2px" }}>Enter your move date to build a timeline.</div> : (
            <div>
              <div className="muted small" style={{ margin: "4px 2px 12px" }}>{until >= 0 ? until + " days until your move (" + fmtDate(move) + ")" : "Move date was " + fmtDate(move)}</div>
              {baseObj && until != null && until >= 0 && until <= 90 ? (
                <div className="bridge">
                  <div className="bridge-h">Talk to a vetted realtor at {baseObj.name}</div>
                  <p>You're about {until} days out - a good time to connect with a {baseObj.name}-area realtor who knows the neighborhoods, schools, and the buy-vs-rent math. No pressure, no spam.</p>
                  <a className="btn-gold" href={"mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Realtor intro for " + baseObj.name) + "&body=" + encodeURIComponent("I'm PCSing to " + baseObj.name + " around " + fmtDate(move) + " and would like an introduction to a vetted realtor.")}>Request an introduction</a>
                </div>
              ) : null}
              <div className="between" style={{ margin: "4px 2px 10px" }}>
                <h3 style={{ fontSize: 16 }}>Timeline</h3>
                <button className="btn-quiet" onClick={() => downloadFile(buildICS(move, baseObj ? baseObj.name : ""), "pcs-timeline.ics", "text/calendar")}><Icon name="download" size={15} /> Add to calendar</button>
              </div>
              {PCS_BUCKETS.map((bk) => {
                const d = addDays(move, bk.offset);
                return (
                  <div className="acc open" key={bk.key} style={{ marginBottom: 10 }}>
                    <div className="acc-head" style={{ cursor: "default" }}>
                      <span className="sec-ic"><Icon name="calendar" size={16} /></span>
                      <h3 style={{ fontSize: 15, flex: 1 }}>{bk.label}</h3>
                      <span className="muted tiny">{fmtDate(d)}</span>
                    </div>
                    <div className="acc-body">
                      {bk.tasks.map((t, i) => {
                        const id = bk.key + "-" + i;
                        return (
                          <label key={i} className="task">
                            <input type="checkbox" checked={!!done[id]} onChange={() => toggleDone(id)} />
                            <span className={done[id] ? "task-done" : ""}>{t}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              <div className="srcline">General PCS guidance - confirm specifics with your orders, the transportation office (TMO), and your installation.</div>
            </div>
          )}
        </div>
      );
    }

    // One line under the saved list about where the list lives. RULE (website; Chris, "After they
    // try a tool"): the account is offered only after a tool was used, so the offer appears under a
    // list that has something in it, never on an empty screen.
    function SavedWhereLine({ account, inAccount, onOpenAccount }) {
      if (account.status === "off" || account.status === "loading") return null;
      if (inAccount) return <div className="faint tiny" style={{ margin: "2px 2px 12px" }}>Kept in your account and shown on every device you sign in on.</div>;
      if (account.status === "signed-out") return (
        <div className="muted small" style={{ margin: "2px 2px 12px" }}>
          Saved on this phone only. <button className="btn-quiet" onClick={onOpenAccount}>Sign in to keep them on every device</button>
        </div>
      );
      return null;
    }

    function SavedScreen({ bases, saved, onToggleSave, onOpen, account, inAccount, onOpenAccount }) {
      const list = (bases || []).filter((b) => saved.includes(b.slug));
      if (!list.length) return <div className="content"><h2 className="screen-h">Saved</h2><div className="center">No saved bases yet.<br />Tap the bookmark on a base to save it here.</div></div>;
      return (
        <div className="content">
          <h2 className="screen-h">Saved</h2>
          <SavedWhereLine account={account} inAccount={inAccount} onOpenAccount={onOpenAccount} />
          {list.map((b) => (
            <div key={b.slug} className={"card" + (b.ready ? " tap" : "")} onClick={() => b.ready && onOpen(b.slug)} style={{ borderLeft: "4px solid " + branchColor(b.branch) }}>
              <div className="between">
                <div style={{ minWidth: 0 }}>
                  <div className="base-name">{b.name}{b.ready ? <span className="pill ready">Guide ready</span> : <span className="pill soon">Coming soon</span>}</div>
                  <div className="meta-line">{[b.branch, b.state].filter(Boolean).join("  -  ")}</div>
                </div>
                <div className="card-actions">
                  <button className="iconbtn" style={{ color: "var(--accent)" }} onClick={(e) => { e.stopPropagation(); onToggleSave(b.slug); }} aria-label="Remove"><Icon name="bookmarkOn" size={18} /></button>
                  {b.ready ? <span className="card-go"><Icon name="cardchev" size={20} /></span> : null}
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    /* ---------------- ACCOUNT SCREENS ---------------- */
    // The sign-in screen: the fixed sentences, then two steps - the optional first name, the address
    // and "Send me a code", then the code and "Sign in". The words live in SIGN_IN_TEXT; this is the
    // behaviour. The typed name stays in this component through the code step: it is sent with the
    // code request (new account) and again after the code is accepted (existing account).
    // The screen version travels on the element (data-screen-version), the record of what was shown.
    function SignInScreen() {
      const [firstName, setFirstNameTyped] = useState("");
      const [email, setEmail] = useState("");
      const [code, setCode] = useState("");
      const [step, setStep] = useState("email"); // "email" | "code"
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");

      const send = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await sendSignInCode(email, firstName);
        setBusy(false);
        if (result === "sent") { setStep("code"); setCode(""); return; }
        setMessage(SIGN_IN_MESSAGE[result] || SIGN_IN_MESSAGE.failed);
      };
      const verify = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await verifySignInCode(email, code, firstName);
        setBusy(false);
        // On "ok" the auth listener moves the app to the account screen; nothing to do here.
        if (result !== "ok") setMessage(SIGN_IN_MESSAGE[result] || SIGN_IN_MESSAGE["check-failed"]);
      };
      const askAgain = async () => {
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await sendSignInCode(email, firstName);
        setBusy(false);
        setMessage(result === "sent" ? "A new code is on its way." : (SIGN_IN_MESSAGE[result] || SIGN_IN_MESSAGE.failed));
      };

      return (
        <div className="content" data-screen-version={SIGN_IN_SCREEN_VERSION}>
          <h2 className="screen-h">{SIGN_IN_TEXT.title}</h2>
          <p className="acct-p">{SIGN_IN_TEXT.whatYouGet}</p>
          {step === "email" ? (
            <form onSubmit={send}>
              <label className="fld-l" htmlFor="acct-first-name">{SIGN_IN_TEXT.firstNameLabel}</label>
              <input id="acct-first-name" className="fld" type="text" autoComplete="given-name" autoCapitalize="words" spellCheck={false} maxLength={FIRST_NAME_MAX_CHARS}
                value={firstName} onChange={(e) => setFirstNameTyped(e.target.value)} style={{ marginBottom: 12 }} />
              <label className="fld-l" htmlFor="acct-email">{SIGN_IN_TEXT.emailLabel}</label>
              <input id="acct-email" className="fld" type="email" inputMode="email" autoComplete="email" autoCapitalize="none" spellCheck={false}
                value={email} onChange={(e) => setEmail(e.target.value)} required />
              <p className="acct-p small" style={{ marginTop: 14 }}>{SIGN_IN_TEXT.weeklyEmail}</p>
              <p className="acct-p small">{SIGN_IN_TEXT.noCallsNoTexts}</p>
              <button className="btn-gold" type="submit" disabled={busy}>{busy ? "Sending..." : SIGN_IN_TEXT.button}</button>
              <p className="acct-p small" style={{ marginTop: 12 }}>
                By continuing you accept our <a href={PRIVACY_URL} target="_blank" rel="noopener noreferrer">privacy policy</a>.
              </p>
              {message ? <div className="acct-msg" role="alert">{message}</div> : null}
            </form>
          ) : (
            <form onSubmit={verify}>
              <p className="acct-p" role="status">{SIGN_IN_TEXT.sent}</p>
              <label className="fld-l" htmlFor="acct-code">{SIGN_IN_TEXT.codeLabel}</label>
              <input id="acct-code" className="fld acct-code" type="text" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9]*" maxLength={CODE_MAX_DIGITS}
                value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} autoFocus />
              <button className="btn-gold" type="submit" disabled={busy || code.length < CODE_MIN_DIGITS || code.length > CODE_MAX_DIGITS}>{busy ? "Checking..." : SIGN_IN_TEXT.codeButton}</button>
              <div className="acct-actions">
                <button type="button" className="btn-quiet" onClick={askAgain} disabled={busy}>Send a new code</button>
                <button type="button" className="btn-quiet" onClick={() => { setStep("email"); setMessage(""); }} disabled={busy}>Use a different address</button>
              </div>
              {message ? <div className={"acct-msg" + (message.indexOf("on its way") !== -1 ? " ok" : "")} role="alert">{message}</div> : null}
            </form>
          )}
        </div>
      );
    }

    // Delete my account, the confirm sheet and the pending state. Words from Chris (2026-11-23,
    // 2026-11-24): 30 days, nothing sent while it waits, cancel by signing in.
    function DeleteAccountBlock({ account }) {
      const [confirming, setConfirming] = useState(false);
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const run = async (action) => {
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await action();
        setBusy(false);
        if (result === "ok") { setConfirming(false); return; }
        setMessage(result === "unavailable" ? "Not available yet." : "That did not work. Try again in a few minutes.");
      };
      if (account.deletionRequestedAt) {
        const requested = new Date(account.deletionRequestedAt);
        return (
          <div>
            <h3 className="acct-h">Delete my account</h3>
            <p className="acct-p">Deletion requested on {fmtDate(requested)}. Your account is removed on {fmtDate(addDays(requested, DELETION_WAIT_DAYS))}.</p>
            <button className="btn-plain" onClick={() => run(cancelAccountDeletion)} disabled={busy}>{busy ? "One moment..." : "Cancel deletion"}</button>
            {message ? <div className="acct-msg" role="alert">{message}</div> : null}
          </div>
        );
      }
      return (
        <div>
          <h3 className="acct-h">Delete my account</h3>
          {!confirming ? (
            <button className="btn-danger" onClick={() => { setConfirming(true); setMessage(""); }}>Delete my account</button>
          ) : (
            <div className="card acct-sheet" role="dialog" aria-label="Delete my account">
              <p className="acct-p">Your account and your saved bases are removed {DELETION_WAIT_DAYS} days from today. Nothing is sent to you while it waits. You can cancel any time before then by signing in.</p>
              <div className="acct-actions">
                <button className="btn-danger" onClick={() => run(requestAccountDeletion)} disabled={busy}>{busy ? "One moment..." : "Delete my account"}</button>
                <button className="btn-plain" onClick={() => setConfirming(false)} disabled={busy}>Keep my account</button>
              </div>
            </div>
          )}
          {message ? <div className="acct-msg" role="alert">{message}</div> : null}
        </div>
      );
    }

    // The Name row of the account screen. No name stored: the one-line prompt "What should we call
    // you?" with a box and Save (how an account made before the name existed gets one). Stored: the
    // name and "Change". Writes go through set_first_name; a missing function reads "Not available
    // yet" (the website's migration is not applied), like the delete functions.
    function FirstNameRow({ account }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState("");
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const stored = account.firstName;
      const save = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await setFirstName(draft);
        setBusy(false);
        if (result === "ok") { setEditing(false); return; }
        setMessage(result === "unavailable" ? "Not available yet." : "That did not work. Try again in a few minutes.");
      };
      if (!account.profileRead) return <dd>Reading.</dd>;
      if (stored && !editing) {
        return (
          <dd className="acct-name">
            <span>{stored}</span>
            <button type="button" className="btn-quiet" onClick={() => { setDraft(stored); setEditing(true); setMessage(""); }}>Change</button>
          </dd>
        );
      }
      return (
        <dd>
          <form className="acct-name-form" onSubmit={save}>
            <label className="fld-l" htmlFor="acct-name">What should we call you?</label>
            <div className="acct-name">
              <input id="acct-name" className="fld" type="text" autoComplete="given-name" autoCapitalize="words" spellCheck={false} maxLength={FIRST_NAME_MAX_CHARS}
                value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="First name" />
              <button type="submit" className="btn-quiet" disabled={busy || !cleanFirstName(draft)}>{busy ? "Saving..." : "Save"}</button>
              {stored ? <button type="button" className="btn-quiet" onClick={() => { setEditing(false); setMessage(""); }} disabled={busy}>Cancel</button> : null}
            </div>
            {message ? <div className="acct-msg" role="alert">{message}</div> : null}
          </form>
        </dd>
      );
    }

    // The account screen: the name, the address, the role, the saved bases with Remove, sign out,
    // delete.
    // Signed out it IS the sign-in screen. Names come from the base list; a slug the list does not
    // know (saved on the website for a base the app has no guide for yet) shows as its slug.
    function AccountScreen({ account, saved, inAccount, bases, onToggleSave, onOpen }) {
      if (account.status === "off") return <div className="content"><h2 className="screen-h">Account</h2><p className="acct-p">{SIGN_IN_MESSAGE.off}</p></div>;
      if (account.status === "loading") return <div className="content"><h2 className="screen-h">Account</h2><p className="acct-p" role="status">Checking your sign-in.</p></div>;
      if (account.status === "signed-out") return <SignInScreen />;
      const nameOf = (slug) => { const b = (bases || []).find((x) => x.slug === slug); return b ? b.name : slug.replace(/-/g, " "); };
      const readyOf = (slug) => { const b = (bases || []).find((x) => x.slug === slug); return !!(b && b.ready); };
      return (
        <div className="content">
          <h2 className="screen-h">Your account</h2>
          <div className="card">
            <dl className="facts">
              <dt>Name</dt><FirstNameRow account={account} />
              <dt>Email</dt><dd style={{ wordBreak: "break-all" }}>{account.user.email}</dd>
              <dt>Role</dt><dd>{account.role ? ROLE_LABEL[account.role] : "Reading."}</dd>
            </dl>
          </div>

          <h3 className="acct-h">Your saved bases</h3>
          {!inAccount ? <p className="muted small" role="status">Loading your saved bases.</p> : null}
          {saved.length === 0 ? (
            <p className="acct-p">None yet. Tap the bookmark on a base to save it here.</p>
          ) : (
            <ul className="lst acct-list">
              {saved.map((slug) => (
                <li key={slug}>
                  <button className="t" style={{ textAlign: "left", padding: 0, cursor: readyOf(slug) ? "pointer" : "default" }} onClick={() => readyOf(slug) && onOpen(slug)}>{nameOf(slug)}</button>
                  <button className="rm" onClick={() => onToggleSave(slug)} aria-label={"Remove " + nameOf(slug) + " from your saved bases"}>Remove</button>
                </li>
              ))}
            </ul>
          )}
          <div className="faint tiny" style={{ marginTop: 8 }}>Up to {MAX_SAVED_BASES} bases, kept in your account and shown on every device you sign in on.</div>

          <h3 className="acct-h">Sign out</h3>
          <p className="acct-p">Signs you out on this device only. Your saved bases stay in your account.</p>
          <button className="btn-plain" onClick={() => signOut()}>Sign out</button>

          <DeleteAccountBlock account={account} />
        </div>
      );
    }

    // Map (Leaflet + free OpenStreetMap tiles): base + live nearby places + drive time.
    function MapScreen({ slug, bases, onOpen }) {
      const elRef = useRef(null);
      const [data, setData] = useState(null);
      const [places, setPlaces] = useState([]);
      const [drive, setDrive] = useState(null);
      const [geoBusy, setGeoBusy] = useState(false);

      useEffect(() => {
        setData(null); setPlaces([]); setDrive(null);
        if (!slug) return;
        let live = true;
        fetchJSON(baseUrl(slug)).then((d) => { if (live) setData(d); }).catch(() => {});
        return () => { live = false; };
      }, [slug]);

      useEffect(() => {
        const c = data && data.coords; if (!c) return;
        let live = true;
        fetchJSON(apiUrl("/api/places/nearby?lat=" + c.lat + "&lng=" + c.lng + "&type=restaurant&radius=5000"))
          .then((d) => { if (live) setPlaces(d.results || []); }).catch(() => {});
        return () => { live = false; };
      }, [data]);

      useEffect(() => {
        const c = data && data.coords;
        if (!c || !elRef.current || !window.L) return;
        const map = L.map(elRef.current, { scrollWheelZoom: false }).setView([c.lat, c.lng], 12);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "(c) OpenStreetMap", maxZoom: 19 }).addTo(map);
        L.circleMarker([c.lat, c.lng], { radius: 9, color: "#e7b24c", fillColor: "#e7b24c", fillOpacity: 0.9, weight: 2 }).addTo(map).bindPopup("<b>" + (data.name || "") + "</b>");
        places.forEach((p) => { if (p.location) L.circleMarker([p.location.latitude, p.location.longitude], { radius: 5, color: "#8aa0bf", fillColor: "#8aa0bf", fillOpacity: 0.85, weight: 1 }).addTo(map).bindPopup((p.name || "") + (p.rating ? " - " + p.rating : "")); });
        setTimeout(() => map.invalidateSize(), 120);
        return () => map.remove();
      }, [data, places]);

      const driveFromMe = () => {
        const c = data && data.coords; if (!c || !navigator.geolocation) return;
        setGeoBusy(true);
        navigator.geolocation.getCurrentPosition((pos) => {
          fetchJSON(apiUrl("/api/directions?from_lat=" + pos.coords.latitude + "&from_lng=" + pos.coords.longitude + "&to_lat=" + c.lat + "&to_lng=" + c.lng))
            .then((d) => { setGeoBusy(false); setDrive(d); })
            .catch(() => { setGeoBusy(false); setDrive({ error: true }); });
        }, () => setGeoBusy(false), { timeout: 10000 });
      };

      if (!slug) {
        const ready = (bases || []).filter((b) => b.ready);
        return (
          <div className="content"><h2 className="screen-h">Map</h2>
            <div className="center">Open a base to see its map and nearby places.
              {ready.length ? <div style={{ marginTop: 14, display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center" }}>{ready.map((b) => <button key={b.slug} className="btn-gold" onClick={() => onOpen(b.slug)}>{b.name}</button>)}</div> : null}
            </div>
          </div>
        );
      }
      return (
        <div className="content">
          <h2 className="screen-h">{data ? data.name : "Map"}</h2>
          <div ref={elRef} className="leaflet-wrap" />
          <div className="between" style={{ marginTop: 10 }}>
            <span className="faint tiny">{places.length ? places.length + " places nearby" : "Loading map..."}</span>
            <button className="btn-quiet" onClick={driveFromMe} disabled={geoBusy}>{geoBusy ? "Locating..." : "Drive time from me"}</button>
          </div>
          {drive ? (drive.error ? <div className="muted tiny" style={{ marginTop: 6 }}>Couldn't get drive time.</div> : <div className="muted small" style={{ marginTop: 6 }}>About {drive.duration_min} min ({drive.distance_mi} mi) from your location to {data.name}.</div>) : null}
        </div>
      );
    }

    /* ---------------- App shell ---------------- */
    function App() {
      const [tab, setTab] = useState("home");
      const [bases, setBases] = useState(null);
      const [loading, setLoading] = useState(true);
      const [slug, setSlug] = useState(null);
      const [loadFailed, setLoadFailed] = useState(false);
      // The account and the saved list come from the two stores above (ACCOUNT, SAVED BASES); the
      // screens only ever see `saved` as an array of slugs, as they did before accounts.
      const account = useAccount();
      const { slugs: saved, inAccount } = useSavedBases();
      const [notice, setNotice] = useState("");

      /* The base list loads once at launch. WARNING: a failed load used to fall through to an empty list, so Home said
         "No bases yet" as if the data were gone (seen on Chris's phone 2026-11-10: the request never reached the server).
         A failure is now its own state with a Try again button, and the app retries by itself when the phone comes back
         online or the app returns to the foreground. On failure the other screens still get an empty list (not null),
         because Map, Plan and Saved read `bases` directly. */
      const loadBases = useCallback(() => {
        setLoading(true);
        fetchJSON(indexUrl())
          .then((d) => { setBases(d.bases || []); setLoadFailed(false); })
          .catch(() => { setBases((prev) => prev || []); setLoadFailed(true); })
          .finally(() => setLoading(false));
      }, []);
      useEffect(() => { loadBases(); }, [loadBases]);
      useEffect(() => {
        if (!loadFailed) return undefined;
        const retry = () => { if (document.visibilityState !== "hidden") loadBases(); };
        window.addEventListener("online", retry);
        document.addEventListener("visibilitychange", retry);
        return () => {
          window.removeEventListener("online", retry);
          document.removeEventListener("visibilitychange", retry);
        };
      }, [loadFailed, loadBases]);

      const open = useCallback((s) => { setSlug(s); setTab("guide"); }, []);
      const back = useCallback(() => { setSlug(null); setTab("home"); }, []);
      const toggleSave = useCallback((s) => {
        if (toggleSavedBase(s) === "full") setNotice("Your account keeps up to " + MAX_SAVED_BASES + " saved bases. Remove one first.");
      }, []);
      useEffect(() => {
        if (!notice) return undefined;
        const id = setTimeout(() => setNotice(""), 5000);
        return () => clearTimeout(id);
      }, [notice]);
      const openAccount = useCallback(() => setTab("account"), []);

      let body;
      if (tab === "home") body = <Home bases={bases} loading={loading} loadFailed={loadFailed} onRetry={loadBases} onOpen={open} saved={saved} onToggleSave={toggleSave} />;
      else if (tab === "guide") body = slug
        ? <BaseDetail slug={slug} onBack={back} saved={saved} onToggleSave={toggleSave} />
        : <Stub label="Guide" note="Pick a base from Home to open its guide." />;
      else if (tab === "map") body = <MapScreen slug={slug} bases={bases} onOpen={open} />;
      else if (tab === "plan") body = <PlanScreen bases={bases} onOpen={open} />;
      else if (tab === "account") body = <AccountScreen account={account} saved={saved} inAccount={inAccount} bases={bases} onToggleSave={toggleSave} onOpen={open} />;
      else body = <SavedScreen bases={bases} saved={saved} onToggleSave={toggleSave} onOpen={open} account={account} inAccount={inAccount} onOpenAccount={openAccount} />;

      // The account entry lives in the top bar (the app keeps account-ish things there, not in the
      // five-tab nav). RULE (Chris, 2026-11-24, after testing): the header must make the state
      // obvious - the person icon + "Sign in" when signed out, the person icon + "Hi <first name>"
      // ("Hi there" without a name) when signed in. The address is NOT shown here any more; it
      // stays on the account screen. Hidden entirely while accounts are off. During "loading" the
      // entry keeps the signed-out look ("Sign in") and swaps once the stored session is read, so a
      // signed-in reader sees that swap for a moment on each launch; a wrong "Hi there" before the
      // session is known would be the worse lie.
      const accountEntry = account.status === "off" ? null : (
        <button className={"acct-entry" + (tab === "account" ? " on" : "")} onClick={openAccount} aria-label={account.status === "signed-in" ? "Your account" : SIGN_IN_TEXT.label}>
          <Icon name="person" size={18} />
          <span>{account.status === "signed-in" ? greeting(account.firstName) : SIGN_IN_TEXT.label}</span>
        </button>
      );

      const NavBtn = ({ id, icon, label }) => (
        <button className={tab === id ? "on" : ""} onClick={() => setTab(id)}>
          <span className="ic"><Icon name={icon} size={21} /></span>{label}
        </button>
      );

      return (
        <div id="app-shell">
          <div className="topbar">
            <div className="topbar-row">
              <div>
                <h1>{APP_NAME}</h1>
                <div className="sub">{BRAND}</div>
              </div>
              {accountEntry}
            </div>
          </div>
          <UpdateBanner />
          {notice ? <div className="banner" role="status"><span>{notice}</span><button onClick={() => setNotice("")}>OK</button></div> : null}
          {body}
          <div className="nav">
            <NavBtn id="home" icon="home" label="HOME" />
            <NavBtn id="guide" icon="guide" label="GUIDE" />
            <NavBtn id="map" icon="map" label="MAP" />
            <NavBtn id="plan" icon="calendar" label="PLAN" />
            <NavBtn id="saved" icon="bookmark" label="SAVED" />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
