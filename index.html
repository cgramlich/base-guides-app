            <div className="faint tiny" role={done ? "status" : undefined} style={{ marginTop: 4 }}>{done || "The emailed code always works too."}</div>
          </dd>
        );
      }
      return (
        <dd>
          <form className="acct-name-form" onSubmit={save} data-password-form={needCurrent ? "change" : "set"}>
            {needCurrent ? <PasswordField id="acct-pw-current" label="Current password" autoComplete="current-password" value={current} onChange={setCurrent} showRule={false} /> : null}
            <PasswordField id="acct-pw-new" label={needCurrent ? "New password" : "Password"} autoComplete="new-password" value={next} onChange={setNext} />
            <div className="acct-actions">
              <button type="submit" className="btn-quiet" disabled={busy || next.length < PASSWORD_MIN_CHARS || (needCurrent && !current)}>{busy ? "Saving..." : "Save"}</button>
              <button type="button" className="btn-quiet" onClick={close} disabled={busy}>Cancel</button>
            </div>
            {message ? <div className="acct-msg" role="alert">{message}</div> : null}
          </form>
        </dd>
      );
    }
    // The sign-in screen: the fixed sentences, then two steps - the optional first name, the address
    // and "Send me a code", then the code and "Sign in". The words live in SIGN_IN_TEXT; this is the
    // behaviour. The typed name stays in this component through the code step: it is sent with the
    // code request (new account) and again after the code is accepted (existing account).
    // The screen version travels on the element (data-screen-version), the record of what was shown.
    // "Use a password instead" swaps the email step for the password step (address and password);
    // the password is held only in this component's box and emptied after every try.
    function SignInScreen() {
      const [firstName, setFirstNameTyped] = useState("");
      const [email, setEmail] = useState("");
      const [code, setCode] = useState("");
      const [password, setPasswordTyped] = useState("");
      const [step, setStep] = useState("email"); // "email" | "code" | "password"
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const signInWithPassword = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await signInWithPasswordFor(email, password);
        setBusy(false);
        setPasswordTyped("");
        // On "ok" the auth listener moves the app to the account screen, as after a code.
        if (result !== "ok") setMessage(result === "off" ? SIGN_IN_MESSAGE.off : (PASSWORD_MESSAGE[result] || PASSWORD_MESSAGE.failed));
      };
      const switchTo = (next) => { setStep(next); setMessage(""); setPasswordTyped(""); };

      const send = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await sendSignInCode(email, firstName);
        setBusy(false);
        if (result === "sent") { setStep("code"); setCode(""); return; }
        setMessage(SIGN_IN_MESSAGE[result] || SIGN_IN_MESSAGE.failed);
      };
      const verify = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await verifySignInCode(email, code, firstName);
        setBusy(false);
        // On "ok" the auth listener moves the app to the account screen; nothing to do here.
        if (result !== "ok") setMessage(SIGN_IN_MESSAGE[result] || SIGN_IN_MESSAGE["check-failed"]);
      };
      const askAgain = async () => {
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await sendSignInCode(email, firstName);
        setBusy(false);
        setMessage(result === "sent" ? "A new code is on its way." : (SIGN_IN_MESSAGE[result] || SIGN_IN_MESSAGE.failed));
      };

      return (
        <div className="content" data-screen-version={SIGN_IN_SCREEN_VERSION}>
          <h2 className="screen-h">{SIGN_IN_TEXT.title}</h2>
          <p className="acct-p">{SIGN_IN_TEXT.whatYouGet}</p>
          {step === "email" ? (
            <form onSubmit={send}>
              <label className="fld-l" htmlFor="acct-first-name">{SIGN_IN_TEXT.firstNameLabel}</label>
              <input id="acct-first-name" className="fld" type="text" autoComplete="given-name" autoCapitalize="words" spellCheck={false} maxLength={FIRST_NAME_MAX_CHARS}
                value={firstName} onChange={(e) => setFirstNameTyped(e.target.value)} style={{ marginBottom: 12 }} />
              <label className="fld-l" htmlFor="acct-email">{SIGN_IN_TEXT.emailLabel}</label>
              <input id="acct-email" className="fld" type="email" inputMode="email" autoComplete="email" autoCapitalize="none" spellCheck={false}
                value={email} onChange={(e) => setEmail(e.target.value)} required />
              <p className="acct-p small" style={{ marginTop: 14 }}>{SIGN_IN_TEXT.weeklyEmail}</p>
              <p className="acct-p small">{SIGN_IN_TEXT.noCallsNoTexts}</p>
              <button className="btn-gold" type="submit" disabled={busy}>{busy ? "Sending..." : SIGN_IN_TEXT.button}</button>
              <div className="acct-actions">
                <button type="button" className="btn-quiet" data-use-password onClick={() => switchTo("password")} disabled={busy}>{SIGN_IN_TEXT.usePassword}</button>
              </div>
              <p className="acct-p small" style={{ marginTop: 12 }}>
                By continuing you accept our <a href={PRIVACY_URL} target="_blank" rel="noopener noreferrer">privacy policy</a>.
              </p>
              {message ? <div className="acct-msg" role="alert">{message}</div> : null}
            </form>
          ) : step === "password" ? (
            <form onSubmit={signInWithPassword} data-sign-in-step="password">
              <label className="fld-l" htmlFor="acct-email-pw">{SIGN_IN_TEXT.emailLabel}</label>
              <input id="acct-email-pw" className="fld" type="email" inputMode="email" autoComplete="email" autoCapitalize="none" spellCheck={false}
                value={email} onChange={(e) => setEmail(e.target.value)} required style={{ marginBottom: 12 }} />
              <PasswordField id="acct-password" label={SIGN_IN_TEXT.passwordLabel} autoComplete="current-password" value={password} onChange={setPasswordTyped} />
              <button className="btn-gold" type="submit" disabled={busy || password.length < PASSWORD_MIN_CHARS || !email.trim()}>{busy ? "Checking..." : SIGN_IN_TEXT.passwordButton}</button>
              <p className="acct-p small" style={{ marginTop: 12 }}>{SIGN_IN_TEXT.forgot}</p>
              <div className="acct-actions">
                <button type="button" className="btn-quiet" onClick={() => switchTo("email")} disabled={busy}>{SIGN_IN_TEXT.useCode}</button>
              </div>
              <p className="acct-p small" style={{ marginTop: 12 }}>
                By continuing you accept our <a href={PRIVACY_URL} target="_blank" rel="noopener noreferrer">privacy policy</a>.
              </p>
              {message ? <div className="acct-msg" role="alert">{message}</div> : null}
            </form>
          ) : (
            <form onSubmit={verify}>
              <p className="acct-p" role="status">{SIGN_IN_TEXT.sent}</p>
              <label className="fld-l" htmlFor="acct-code">{SIGN_IN_TEXT.codeLabel}</label>
              <input id="acct-code" className="fld acct-code" type="text" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9]*" maxLength={CODE_MAX_DIGITS}
                value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} autoFocus />
              <button className="btn-gold" type="submit" disabled={busy || code.length < CODE_MIN_DIGITS || code.length > CODE_MAX_DIGITS}>{busy ? "Checking..." : SIGN_IN_TEXT.codeButton}</button>
              <div className="acct-actions">
                <button type="button" className="btn-quiet" onClick={askAgain} disabled={busy}>Send a new code</button>
                <button type="button" className="btn-quiet" onClick={() => { setStep("email"); setMessage(""); }} disabled={busy}>Use a different address</button>
              </div>
              {message ? <div className={"acct-msg" + (message.indexOf("on its way") !== -1 ? " ok" : "")} role="alert">{message}</div> : null}
            </form>
          )}
        </div>
      );
    }

    // Delete my account, the confirm sheet and the pending state. Words from Chris (2026-11-23,
    // 2026-11-24): 30 days, nothing sent while it waits, cancel by signing in.
    function DeleteAccountBlock({ account }) {
      const [confirming, setConfirming] = useState(false);
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const run = async (action) => {
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await action();
        setBusy(false);
        if (result === "ok") { setConfirming(false); return; }
        setMessage(result === "unavailable" ? "Not available yet." : "That did not work. Try again in a few minutes.");
      };
      if (account.deletionRequestedAt) {
        const requested = new Date(account.deletionRequestedAt);
        return (
          <div>
            <h3 className="acct-h">Delete my account</h3>
            <p className="acct-p">Deletion requested on {fmtDate(requested)}. Your account is removed on {fmtDate(addDays(requested, DELETION_WAIT_DAYS))}.</p>
            <button className="btn-plain" onClick={() => run(cancelAccountDeletion)} disabled={busy}>{busy ? "One moment..." : "Cancel deletion"}</button>
            {message ? <div className="acct-msg" role="alert">{message}</div> : null}
          </div>
        );
      }
      return (
        <div>
          <h3 className="acct-h">Delete my account</h3>
          {!confirming ? (
            <button className="btn-danger" onClick={() => { setConfirming(true); setMessage(""); }}>Delete my account</button>
          ) : (
            <div className="card acct-sheet" role="dialog" aria-label="Delete my account">
              <p className="acct-p">Your account and your saved bases are removed {DELETION_WAIT_DAYS} days from today. Nothing is sent to you while it waits. You can cancel any time before then by signing in.</p>
              <div className="acct-actions">
                <button className="btn-danger" onClick={() => run(requestAccountDeletion)} disabled={busy}>{busy ? "One moment..." : "Delete my account"}</button>
                <button className="btn-plain" onClick={() => setConfirming(false)} disabled={busy}>Keep my account</button>
              </div>
            </div>
          )}
          {message ? <div className="acct-msg" role="alert">{message}</div> : null}
        </div>
      );
    }

    // The Name row of the account screen. No name stored: the one-line prompt "What should we call
    // you?" with a box and Save (how an account made before the name existed gets one). Stored: the
    // name and "Change". Writes go through set_first_name; a missing function reads "Not available
    // yet" (the website's migration is not applied), like the delete functions.
    function FirstNameRow({ account }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState("");
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState("");
      const stored = account.firstName;
      const save = async (e) => {
        e.preventDefault();
        if (busy) return;
        setBusy(true); setMessage("");
        const result = await setFirstName(draft);
        setBusy(false);
        if (result === "ok") { setEditing(false); return; }
        setMessage(result === "unavailable" ? "Not available yet." : "That did not work. Try again in a few minutes.");
      };
      if (!account.profileRead) return <dd>Reading.</dd>;
      if (stored && !editing) {
        return (
          <dd className="acct-name">
            <span>{stored}</span>
            <button type="button" className="btn-quiet" onClick={() => { setDraft(stored); setEditing(true); setMessage(""); }}>Change</button>
          </dd>
        );
      }
      return (
        <dd>
          <form className="acct-name-form" onSubmit={save}>
            <label className="fld-l" htmlFor="acct-name">What should we call you?</label>
            <div className="acct-name">
              <input id="acct-name" className="fld" type="text" autoComplete="given-name" autoCapitalize="words" spellCheck={false} maxLength={FIRST_NAME_MAX_CHARS}
                value={draft} onChange={(e) => setDraft(e.target.value)} placeholder="First name" />
              <button type="submit" className="btn-quiet" disabled={busy || !cleanFirstName(draft)}>{busy ? "Saving..." : "Save"}</button>
              {stored ? <button type="button" className="btn-quiet" onClick={() => { setEditing(false); setMessage(""); }} disabled={busy}>Cancel</button> : null}
            </div>
            {message ? <div className="acct-msg" role="alert">{message}</div> : null}
          </form>
        </dd>
      );
    }

    // The account screen: the name, My base, the pay grade, the address, the password, the role, the
    // saved bases with Remove, sign out, delete.
    // Signed out it IS the sign-in screen. Names come from the base list; a slug the list does not
    // know (saved on the website for a base the app has no guide for yet) shows as its slug.
    // The My base row of the account screen: the name (opens the guide) with Change and Clear; with
    // none, "No base listed." and "Add your base", which opens a search box with a one-tap "This is
    // my base" on each match. Writes go through set_current_base; a missing function answers "Not
    // available yet" (the website's migration is not applied), like the name row.
    function MyBaseRow({ myBase, bases, onSetMyBase, onOpen }) {
      const [editing, setEditing] = useState(false);
      const [q, setQ] = useState("");
      const name = myBaseName(myBase, bases);
      if (!myBase.inAccount) return <dd>Reading.</dd>;
      const ql = q.trim().toLowerCase();
      const matches = ql
        ? (bases || []).filter((b) => b.ready && !b.hub && (b.name + " " + (b.state || "") + " " + stateTokens(b.state).map(stateFull).join(" ")).toLowerCase().indexOf(ql) !== -1).sort(byTierThenName).slice(0, 8)
        : [];
      if (!editing) {
        return (
          <dd className="acct-name" data-my-base-row={myBase.slug ? "set" : "none"}>
            {myBase.slug
              ? <button type="button" className="t" style={{ padding: 0, textAlign: "left" }} onClick={() => onOpen(myBase.slug)}>{name}</button>
              : <span>{NO_BASE_LISTED}</span>}
            <button type="button" className="btn-quiet" onClick={() => { setQ(""); setEditing(true); }}>{myBase.slug ? "Change" : "Add your base"}</button>
            {myBase.slug ? <button type="button" className="btn-quiet" onClick={() => onSetMyBase(null)}>Clear</button> : null}
          </dd>
        );
      }
      return (
        <dd>
          <div className="acct-name-form">
            <label className="fld-l" htmlFor="acct-my-base">Which base is yours?</label>
            <input id="acct-my-base" className="fld" type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search base or state" autoFocus />
            {matches.length ? (
              <ul className="lst acct-list mybase-matches">
                {matches.map((b) => (
                  <li key={b.slug}>
                    <span>{b.name}</span>
                    <button type="button" className="rm" onClick={() => { setEditing(false); onSetMyBase({ slug: b.slug, name: b.name }); }}>This is my base</button>
                  </li>
                ))}
              </ul>
            ) : (ql ? <div className="faint tiny" style={{ marginTop: 6 }}>No bases match.</div> : null)}
            <button type="button" className="btn-quiet" style={{ marginTop: 6 }} onClick={() => setEditing(false)}>Cancel</button>
          </div>
        </dd>
      );
    }

    function AccountScreen({ account, saved, inAccount, bases, onToggleSave, onOpen, myBase, onSetMyBase }) {
      if (account.status === "off") return <div className="content"><h2 className="screen-h">Account</h2><p className="acct-p">{SIGN_IN_MESSAGE.off}</p></div>;
      if (account.status === "loading") return <div className="content"><h2 className="screen-h">Account</h2><p className="acct-p" role="status">Checking your sign-in.</p></div>;
      if (account.status === "signed-out") return <SignInScreen />;
      const nameOf = (slug) => { const b = (bases || []).find((x) => x.slug === slug); return b ? b.name : slug.replace(/-/g, " "); };
      const readyOf = (slug) => { const b = (bases || []).find((x) => x.slug === slug); return !!(b && b.ready); };
      return (
        <div className="content">
          <h2 className="screen-h">Your account</h2>
          <div className="card">
            <dl className="facts">
              <dt>Name</dt><FirstNameRow account={account} />
              <dt>My base</dt><MyBaseRow myBase={myBase} bases={bases} onSetMyBase={onSetMyBase} onOpen={onOpen} />
              <dt>{PAY_GRADE_TEXT.label}</dt><PayGradeRow account={account} />
              <dt>Email</dt><dd style={{ wordBreak: "break-all" }}>{account.user.email}</dd>
              <dt>Password</dt><PasswordRow account={account} />
              <dt>Role</dt><dd>{account.role ? ROLE_LABEL[account.role] : "Reading."}</dd>
            </dl>
          </div>

          <h3 className="acct-h">Your saved bases</h3>
          {!inAccount ? <p className="muted small" role="status">Loading your saved bases.</p> : null}
          {saved.length === 0 ? (
            <p className="acct-p">None yet. Tap the bookmark on a base to save it here.</p>
          ) : (
            <ul className="lst acct-list">
              {saved.map((slug) => (
                <li key={slug}>
                  <button className="t" style={{ textAlign: "left", padding: 0, cursor: readyOf(slug) ? "pointer" : "default" }} onClick={() => readyOf(slug) && onOpen(slug)}>{nameOf(slug)}</button>
                  <button className="rm" onClick={() => onToggleSave(slug)} aria-label={"Remove " + nameOf(slug) + " from your saved bases"}>Remove</button>
                </li>
              ))}
            </ul>
          )}
          <div className="faint tiny" style={{ marginTop: 8 }}>Up to {MAX_SAVED_BASES} bases, kept in your account and shown on every device you sign in on. Your own base (My base, above) is separate and does not take one of the {MAX_SAVED_BASES} places.</div>

          <WebsiteTools saved={saved} myBaseSlug={myBase.slug} />

          <h3 className="acct-h">Sign out</h3>
          <p className="acct-p">Signs you out on this device only. Your saved bases stay in your account.</p>
          <button className="btn-plain" onClick={() => signOut()}>Sign out</button>

          <DeleteAccountBlock account={account} />
        </div>
      );
    }

    // Map (Leaflet + free OpenStreetMap tiles): base + live nearby places + drive time.
    /* ---------------- EMPTY STATES: Map and Guide tabs with no base open ----------------
       RULE (Chris's screenshots 2026-11-24, "This was not fixed"; auditor round 2): a tab with no base
       open shows something a family can use, never a wall of wing codes and never a blank screen.
         - With saved bases: "Your saved bases" as rows, tap one to open it (the Map tab also draws them
           on a small map, from each guide's stored point).
         - With none: the search box, then the places families live (tier 1) grouped by state as rows.
       ROAD NOT TAKEN: the old chip grid of every ready base (543 chips, alphabetical, wings first) and
       the one-sentence stub. Both read as a broken app. */
    function BaseRow({ b, bases, onOpen }) {
      return (
        <div className="card tap" onClick={() => onOpen(b.slug)}>
          <div className="between">
            <div style={{ minWidth: 0 }}>
              <div className="base-name">{b.name}</div>
              <div className="meta-line">{[b.branch, b.state].filter(Boolean).join("  -  ")}</div>
              <ParentLine b={b} bases={bases} />
            </div>
            <span className="card-go"><Icon name="cardchev" size={20} /></span>
          </div>
        </div>
      );
    }
    // The saved bases on one small map. Points come from each saved guide (at most MAX_SAVED_BASES
    // fetches, the same files the guide screen reads and the service worker caches). The index has
    // no points of its own; the backend could carry them later (proposed to the lead).
    function SavedBasesMap({ saved, bases, onOpen }) {
      const elRef = useRef(null);
      const [points, setPoints] = useState([]);
      useEffect(() => {
        let live = true;
        const slugs = (saved || []).slice(0, MAX_SAVED_BASES);
        if (!slugs.length) { setPoints([]); return undefined; }
        Promise.all(slugs.map((s) => fetchJSON(baseUrl(s)).then((d) => ({ slug: s, name: d.name, coords: d.coords })).catch(() => null)))
          .then((rows) => { if (live) setPoints(rows.filter((r) => r && r.coords && r.coords.lat != null)); });
        return () => { live = false; };
      }, [saved]);
      useEffect(() => {
        if (!points.length || !elRef.current || !window.L) return undefined;
        const map = L.map(elRef.current, { scrollWheelZoom: false, zoomControl: false, attributionControl: false });
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
        const group = L.featureGroup(points.map((pt) => L.circleMarker([pt.coords.lat, pt.coords.lng], { radius: 7, color: "#e7b24c", fillColor: "#e7b24c", fillOpacity: 0.9, weight: 2 })
          .bindTooltip(pt.name || pt.slug, { permanent: true, direction: "top", offset: [0, -8], className: "map-label base" })
          .on("click", () => onOpen(pt.slug)))).addTo(map);
        map.fitBounds(group.getBounds().pad(0.4), { maxZoom: 7 });
        setTimeout(() => map.invalidateSize(), 120);
        return () => map.remove();
      }, [points, onOpen]);
      if (!points.length) return null;
      return <div ref={elRef} className="pick-map" />;
    }
    function PickABase({ bases, saved, onOpen, hint, withMap }) {
      const [q, setQ] = useState("");
      const all = bases || [];
      const savedRows = all.filter((b) => (saved || []).includes(b.slug) && b.ready).sort(byTierThenName);
      if (savedRows.length) {
        return (
          <div className="pick-rows">
            <div className="pick-hint">{hint}</div>
            {withMap ? <SavedBasesMap saved={saved} bases={all} onOpen={onOpen} /> : null}
            <div className="pick-h">Your saved bases</div>
            {savedRows.map((b) => <BaseRow key={b.slug} b={b} bases={all} onOpen={onOpen} />)}
          </div>
        );
      }
      const ql = q.trim().toLowerCase();
      const matchQ = (b) => !ql || (b.name + " " + (b.state || "") + " " + stateTokens(b.state).map(stateFull).join(" ")).toLowerCase().indexOf(ql) !== -1;
      const rows = all.filter((b) => b.ready && !b.hub && (ql ? matchQ(b) : guideTier(b) === 1));
      const groups = {};
      rows.forEach((b) => { const k = b.state || "Other"; (groups[k] = groups[k] || []).push(b); });
      const keys = Object.keys(groups).sort((a, b) => stateLabel(a).localeCompare(stateLabel(b)));
      keys.forEach((k) => groups[k].sort(byTierThenName));
      return (
        <div className="pick-rows">
          <div className="pick-hint">{hint}</div>
          <input className="fld home-search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search base or state" />
          {!rows.length ? <div className="pending" style={{ marginTop: 10 }}>No bases match.</div> : null}
          {keys.map((k) => (
            <div key={k}>
              <div className="state-header">{stateLabel(k)}</div>
              {groups[k].map((b) => <BaseRow key={b.slug} b={b} bases={all} onOpen={onOpen} />)}
            </div>
          ))}
        </div>
      );
    }

    const MAP_LABELLED_PLACES = 8;
    function MapScreen({ slug, bases, saved, onOpen }) {
      const elRef = useRef(null);
      const [data, setData] = useState(null);
      const [places, setPlaces] = useState([]);
      const [drive, setDrive] = useState(null);
      const [geoBusy, setGeoBusy] = useState(false);

      useEffect(() => {
        setData(null); setPlaces([]); setDrive(null);
        if (!slug) return;
        let live = true;
        fetchJSON(baseUrl(slug)).then((d) => { if (live) setData(d); }).catch(() => {});
        return () => { live = false; };
      }, [slug]);

      useEffect(() => {
        const c = data && data.coords; if (!c) return;
        let live = true;
        fetchJSON(apiUrl("/api/places/nearby?lat=" + c.lat + "&lng=" + c.lng + "&type=restaurant&radius=5000"))
          .then((d) => { if (live) setPlaces(d.results || []); }).catch(() => {});
        return () => { live = false; };
      }, [data]);

      useEffect(() => {
        const c = data && data.coords;
        if (!c || !elRef.current || !window.L) return;
        const map = L.map(elRef.current, { scrollWheelZoom: false }).setView([c.lat, c.lng], 12);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "(c) OpenStreetMap", maxZoom: 19 }).addTo(map);
        // RULE (auditor round 2, item 26): markers carry their names. The base's label is always shown;
        // a place's label shows for the first MAP_LABELLED_PLACES places so the map stays readable, the
        // rest keep their name in a tap popup.
        L.circleMarker([c.lat, c.lng], { radius: 9, color: "#e7b24c", fillColor: "#e7b24c", fillOpacity: 0.9, weight: 2 }).addTo(map)
          .bindTooltip(data.name || "", { permanent: true, direction: "top", offset: [0, -10], className: "map-label base" });
        places.forEach((p, i) => {
          if (!p.location) return;
          const m = L.circleMarker([p.location.latitude, p.location.longitude], { radius: 5, color: "#8aa0bf", fillColor: "#8aa0bf", fillOpacity: 0.85, weight: 1 }).addTo(map)
            .bindPopup((p.name || "") + (p.rating ? " - " + ratingText(p.rating, p.user_ratings_total) : ""));
          if (i < MAP_LABELLED_PLACES) m.bindTooltip(p.name || "", { permanent: true, direction: "right", offset: [6, 0], className: "map-label" });
        });
        setTimeout(() => map.invalidateSize(), 120);
        return () => map.remove();
      }, [data, places]);

      const driveFromMe = () => {
        const c = data && data.coords; if (!c || !navigator.geolocation) return;
        setGeoBusy(true);
        navigator.geolocation.getCurrentPosition((pos) => {
          fetchJSON(apiUrl("/api/directions?from_lat=" + pos.coords.latitude + "&from_lng=" + pos.coords.longitude + "&to_lat=" + c.lat + "&to_lng=" + c.lng))
            .then((d) => { setGeoBusy(false); setDrive(d); })
            .catch(() => { setGeoBusy(false); setDrive({ error: true }); });
        }, () => setGeoBusy(false), { timeout: 10000 });
      };

      if (!slug) {
        return (
          <div className="content"><h2 className="screen-h">Map</h2>
            <PickABase bases={bases} saved={saved} onOpen={onOpen} withMap hint="Open a base to see its map and the places near it." />
          </div>
        );
      }
      return (
        <div className="content">
          <h2 className="screen-h">{data ? data.name : "Map"}</h2>
          <div ref={elRef} className="leaflet-wrap" />
          <div className="between" style={{ marginTop: 10 }}>
            <span className="faint tiny">{places.length ? places.length + " places nearby" : "Loading map..."}</span>
            <button className="btn-quiet" onClick={driveFromMe} disabled={geoBusy}>{geoBusy ? "Locating..." : "Drive time from me"}</button>
          </div>
          {drive ? (drive.error ? <div className="muted tiny" style={{ marginTop: 6 }}>Couldn't get drive time.</div> : <div className="muted small" style={{ marginTop: 6 }}>{driveWords(drive.duration_min, drive.distance_mi)} from your location to {data.name}.</div>) : null}
          {/* The space under the map holds the places themselves (auditor round 2, item 26), the same rows as the guide's "nearby" part. */}
          {places.length ? <ul className="lst" style={{ marginTop: 12 }}>{places.slice(0, 10).map((p, i) => <PlaceRow key={p.place_id || i} p={p} />)}</ul> : null}
        </div>
      );
    }

    /* ---------------- App shell ---------------- */
    function App() {
      const [tab, setTab] = useState("home");
      const [bases, setBases] = useState(null);
      const [loading, setLoading] = useState(true);
      const [slug, setSlug] = useState(null);
      const [loadFailed, setLoadFailed] = useState(false);
      // The account and the saved list come from the two stores above (ACCOUNT, SAVED BASES); the
      // screens only ever see `saved` as an array of slugs, as they did before accounts.
      const account = useAccount();
      const { slugs: saved, inAccount } = useSavedBases();
      const myBase = useMyBase();
      const [notice, setNotice] = useState("");

      /* The base list loads once at launch. WARNING: a failed load used to fall through to an empty list, so Home said
         "No bases yet" as if the data were gone (seen on Chris's phone 2026-11-10: the request never reached the server).
         A failure is now its own state with a Try again button, and the app retries by itself when the phone comes back
         online or the app returns to the foreground. On failure the other screens still get an empty list (not null),
         because Map, Plan and Saved read `bases` directly. */
      const loadBases = useCallback(() => {
        setLoading(true);
        fetchJSON(indexUrl())
          .then((d) => { setBases(d.bases || []); setLoadFailed(false); })
          .catch(() => { setBases((prev) => prev || []); setLoadFailed(true); })
          .finally(() => setLoading(false));
      }, []);
      useEffect(() => { loadBases(); }, [loadBases]);
      useEffect(() => {
        if (!loadFailed) return undefined;
        const retry = () => { if (document.visibilityState !== "hidden") loadBases(); };
        window.addEventListener("online", retry);
        document.addEventListener("visibilitychange", retry);
        return () => {
          window.removeEventListener("online", retry);
          document.removeEventListener("visibilitychange", retry);
        };
      }, [loadFailed, loadBases]);

      // What the Home tab shows: "first" (the first screen), "choose" (its question, reached from
      // "Change my base") or "browse" (the list of every base). It lives here, not in Home, so that
      // Back from a guide returns to the list the reader opened it from. RULE: tapping the Home tab
      // always returns to the first screen.
      const [homeView, setHomeView] = useState("first");
      // "ask" when the first screen's "Ask a question about this base" opened the guide: the guide
      // then opens with the question field ready (AskBox, focusOnOpen). Nothing is sent by that.
      const [guideIntent, setGuideIntent] = useState(null);
      const open = useCallback((s, intent) => { setSlug(s); setGuideIntent(intent === "ask" ? "ask" : null); setTab("guide"); }, []);
      const openAsk = useCallback((s) => open(s, "ask"), [open]);
      // The first screen's "Places near the base": the Map tab's view of that base, as it is.
      const openMap = useCallback((s) => { setSlug(s); setGuideIntent(null); setTab("map"); }, []);
      const back = useCallback(() => { setSlug(null); setGuideIntent(null); setTab("home"); }, []);
      const goToTab = useCallback((id) => { if (id === "home") setHomeView("first"); setTab(id); }, []);
      const toggleSave = useCallback((s) => {
        if (toggleSavedBase(s) === "full") setNotice("Your account keeps up to " + MAX_SAVED_BASES + " saved bases. Remove one first.");
      }, []);
      useEffect(() => {
        if (!notice) return undefined;
        const id = setTimeout(() => setNotice(""), 5000);
        return () => clearTimeout(id);
      }, [notice]);
      const openAccount = useCallback(() => setTab("account"), []);
      // Sets or clears the reader's base and says what happened, naming the base it replaced.
      const setMyBaseAndTell = useCallback(async (base) => {
        const before = myBaseSnapshotGet();
        const beforeName = myBaseName(before, bases);
        const result = await setMyBase(base);
        if (result !== "ok") { setNotice(result === "unavailable" ? "My base is not available yet." : "That did not work. Try again in a few minutes."); return; }
        if (!base) { setNotice("No base listed now."); return; }
        setNotice(base.name + " is your base now." + (beforeName && before.slug !== base.slug ? " It replaces " + beforeName + "." : ""));
      }, [bases]);

      let body;
      if (tab === "home") body = <Home view={homeView} onView={setHomeView} bases={bases} loading={loading} loadFailed={loadFailed} onRetry={loadBases}
        onOpen={open} onOpenAsk={openAsk} onOpenMap={openMap} onOpenTab={goToTab} onOpenAccount={openAccount}
        saved={saved} onToggleSave={toggleSave} account={account} inAccount={inAccount} myBase={myBase} onSetMyBase={setMyBaseAndTell} />;
      else if (tab === "guide") body = slug
        ? <BaseDetail slug={slug} onBack={back} backLabel={homeView === "browse" ? FIND_A_BASE : "Home"} focusAsk={guideIntent === "ask"} saved={saved} onToggleSave={toggleSave} myBase={myBase} onSetMyBase={setMyBaseAndTell} />
        : <div className="content"><h2 className="screen-h">{FIND_A_BASE}</h2><PickABase bases={bases} saved={saved} onOpen={open} hint="Open a base to read its guide." /></div>;
      else if (tab === "map") body = <MapScreen slug={slug} bases={bases} saved={saved} onOpen={open} />;
      else if (tab === "plan") body = <PlanScreen bases={bases} onOpen={open} />;
      else if (tab === "account") body = <AccountScreen account={account} saved={saved} inAccount={inAccount} bases={bases} onToggleSave={toggleSave} onOpen={open} myBase={myBase} onSetMyBase={setMyBaseAndTell} />;
      else body = <SavedScreen bases={bases} saved={saved} onToggleSave={toggleSave} onOpen={open} account={account} inAccount={inAccount} onOpenAccount={openAccount} />;

      // The account entry lives in the top bar (the app keeps account-ish things there, not in the
      // five-tab nav). RULE (Chris, 2026-11-24, after testing): the header must make the state
      // obvious - the person icon + "Sign in" when signed out, the person icon + "Hi <first name>"
      // ("Hi there" without a name) when signed in. The address is NOT shown here any more; it
      // stays on the account screen. Hidden entirely while accounts are off. During "loading" the
      // entry keeps the signed-out look ("Sign in") and swaps once the stored session is read, so a
      // signed-in reader sees that swap for a moment on each launch; a wrong "Hi there" before the
      // session is known would be the worse lie.
      const accountEntry = account.status === "off" ? null : (
        <button className={"acct-entry" + (tab === "account" ? " on" : "")} onClick={openAccount} aria-label={account.status === "signed-in" ? "Your account" : SIGN_IN_TEXT.label}>
          <Icon name="person" size={18} />
          <span>{account.status === "signed-in" ? greeting(account.firstName) : SIGN_IN_TEXT.label}</span>
        </button>
      );

      const NavBtn = ({ id, icon, label }) => (
        <button className={tab === id ? "on" : ""} onClick={() => goToTab(id)}>
          <span className="ic"><Icon name={icon} size={21} /></span>{label}
        </button>
      );

      return (
        <div id="app-shell">
          {/* The bar (kit t01b): the wordmark left, the account entry right; nothing else. The app's
              name is the wordmark; the publisher's mark and line are the coin on the first screen's
              question. While the first screen is up the bar takes its ground (THE SEAM). */}
          <div className="topbar">
            <div className="topbar-row">
              <div className="wordmark">{APP_NAME}<span className="wordmark-by">by {BRAND}</span></div>
              {accountEntry}
            </div>
          </div>
          <UpdateBanner />
          {notice ? <div className="banner" role="status"><span>{notice}</span><button onClick={() => setNotice("")}>OK</button></div> : null}
          {body}
          {tab === "account" ? <LookChooser /> : null}
          <div className="nav">
            <NavBtn id="home" icon="home" label="Home" />
            <NavBtn id="guide" icon="guide" label="Guide" />
            <NavBtn id="map" icon="map" label="Map" />
            <NavBtn id="plan" icon="calendar" label="Plan" />
            <NavBtn id="saved" icon="bookmark" label="Saved" />
          </div>
        </div>
      );
    }

    /* ---------------- LAUNCH MARK check ----------------
       The HTML draws the wordmark and the first screen's coin before this script has compiled (LAUNCH MARK,
       above the scripts). Its words are a copy of the config; this says so in the log when a rename
       changed one side only. It never blocks the launch: a stale mark is a half-second of old words. */
    function checkLaunchMark() {
      const mark = document.querySelector("[data-launch-mark]");
      if (!mark) { console.warn("[LAUNCH] no launch mark in the page: the first paint is blank until the app has compiled"); return; }
      const shown = (name) => {
        const el = mark.querySelector('[data-launch="' + name + '"]');
        if (!el) return null;
        return name === "logo" ? el.getAttribute("src") : el.textContent.trim();
      };
      const expected = [["app-name", APP_NAME], ["brand", BRAND], ["tagline", HOME_TAGLINE], ["logo", ASSETS.logoMark]];
      const differ = expected.filter(([name, want]) => shown(name) !== want).map(([name]) => name);
      if (differ.length) console.warn("[LAUNCH] the launch mark in the HTML and the config differ on: " + differ.join(", ") + ". Change the mark to match.");
      else console.log("[LAUNCH] launch mark matches the config (v" + APP_VERSION + ")");
    }
    checkLaunchMark();

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
