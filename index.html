<!DOCTYPE html>
<!--
  BASE GUIDES - single-file mobile web app  (MilSpo Living)
  Stack: React 18 + Babel Standalone (CDN). No build step. Open or host the file.
  Architecture: the app ships with NO base content. Each base's guide is fetched
  ON DEMAND (data/bases/<slug>.json now; backend API later) and cached by the
  service worker. One app, all bases, light forever. (Anti-Touch-Stay design.)
  Live layer (AI Q&A + nearby places) is served by the backend via API_BASE.
  Long-form base stories come from the backend too (/api/bases/<slug>/story), the
  same stories milspoliving.com shows, read from the shared database.
  Account: a reader can sign in (a code by email) against the SAME Supabase
  project as milspoliving.com; saved bases are then the website's rows, so a base
  saved in either place shows in both (ACCOUNT and SAVED BASES sections below).
  Notes: all console/log output is plain ASCII (no emoji) by design.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Base Guides" />
  <meta name="theme-color" content="#121621" />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Base Guides</title>
  <meta property="og:title" content="Base Guides" />
  <meta property="og:description" content="Living guides to U.S. military bases - by MilSpo Living." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- Supabase Auth + the account's own rows (ACCOUNT section in the script below). Exact version
       pinned; sw.js caches this URL as an immutable asset. If it fails to load, accounts are off
       for that visit and nothing else in the app changes. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>

  <style>
    :root{
      --bg:#121621; --bg-2:#161c29; --surface:#1c2433; --surface-2:#243041;
      --line:#334053; --line-soft:#2b3647;
      --text:#eef2f8; --text-dim:#aab6c8; --text-faint:#6f7c90;
      --accent:#e7b24c; --accent-dim:#c5923a;
      --ok:#7faa6b; --danger:#d9604e;
      --shadow:0 8px 28px rgba(0,0,0,0.45);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
    body{
      font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
      overscroll-behavior-y:none;
    }
    /* Editorial long-form reads in Crimson Pro; UI stays DM Sans; headlines Fraunces. */
    .acc-body, .acc-body p, .ask-ans, .md, .basehero .tag, .hero .tag{ font-family:'Crimson Pro',Georgia,serif; }
    .acc-body{ font-size:15.5px; line-height:1.6; }
    .home-hero{ text-align:center; padding:4px 0 20px; }
    .home-logo{ width:128px; height:128px; }
    .home-tag{ font-family:'Crimson Pro',Georgia,serif; color:var(--text-dim); font-size:15px; margin-top:4px; }
    .home-controls{ margin-bottom:6px; }
    .home-search{ margin-bottom:9px; }
    .home-selects{ display:flex; gap:8px; margin-bottom:10px; }
    .home-selects select{ flex:1; min-width:0; }
    .state-header{ font-family:'Fraunces',serif; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin:18px 2px 8px; }
    .feedback{ margin:18px 0 4px; padding:14px; background:var(--bg-2); border:1px solid var(--line-soft); border-radius:11px; text-align:center; }
    .feedback-q{ display:block; font-size:13.5px; color:var(--text-dim); margin-bottom:7px; }
    .feedback-link{ display:inline-block; color:var(--accent); font-weight:600; font-size:14px; }
    .feedback-note{ font-size:11.5px; color:var(--text-faint); margin-top:7px; }
    input,textarea,select,button{font-family:inherit; font-size:16px;}
    button{cursor:pointer; border:none; background:none; color:inherit;}
    h1,h2,h3{font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0; line-height:1.18;}

    #app-shell{
      max-width:540px; margin:0 auto; min-height:100vh; background:var(--bg);
      position:relative; padding-bottom:calc(72px + env(safe-area-inset-bottom));
    }
    .topbar{
      position:sticky; top:0; z-index:30; background:var(--bg);
      padding:calc(14px + env(safe-area-inset-top)) 20px 10px;
      border-bottom:1px solid var(--line-soft);
    }
    .topbar h1{font-size:26px; letter-spacing:-0.02em;}
    .topbar .sub{font-size:12px; color:var(--text-faint); margin-top:2px; letter-spacing:0.08em; text-transform:uppercase;}
    .brandrow{display:flex; align-items:center; gap:12px;}
    .brandmark{width:48px; height:48px; flex:none; border-radius:50%;}
    .content{padding:14px 18px 24px;}

    .banner{
      margin:10px 18px 0; padding:10px 13px; border-radius:11px; font-size:13.5px;
      display:flex; align-items:center; gap:10px; border:1px solid var(--line);
      background:rgba(231,178,76,0.12); color:#f0d79a; border-color:rgba(231,178,76,0.4);
    }
    .banner button{margin-left:auto; font-size:12.5px; color:var(--accent); font-weight:600;}

    .card{
      background:var(--surface); border:1px solid var(--line-soft);
      border-radius:15px; padding:15px; margin-bottom:12px;
    }
    .card.tap{transition:transform 0.08s ease; cursor:pointer;}
    .card.tap:active{transform:scale(0.985);}
    .base-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:-0.01em;}
    .meta-line{font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; margin-top:3px;}
    .pill{display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); margin-left:8px; vertical-align:middle;}
    .pill.ready{background:rgba(127,170,107,0.14); border-color:rgba(127,170,107,0.4); color:#a9c98f;}
    .pill.soon{background:rgba(231,178,76,0.12); border-color:rgba(231,178,76,0.35); color:#e0c486;}
    .pill.oconus{background:rgba(111,159,201,0.16); border-color:rgba(111,159,201,0.4); color:#9cc0e0;}

    .back{font-size:14px; color:var(--accent); font-weight:500; display:inline-flex; gap:6px; align-items:center; margin-bottom:6px; cursor:pointer;}
    .hero{margin:2px 0 4px;}
    .hero .tag{color:var(--text-dim); font-size:14px; margin-top:6px;}
    .basehero{background:linear-gradient(160deg,var(--bg-2),var(--surface)); border:1px solid var(--line-soft); border-top:3px solid var(--accent-dim); border-radius:15px; padding:16px; margin-top:6px;}
    .basehero h1{font-size:24px; letter-spacing:-0.01em;}
    .basehero .tag{color:var(--text-dim); font-size:14px; margin-top:7px;}
    .basehero-meta{margin-top:10px; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-faint);}
    .localtime{margin-top:8px; font-size:12.5px; color:var(--text-dim);}
    .sec-ic{color:var(--accent-dim); display:inline-flex; align-items:center; flex:none;}

    /* ---- ask box ---- */
    .ask{ background:var(--surface); border:1px solid var(--line-soft); border-radius:13px; padding:13px; margin-top:12px; }
    .ask-title{ font-family:'Fraunces',serif; font-size:16px; margin-bottom:9px; }
    .ask-row{ display:flex; gap:8px; }
    .ask-inputwrap{ position:relative; flex:1; min-width:0; display:flex; }
    .ask-row input{ flex:1; min-width:0; background:var(--bg-2); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:9px 32px 9px 11px; }
    .ask-clear{ position:absolute; right:5px; top:50%; transform:translateY(-50%); background:transparent; border:0; color:var(--text-faint); font-size:20px; line-height:1; padding:0 5px; cursor:pointer; }
    .ask-clear:hover{ color:var(--text); }
    .ask-row > button{ flex:0 0 auto; background:var(--accent); color:#10131b; font-weight:600; border-radius:9px; padding:9px 16px; }
    .ask-row > button:disabled{ opacity:0.6; }
    .ask-thinking{ display:flex; align-items:center; gap:9px; }
    .spin-sm{ width:15px; height:15px; border-width:2px; }
    .ask-ans{ margin-top:10px; font-size:14px; color:var(--text); line-height:1.55; background:var(--bg-2); border:1px solid var(--line-soft); border-radius:9px; padding:11px; }
    .md > :first-child{ margin-top:0; } .md > :last-child{ margin-bottom:0; }
    .md p{ margin:0 0 9px; }
    .md-h{ font-family:'Fraunces',serif; font-size:15.5px; color:var(--text); margin:12px 0 6px; }
    .md-h3{ font-size:13.5px; font-weight:600; color:var(--text); margin:10px 0 5px; }
    .md-ul{ margin:6px 0 9px; padding-left:18px; } .md-ul li{ margin:3px 0; }
    .md-quote{ border-left:3px solid var(--accent-dim); background:rgba(231,178,76,0.07); padding:8px 11px; border-radius:0 8px 8px 0; margin:9px 0; color:var(--text-dim); }
    .md-hr{ border:none; border-top:1px solid var(--line-soft); margin:11px 0; }
    .md a{ color:var(--accent); }

    .acc{border:1px solid var(--line-soft); border-radius:13px; margin-bottom:11px; overflow:hidden; background:var(--surface);}
    .acc-head{display:flex; align-items:center; gap:10px; padding:14px 15px; cursor:pointer;}
    .acc-head h3{font-size:16px; flex:1;}
    .acc-chev{color:var(--text-faint); display:inline-flex; align-items:center; transition:transform 0.18s ease;}
    .card-go{color:var(--text-faint); flex:none; display:flex; align-items:center; margin-left:10px;}
    .between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
    .row{display:flex; align-items:center; gap:10px;}
    .muted{color:var(--text-dim);}
    .faint{color:var(--text-faint);}
    .tiny{font-size:12px;}
    .small{font-size:13.5px;}
    .acc.open .acc-chev{transform:rotate(180deg);}
    .acc-body{padding:0 15px 15px; font-size:14.5px; color:var(--text-dim);}
    .acc-body p{margin:0 0 10px;}

    dl.facts{margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 14px;}
    dl.facts dt{color:var(--text-faint); font-size:13px;}
    dl.facts dd{margin:0; color:var(--text); font-size:14px;}

    table.dec{width:100%; border-collapse:collapse; font-size:13px; margin-top:6px;}
    table.dec th, table.dec td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
    table.dec th{color:var(--text-faint); font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em;}
    table.dec td:first-child{color:var(--text);}

    .lst{list-style:none; margin:0; padding:0;}
    .lst li{padding:9px 0; border-top:1px solid var(--line-soft);}
    .lst li:first-child{border-top:none;}
    .lst .t{color:var(--text); font-weight:500; font-size:14px;}
    .lst .t .faint{font-weight:400;}
    .lst .d{color:var(--text-dim); font-size:13px; margin-top:2px;}

    .pending{font-size:13.5px; color:var(--text-faint); font-style:italic;}
    .place-detail{margin:8px 0 4px; padding:11px; background:var(--bg-2); border:1px solid var(--line-soft); border-radius:10px;}
    .place-photo{width:100%; height:150px; object-fit:cover; border-radius:8px; display:block; margin-bottom:9px;}
    .place-summary{font-family:'Crimson Pro',Georgia,serif; font-size:14px; color:var(--text-dim); margin-bottom:9px; line-height:1.5;}
    .place-hours{font-size:12px; color:var(--text-faint); margin-bottom:9px;}
    .place-hours div{line-height:1.55;}
    .place-links{display:flex; flex-wrap:wrap; gap:16px;}
    .place-links a{color:var(--accent); font-size:13px; font-weight:600;}
    .live-note{border:1px dashed var(--accent-dim); border-radius:11px; padding:11px 13px; font-size:13px; color:#e0c486; background:rgba(231,178,76,0.06);}
    /* Story section (the website's long-form story). */
    .story-h{font-family:'Fraunces',serif; font-size:17px; color:var(--text); margin:16px 0 6px;}
    .story-h:first-child{margin-top:2px;}
    .story-sh{font-weight:700; font-size:14px; color:var(--text); margin:12px 0 4px;}
    .story-quote{margin:12px 0; padding:4px 0 4px 12px; border-left:3px solid var(--accent-dim); font-family:'Crimson Pro',Georgia,serif; font-size:16.5px; color:var(--text); line-height:1.45;}
    .story-box{margin:12px 0; padding:11px 13px; background:var(--bg-2); border:1px solid var(--line-soft); border-radius:10px;}
    .story-label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent-dim); font-weight:700;}
    .story-title{font-weight:700; font-size:14px; color:var(--text); margin:3px 0 8px;}
    .story-box ul{margin:6px 0; padding-left:18px;}
    .story-box li{font-size:13.5px; line-height:1.5; margin-bottom:4px;}
    .story-small{font-size:12.5px; color:var(--text-faint); margin-top:8px;}
    table.dec tr.story-total td{color:var(--text); font-weight:700;}
    table.dec tr.story-has-how td{border-bottom:none; padding-bottom:2px;}
    table.dec tr.story-how td{padding-top:0; font-size:12px; color:var(--text-faint);}
    table.dec td.num, table.dec th.num{text-align:right; white-space:nowrap;}
    .story-disclaimer{font-size:12.5px; color:var(--text-faint); font-style:italic;}
    .story-missing{margin-bottom:12px;}
    .story-sources{margin-top:14px; padding-top:9px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--text-faint);}
    .story-sources ol{margin:4px 0 0; padding-left:18px;}
    .story-sources li{margin-bottom:3px; line-height:1.45;}
    .story-sources a{color:var(--accent-dim); word-break:break-word;}
    .srcline{margin-top:12px; padding-top:9px; border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--text-faint);}
    .srcline a{color:var(--accent-dim);}
    .screen-h{font-family:'Fraunces',serif; font-size:22px; margin:2px 2px 14px;}
    .fld{width:100%; background:var(--bg-2); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:10px 11px; font-size:15px;}
    .fld-l{display:block; font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px;}
    .card-actions{display:flex; align-items:center; gap:2px; flex:none;}
    .iconbtn{color:var(--text-faint); padding:6px; display:flex; align-items:center; border-radius:8px;}
    .task{display:flex; align-items:flex-start; gap:10px; padding:7px 0; font-size:14.5px; color:var(--text-dim); cursor:pointer;}
    .task input{margin-top:3px; width:17px; height:17px; accent-color:var(--accent); flex:none;}
    .task-done{text-decoration:line-through; color:var(--text-faint);}
    .btn-quiet{font-size:12.5px; color:var(--accent); display:inline-flex; align-items:center; gap:5px; font-weight:600;}
    .btn-gold{display:inline-block; background:var(--accent); color:#10131b; font-weight:600; padding:10px 16px; border-radius:10px; text-decoration:none; margin-top:10px;}
    .bridge{background:linear-gradient(160deg,rgba(231,178,76,0.13),var(--surface)); border:1px solid rgba(231,178,76,0.4); border-radius:14px; padding:15px; margin-bottom:14px;}
    .bridge-h{font-family:'Fraunces',serif; font-size:17px; margin-bottom:7px;}
    .bridge p{font-family:'Crimson Pro',Georgia,serif; color:var(--text-dim); font-size:15px; margin:0; line-height:1.55;}
    .wx{display:flex; align-items:center; gap:9px; margin:12px 0 2px;}
    .wx-temp{font-family:'Fraunces',serif; font-size:19px; color:var(--text);}
    .wx-cond{font-size:13.5px; color:var(--text-dim);}
    .wx-src{margin-left:auto; font-size:10.5px; letter-spacing:0.05em; color:var(--text-faint);}
    .wx-alert{margin:12px 0 0; padding:10px 12px; border-radius:10px; background:rgba(217,96,78,0.14); border:1px solid rgba(217,96,78,0.45); color:#eab0a6; font-size:13px;}
    .wx-alert-h{margin-top:3px; color:#e0b9b1; font-size:12.5px;}
    .bah-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
    .bah-sel{flex:0 0 88px; width:88px;}
    .seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; flex:1; min-width:200px;}
    .seg button{flex:1; padding:9px 6px; font-size:12.5px; color:var(--text-dim); background:var(--bg-2);}
    .seg button.on{background:var(--accent); color:#10131b; font-weight:600;}
    .bah-out{display:flex; align-items:baseline; gap:8px; margin:6px 0 8px;}
    .bah-amt{font-family:'Fraunces',serif; font-size:34px; color:var(--text); line-height:1;}
    .bah-mo{color:var(--text-faint); font-size:13px;}
    .bah-help{margin-top:8px; font-size:12px; line-height:1.5; color:var(--text-faint);}
    .picks-title{font-family:'Fraunces',serif; font-size:15px; color:var(--text); margin:2px 0 9px;}
    .picks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
    .pick-card{padding:10px 12px; background:var(--bg-2); border:1px solid var(--line-soft); border-left:3px solid var(--accent); border-radius:10px;}
    .pick-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
    .pick-name{font-weight:700; font-size:14px; color:var(--text);}
    .pick-cat{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
    .pick-blurb{font-family:'Crimson Pro',Georgia,serif; font-size:14px; color:var(--text-dim); margin-top:3px; line-height:1.45;}
    .pick-link{display:inline-block; margin-top:6px; color:var(--accent); font-size:12.5px; font-weight:600;}
    .picks-divider{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:14px 0 10px; border-top:1px solid var(--line-soft); padding-top:10px;}
    .rb-grid{display:flex; gap:10px; margin:10px 0 4px; flex-wrap:wrap;}
    .rb-card{flex:1 1 180px; min-width:0; background:var(--bg-2); border:1px solid var(--line-soft); border-radius:10px; padding:11px 13px;}
    .rb-h{font-weight:700; font-size:13px; color:var(--text); margin-bottom:7px;}
    .rb-list{margin:0; padding-left:18px;}
    .rb-list li{font-size:13.5px; color:var(--text-dim); line-height:1.5; margin-bottom:4px;}
    .rb-bottom{margin-top:10px; font-size:14px; color:var(--text); line-height:1.5;}
    .pcs-steps{margin:8px 0 0; padding-left:22px;}
    .pcs-steps li{margin-bottom:11px;}
    .pcs-t{font-weight:700; font-size:14px; color:var(--text);}
    .pcs-d{font-size:13.5px; color:var(--text-dim); line-height:1.5; margin-top:2px;}
    .faq-item{padding:10px 0; border-bottom:1px solid var(--line-soft);}
    .faq-item:last-child{border-bottom:0;}
    .faq-q{font-weight:700; font-size:14px; color:var(--text); margin-bottom:4px;}
    .faq-a{font-size:14px; color:var(--text-dim); line-height:1.55;}
    .chips{display:flex; flex-wrap:wrap; gap:7px;}
    .chip{background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); font-size:12.5px; padding:5px 11px; border-radius:999px;}
    .chip.pick{cursor:pointer;}
    .chip-on{background:var(--accent); color:#10131b; border-color:var(--accent); font-weight:600;}
    .re-grid{display:flex; gap:10px;}
    .re-cell{flex:1; background:var(--bg-2); border:1px solid var(--line-soft); border-radius:11px; padding:12px;}
    .re-num{font-family:'Fraunces',serif; font-size:22px; color:var(--text); line-height:1.1;}
    .re-lab{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; margin-top:3px;}
    .leaflet-wrap{height:58vh; border-radius:13px; overflow:hidden; border:1px solid var(--line-soft);}
    .leaflet-wrap .leaflet-popup-content{font-family:'DM Sans',sans-serif; font-size:13px;}

    /* ---- account (sign in / account screen) ---- */
    .topbar-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
    .acct-entry{display:inline-flex; align-items:center; gap:6px; color:var(--accent); font-size:13px; font-weight:600; padding:6px 0 6px 8px; max-width:48%; flex:none; margin-top:4px;}
    .acct-entry span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .acct-entry.on{color:var(--text);}
    .acct-p{font-family:'Crimson Pro',Georgia,serif; color:var(--text-dim); font-size:15.5px; line-height:1.55; margin:0 0 12px;}
    .acct-p.small{font-size:14px;}
    .acct-p a{color:var(--accent);}
    .acct-code{letter-spacing:0.3em; font-size:22px; font-family:'Fraunces',serif; text-align:center;}
    .acct-msg{margin-top:10px; font-size:13.5px; color:#eab0a6;}
    .acct-msg.ok{color:#a9c98f;}
    .acct-h{font-family:'Fraunces',serif; font-size:17px; margin:22px 0 8px;}
    .acct-actions{display:flex; gap:12px 18px; flex-wrap:wrap; align-items:center; margin-top:8px;}
    .btn-danger{display:inline-block; background:transparent; border:1px solid var(--danger); color:#eab0a6; font-weight:600; padding:10px 16px; border-radius:10px; margin-top:10px;}
    .btn-plain{display:inline-block; border:1px solid var(--line); color:var(--text-dim); font-weight:600; padding:10px 16px; border-radius:10px; margin-top:10px;}
    .acct-list li{display:flex; align-items:center; justify-content:space-between; gap:10px;}
    .acct-list .rm{color:var(--accent); font-size:13px; font-weight:600; padding:6px 0 6px 10px; flex:none;}
    .acct-sheet{border-color:rgba(217,96,78,0.45);}
    .acct-name{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
    .acct-name .fld{flex:1 1 140px; width:auto;}
    .acct-name-form{margin:2px 0 4px;}

    .nav{
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:540px; display:flex; background:var(--bg-2);
      border-top:1px solid var(--line); z-index:40;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .nav button{flex:1; padding:11px 0 9px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:11px; letter-spacing:0.03em;}
    .nav button.on{color:var(--accent);}
    .nav .ic{display:flex; align-items:center; justify-content:center; height:21px;}

    .center{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 20px; text-align:center; color:var(--text-faint);}
    .spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.log("[bg] sw register failed:", e && e.message);
        });
      });
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef, useSyncExternalStore } = React;

    /* ---------------- CONFIG (single source of brand/version) ----------------
       Renaming the app is a one-line change here. Bundle ID lives in the native
       config and is independent of this display name. */
    const APP_NAME = "Base Guides";
    const BRAND = "MilSpo Living";
    // Brand artwork behind named files so a rebrand is a drop-in swap (see CLAUDE.md
    // "Rebranding"): replace these + the icon-*/apple-touch/favicon PNGs + CSS :root.
    const ASSETS = { logoMark: "logo-mark.png" };
    const CONTACT_EMAIL = "support@milspoliving.com"; // realtor-intro inbox (Porkbun forwarding)
    const APP_VERSION = "0.22.0";
    // Deployed backend (Railway). Content + live layer both come from here.
    // Empty string would fall back to local static data/ files for content.
    const API_BASE_DEFAULT = "https://web-production-43053.up.railway.app";
    const USING_API = !!API_BASE_DEFAULT;
    const DATA_BASE = USING_API ? API_BASE_DEFAULT.replace(/\/$/, "") + "/api/bases" : "data/bases";
    // Backend for the LIVE layer (AI Q&A + nearby places).
    const API_BASE = API_BASE_DEFAULT || "http://localhost:8000";

    // ACCOUNTS: the Supabase project milspoliving.com uses ("base-guides"), so the app and the
    // website are the same account (Chris, decision card 2026-11-24 "Yes, account then look").
    // THE SWITCH: accounts are ON when the publishable key is set and OFF when it is "". Off means
    // no "Sign in" anywhere and saved bases on the device exactly as before accounts. There is no
    // second switch on purpose: a second setting could disagree with the key.
    // WHY a key may ship in the client: this is Supabase's PUBLISHABLE key, made for browsers.
    // It gives no access on its own; every table it can see (profiles, saved_bases) is closed by
    // row level security to the signed-in user's own rows (website repo,
    // supabase/migrations/20261123210000_accounts_slice_1.sql). The backend's "keys never reach the
    // client" rule is about SECRET keys and still holds. ROAD NOT TAKEN: proxying auth through the
    // Railway backend - a hop and a session store for no security gain.
    const SUPABASE_URL = "https://jmnhviumgulbcdlzuawa.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ds2HorZMHqHMsI1CrGANhg_0sbTixvB";
    const ACCOUNTS_ON = !!SUPABASE_PUBLISHABLE_KEY;

    function indexUrl() { return USING_API ? DATA_BASE : DATA_BASE + "/index.json"; }
    function baseUrl(slug) { return USING_API ? DATA_BASE + "/" + slug : DATA_BASE + "/" + slug + ".json"; }
    // Stories live only in the shared database (served by the backend), so file mode has none: null.
    function storyUrl(slug) { return USING_API ? DATA_BASE + "/" + slug + "/story" : null; }
    function apiUrl(path) { return API_BASE.replace(/\/$/, "") + path; }

    async function fetchJSON(url) {
      const r = await fetch(url, { cache: "no-cache" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }

    // Browser storage for what stays on the phone: the PCS plan, its ticks and the device's saved
    // bases (see SAVED BASES). RULE (Chris, 2026-11-24): a pay grade stays on the device, never in
    // the account (the website keeps it in browser storage as msl.rank; the app stores none yet).
    const LS = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
    };

    // Inline SVG icons (replace placeholder text glyphs - crisp at any size).
    function Icon({ name, size = 20 }) {
      const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
      switch (name) {
        case "home": return <svg {...p}><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></svg>;
        case "guide": return <svg {...p}><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5z" /><path d="M9 3v18" /></svg>;
        case "map": return <svg {...p}><path d="M12 21s-6.5-5.7-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.3 12 21 12 21z" /><circle cx="12" cy="10.5" r="2.3" /></svg>;
        case "search": return <svg {...p}><circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" /></svg>;
        case "chevron": return <svg {...p}><path d="m6 9 6 6 6-6" /></svg>;
        case "cardchev": return <svg {...p}><path d="m9 6 6 6-6 6" /></svg>;
        case "back": return <svg {...p}><path d="m15 6-6 6 6 6" /></svg>;
        case "info": return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 8h.01" /></svg>;
        case "flag": return <svg {...p}><path d="M5 21V4" /><path d="M5 4h12l-2 4 2 4H5" /></svg>;
        case "compass": return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="m15.5 8.5-2 5.5-5 1.5 2-5.5z" /></svg>;
        case "shield": return <svg {...p}><path d="M12 3l7 3v5c0 4.5-3 7.4-7 9-4-1.6-7-4.5-7-9V6z" /></svg>;
        case "cap": return <svg {...p}><path d="M2 9l10-4 10 4-10 4z" /><path d="M6 11v4c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-4" /></svg>;
        case "health": return <svg {...p}><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z" /></svg>;
        case "cart": return <svg {...p}><circle cx="9.5" cy="20" r="1.3" /><circle cx="17" cy="20" r="1.3" /><path d="M3 4h2l2.4 11h10l1.8-7H6.2" /></svg>;
        case "calendar": return <svg {...p}><rect x="3" y="4.5" width="18" height="16.5" rx="2" /><path d="M3 9.5h18" /><path d="M8 2.5v4" /><path d="M16 2.5v4" /></svg>;
        case "bookmark": return <svg {...p}><path d="M6 3h12v18l-6-4-6 4z" /></svg>;
        case "bookmarkOn": return <svg {...p}><path d="M6 3h12v18l-6-4-6 4z" fill="currentColor" /></svg>;
        case "download": return <svg {...p}><path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M5 20h14" /></svg>;
        case "dollar": return <svg {...p}><path d="M12 2.5v19" /><path d="M16.5 6.6C16.5 4.9 14.5 3.8 12 3.8S7.5 4.9 7.5 6.9 9.5 9.4 12 10s4.5 1.5 4.5 3.5-2 3-4.5 3-4.5-1-4.5-2.7" /></svg>;
        case "person": return <svg {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg>;
        default: return null;
      }
    }

    // Per-branch accent color (scannable list + base-page header).
    const BRANCH_COLORS = { army: "#7d8b4e", "air force": "#4a90c2", navy: "#3f7cb0", marine: "#b23a3a", "coast guard": "#e07b39", "space force": "#8d9bb0", joint: "#9b7bc0" };
    function branchColor(b) {
      if (!b) return "var(--accent-dim)";
      const s = b.toLowerCase();
      if (s.indexOf("/") !== -1) return BRANCH_COLORS.joint;
      for (const k of Object.keys(BRANCH_COLORS)) if (s.indexOf(k) !== -1) return BRANCH_COLORS[k];
      return "var(--accent-dim)";
    }
    const SECTION_ICONS = { quick_facts: "info", mission: "flag", two_state_decision: "compass", gates: "shield", housing: "home", bah: "dollar", housing_costs: "dollar", rent_buy: "dollar", pcs_first_30: "calendar", faq: "info", where_to_live: "home", schools: "cap", schools_live: "cap", healthcare: "health", shopping: "cart", nearby: "map" };
    function sectionIcon(id) { return SECTION_ICONS[id] || "info"; }

    /* ---------------- PWA self-update (ported from MenuCaptain) ---------------- */
    function useUpdateCheck() {
      const [newer, setNewer] = useState(null);
      useEffect(() => {
        (async () => {
          try {
            const u = location.pathname + "?vcheck=" + Date.now();
            const r = await fetch(u, { cache: "no-store" });
            const txt = await r.text();
            const m = txt.match(/APP_VERSION\s*=\s*"([0-9.]+)"/);
            if (m && m[1] && m[1] !== APP_VERSION) setNewer(m[1]);
          } catch (e) { /* offline - ignore */ }
        })();
      }, []);
      return newer;
    }
    function UpdateBanner() {
      const newer = useUpdateCheck();
      if (!newer) return null;
      const reload = () => {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage("clearCache");
        }
        setTimeout(() => location.reload(), 150);
      };
      return (
        <div className="banner">
          <span>Update available (v{newer}).</span>
          <button onClick={reload}>Refresh</button>
        </div>
      );
    }

    /* ---------------- Section renderer (schema-driven, generic) ---------------- */
    function Facts({ data }) {
      return (
        <dl className="facts">
          {Object.keys(data).map((k) => (
            <React.Fragment key={k}><dt>{k}</dt><dd>{data[k]}</dd></React.Fragment>
          ))}
        </dl>
      );
    }
    function Prose({ data }) {
      const arr = Array.isArray(data) ? data : [data];
      return <div>{arr.map((p, i) => <p key={i}>{p}</p>)}</div>;
    }
    function DecisionTable({ table }) {
      return (
        <table className="dec">
          <thead><tr>{table.cols.map((c, i) => <th key={i}>{c}</th>)}</tr></thead>
          <tbody>
            {table.rows.map((row, i) => (
              <tr key={i}>{row.map((cell, j) => <td key={j}>{cell}</td>)}</tr>
            ))}
          </tbody>
        </table>
      );
    }
    function Killer({ data }) {
      return (
        <div>
          {data.subtitle ? <p style={{ color: "var(--accent)", fontWeight: 500 }}>{data.subtitle}</p> : null}
          <Prose data={data.intro} />
          {data.table ? <DecisionTable table={data.table} /> : null}
          {data.recommendations ? (
            <ul className="lst" style={{ marginTop: 12 }}>
              {data.recommendations.map((r, i) => (
                <li key={i}><div className="t">{r.who}</div><div className="d">{r.advice}</div></li>
              ))}
            </ul>
          ) : null}
        </div>
      );
    }
    function ItemList({ data }) {
      return (
        <ul className="lst">
          {data.map((it, i) => (
            <li key={i}><div className="t">{it.name}</div>{it.detail ? <div className="d">{it.detail}</div> : null}</li>
          ))}
        </ul>
      );
    }
    // Rent vs buy decision aid (two "makes sense if" columns + a bottom line).
    function RentBuy({ data }) {
      return (
        <div>
          {data.intro ? <Prose data={data.intro} /> : null}
          <div className="rb-grid">
            {data.rent ? (
              <div className="rb-card">
                <div className="rb-h">Renting makes sense if&hellip;</div>
                <ul className="rb-list">{data.rent.map((x, i) => <li key={i}>{x}</li>)}</ul>
              </div>
            ) : null}
            {data.buy ? (
              <div className="rb-card">
                <div className="rb-h">Buying makes sense if&hellip;</div>
                <ul className="rb-list">{data.buy.map((x, i) => <li key={i}>{x}</li>)}</ul>
              </div>
            ) : null}
          </div>
          {data.bottom_line ? <p className="rb-bottom"><strong>Bottom line:</strong> {data.bottom_line}</p> : null}
        </div>
      );
    }
    // PCS first-30-days checklist (numbered steps).
    function PCSFirst30({ data }) {
      const steps = data.steps || [];
      return (
        <div>
          {data.intro ? <Prose data={data.intro} /> : null}
          <ol className="pcs-steps">
            {steps.map((s, i) => (
              <li key={i}><div className="pcs-t">{s.title}</div>{s.text ? <div className="pcs-d">{s.text}</div> : null}</li>
            ))}
          </ol>
        </div>
      );
    }
    // Per-base FAQ (question + answer pairs).
    function FAQ({ data }) {
      const items = Array.isArray(data) ? data : [];
      return (
        <div className="faq">
          {items.map((it, i) => (
            <div className="faq-item" key={i}>
              <div className="faq-q">{it.q}</div>
              <div className="faq-a">{it.a}</div>
            </div>
          ))}
        </div>
      );
    }

    // Live nearby places (Google Places via the backend). Uses the base's coords.
    const PRICE = {
      PRICE_LEVEL_INEXPENSIVE: "$", PRICE_LEVEL_MODERATE: "$$",
      PRICE_LEVEL_EXPENSIVE: "$$$", PRICE_LEVEL_VERY_EXPENSIVE: "$$$$",
    };
    const PLACE_CATS = [
      { key: "restaurant", label: "Food" }, { key: "cafe", label: "Coffee" },
      { key: "supermarket", label: "Groceries" }, { key: "gas_station", label: "Gas" },
      { key: "pharmacy", label: "Pharmacy" }, { key: "hospital", label: "Hospitals" },
    ];
    // A nearby place: tap to expand rich details (photo/hours/phone/website), fetched on demand.
    function PlaceRow({ p }) {
      const [open, setOpen] = useState(false);
      const [d, setD] = useState(null);
      const [photo, setPhoto] = useState(null);
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState(false);
      const toggle = () => {
        if (!p.place_id) return;
        const n = !open; setOpen(n);
        if (n && !d && !loading) {
          setLoading(true); setErr(false);
          fetchJSON(apiUrl("/api/places/details?place_id=" + encodeURIComponent(p.place_id)))
            .then((det) => {
              setD(det); setLoading(false);
              if (det.photos && det.photos[0]) {
                fetchJSON(apiUrl("/api/places/photo?name=" + encodeURIComponent(det.photos[0]) + "&w=640"))
                  .then((ph) => setPhoto(ph.photoUri)).catch(() => {});
              }
            })
            .catch(() => { setLoading(false); setErr(true); });
        }
      };
      return (
        <li>
          <div className="place-head" onClick={toggle} style={{ cursor: p.place_id ? "pointer" : "default" }}>
            <div className="t">{p.name} {p.price_level ? <span className="faint">{PRICE[p.price_level] || ""}</span> : null}</div>
            <div className="d">
              {p.rating ? ("* " + p.rating + " (" + (p.user_ratings_total || 0) + ")") : "no rating"}
              {p.open_now === true ? " - open now" : (p.open_now === false ? " - closed" : "")}
              {p.vicinity ? " - " + p.vicinity : ""}
            </div>
          </div>
          {open ? (
            <div className="place-detail">
              {loading ? <div className="center" style={{ padding: 8 }}><div className="spin" /></div> :
                (err || !d) ? <div className="pending">Details unavailable.</div> : (
                  <div>
                    {photo ? <img className="place-photo" src={photo} alt={d.name || ""} /> : null}
                    {d.summary ? <div className="place-summary">{d.summary}</div> : null}
                    {d.hours && d.hours.length ? <div className="place-hours">{d.hours.map((h, i) => <div key={i}>{h}</div>)}</div> : null}
                    <div className="place-links">
                      {d.phone ? <a href={"tel:" + d.phone}>{d.phone}</a> : null}
                      {d.website ? <a href={d.website} target="_blank" rel="noopener noreferrer">Website</a> : null}
                      {d.maps_url ? <a href={d.maps_url} target="_blank" rel="noopener noreferrer">Directions</a> : null}
                    </div>
                  </div>
                )}
            </div>
          ) : null}
        </li>
      );
    }

    function LivePlaces({ coords, note, picks }) {
      const [items, setItems] = useState(null);
      const [err, setErr] = useState(null);
      const [device, setDevice] = useState(null);
      const [geoBusy, setGeoBusy] = useState(false);
      const [cat, setCat] = useState("restaurant");
      const active = device || coords;
      const alat = active && active.lat, alng = active && active.lng;
      useEffect(() => {
        if (alat == null) { setErr("no-coords"); return; }
        let live = true; setItems(null); setErr(null);
        const u = apiUrl("/api/places/nearby?lat=" + alat + "&lng=" + alng + "&type=" + cat + "&radius=5000");
        fetchJSON(u)
          .then((d) => { if (live) setItems(d.results || []); })
          .catch((e) => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, [alat, alng, cat]);
      const useMyLocation = () => {
        if (!navigator.geolocation) return;
        setGeoBusy(true);
        navigator.geolocation.getCurrentPosition(
          (pos) => { setGeoBusy(false); setDevice({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
          () => { setGeoBusy(false); },
          { timeout: 10000, maximumAge: 300000 }
        );
      };
      const picksBlock = (picks && picks.length) ? (
        <div className="picks-wrap">
          <div className="picks-title">Our picks</div>
          <ul className="picks">
            {picks.map((p, i) => (
              <li key={i} className="pick-card">
                <div className="pick-top">
                  <span className="pick-name">{p.name}</span>
                  {p.category ? <span className="pick-cat">{p.category}</span> : null}
                </div>
                {p.blurb ? <div className="pick-blurb">{p.blurb}</div> : null}
                {p.maps_query ? <a className="pick-link" href={"https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.maps_query)} target="_blank" rel="noopener noreferrer">Open in Maps</a> : null}
              </li>
            ))}
          </ul>
        </div>
      ) : null;
      return (
        <div>
          {picksBlock}
          {picksBlock ? <div className="picks-divider">Live nearby</div> : null}
          {err ? (
            <div className="live-note">
              {note || "Live nearby places appear here."}
              <br /><span className="faint tiny">(Can't reach the backend right now. Try again in a moment for live results.)</span>
            </div>
          ) : (
            <div>
              <div className="chips" style={{ marginBottom: 10 }}>
                {PLACE_CATS.map((ct) => (
                  <button key={ct.key} className={"chip pick" + (cat === ct.key ? " chip-on" : "")} onClick={() => setCat(ct.key)}>{ct.label}</button>
                ))}
              </div>
              <div className="between" style={{ marginBottom: 8 }}>
                <span className="faint tiny">{device ? "Live - near you" : "Live from Google Places - near the base"}</span>
                <button className="btn-quiet" onClick={useMyLocation} disabled={geoBusy}>{geoBusy ? "Locating..." : (device ? "Update location" : "Use my location")}</button>
              </div>
              {!items ? <div className="center" style={{ padding: "18px" }}><div className="spin" /></div> : (
                !items.length ? <div className="pending">No places found nearby.</div> : (
                  <ul className="lst">
                    {items.slice(0, 10).map((p, i) => <PlaceRow key={p.place_id || i} p={p} />)}
                  </ul>
                )
              )}
            </div>
          )}
        </div>
      );
    }

    // Live weather + active alerts (National Weather Service, via the backend).
    function LiveWeather({ coords }) {
      const [w, setW] = useState(null);
      useEffect(() => {
        if (!coords || coords.lat == null) return;
        let live = true;
        fetchJSON(apiUrl("/api/weather?lat=" + coords.lat + "&lng=" + coords.lng))
          .then((d) => { if (live) setW(d); })
          .catch(() => { if (live) setW(null); });
        return () => { live = false; };
      }, [coords]);
      if (!w) return null;
      const c = w.current; const alerts = w.alerts || [];
      if (!c && !alerts.length) return null;
      const extra = [];
      if (w.high != null) extra.push("H " + w.high + "°");
      if (w.low != null) extra.push("L " + w.low + "°");
      if (w.precip != null) extra.push(w.precip + "% precip");
      return (
        <div>
          {alerts.map((a, i) => (
            <div key={i} className="wx-alert"><strong>Weather alert: {a.event}</strong>{a.headline ? <div className="wx-alert-h">{a.headline}</div> : null}</div>
          ))}
          {c ? <div className="wx"><span className="wx-temp">{c.temp}°{c.unit}</span><span className="wx-cond">{c.short}{extra.length ? " · " + extra.join(" · ") : ""}</span><span className="wx-src">NWS</span></div> : null}
        </div>
      );
    }

    // BAH calculator - rates come from the single source of truth (/api/bah, backed
    // by the bah_rates table). Falls back to inline data.rates if the table is unreachable.
    const BAH_FALLBACK_URL = "https://www.travel.dod.mil/Allowances/Basic-Allowance-for-Housing/BAH-Rate-Lookup/";
    function BAHCalc({ data }) {
      const [table, setTable] = useState(data.rates ? data : null);
      const [state, setState] = useState(data.rates ? "ok" : (data.mha ? "loading" : "err"));
      const [grade, setGrade] = useState("");
      const [deps, setDeps] = useState(true);
      useEffect(() => {
        if (data.rates || !data.mha) return;
        let live = true; setState("loading");
        fetchJSON(apiUrl("/api/bah?mha=" + encodeURIComponent(data.mha) + "&year=" + (data.year || 2026)))
          .then((d) => { if (live) { setTable(d); setState("ok"); } })
          .catch(() => { if (live) setState("err"); });
        return () => { live = false; };
      }, [data.mha, data.year]);
      useEffect(() => {
        const gs = table ? Object.keys(table.rates || {}) : [];
        if (gs.length && !gs.includes(grade)) setGrade(gs[0]);
      }, [table]);
      const calc = (table && table.calc_url) || data.calc_url || BAH_FALLBACK_URL;
      if (state === "loading") return <div className="center" style={{ padding: "18px" }}><div className="spin" /></div>;
      if (state === "err" || !table) return (
        <div className="pending">BAH rates aren't available right now. <a className="srclink" href={calc} target="_blank" rel="noopener noreferrer">Check the official DoD calculator.</a></div>
      );
      const grades = Object.keys(table.rates || {});
      const r = table.rates[grade] ? table.rates[grade][deps ? "w" : "wo"] : null;
      return (
        <div>
          <div className="bah-row">
            <select className="fld bah-sel" value={grade} onChange={(e) => setGrade(e.target.value)}>
              {grades.map((g) => <option key={g} value={g}>{g}</option>)}
            </select>
            <div className="seg">
              <button className={deps ? "on" : ""} onClick={() => setDeps(true)}>With dependents</button>
              <button className={!deps ? "on" : ""} onClick={() => setDeps(false)}>Without</button>
            </div>
          </div>
          <div className="bah-out">
            <span className="bah-amt">{r != null ? "$" + r.toLocaleString() : "-"}</span>
            <span className="bah-mo">/ month, tax-free</span>
          </div>
          <div className="muted tiny">{grade}{deps ? ", with dependents" : ", without dependents"} &middot; MHA {table.mha} &middot; CY{table.year}</div>
          <div className="bah-help">"With dependents" is the rate for a service member with a spouse or family; "without" is the single rate. The amount is set by your pay grade and the base's ZIP code, not by how many dependents you have.</div>
          <a className="btn-quiet" style={{ marginTop: 12, display: "inline-flex" }} href={calc} target="_blank" rel="noopener noreferrer">Other ranks or verify on the official DoD calculator</a>
        </div>
      );
    }

    // Real-estate (RentCast) - graceful "connect key" state via 503 until key is set.
    function RealEstate({ data }) {
      const [r, setR] = useState(null);
      const [state, setState] = useState("loading");

          const d = await res.json(); setR(d); setState("ok");
        }).catch(() => { if (live) setState("err"); });
        return () => { live = false; };
      }, [data && data.zip]);
      if (state === "nokey") return <div className="live-note">Live rent &amp; home-price estimates appear here once the RentCast key is connected.</div>;

            <div className="re-cell"><div className="re-num">{r.median_rent != null ? "$" + r.median_rent.toLocaleString() : "-"}</div><div className="re-lab">Median rent / mo</div></div>

    // Nearby schools + ratings (SchoolDigger) - graceful "connect key" state.

    /* ---------------- STORY (the website's long-form story, from the shared database) ----------------
       RULE (Chris, decision card 2026-11-22): the app shows the same story as milspoliving.com.
       The story files in the website repo are the source; the backend serves the copy in the
       guide_stories table with its figures already filled by the database function the website
       uses. So this code only draws what it is given. The one number it works out is the worked-
       example total: each stored row is ONE year of dollars, times the years, then added up - the
       website's rule (src/lib/guide-math.ts), so a typed total can never disagree with its rows.
       ACCURACY: a figure the database could not fill arrives as "[figure missing]" and the backend
       counts them (missing_figures); the story then shows a notice instead of passing it silently.
       A block with the wrong shape is skipped, not guessed (the website's parseBlock rule). */
    const STORY_SECTION_ID = "where_to_live";
    const STORY_SECTION_TITLE = "Where to live"; // the website's name for the story part of a guide

    /* WHERE THE STORY GOES: right after the decision section (type "killer"), which is where the
       website shows it - inside the decision part, or as its own part just after it when the story
       has a section title. Without a decision section it goes second. */
    function withStorySection(sections, story) {
      if (!story || !Array.isArray(story.blocks) || story.blocks.length === 0) return sections;
      const storySection = { id: STORY_SECTION_ID, type: "story", title: story.section_title || STORY_SECTION_TITLE, data: story };
      const decisionAt = sections.findIndex((s) => s.type === "killer");
      const at = decisionAt >= 0 ? decisionAt + 1 : Math.min(1, sections.length);
      return [...sections.slice(0, at), storySection, ...sections.slice(at)];
    }

    const storyText = (v) => (typeof v === "string" ? v.trim() : "");
    const storyTextList = (v) => (Array.isArray(v) ? v.map(storyText).filter(Boolean) : []);
    const storyDollars = (v) => (typeof v === "number" && isFinite(v) && v >= 0 ? Math.round(v) : null);
    const formatDollars = (n) => "$" + n.toLocaleString("en-US");

    // One block in the shape the renderer can draw, or null (the same checks as the website).
    function storyBlockShape(raw) {
      if (!raw || typeof raw !== "object") return null;
      const t = storyText(raw.t);
      if (["head", "subhead", "p", "pullquote", "disclaimer"].includes(t)) {
        const text = storyText(raw.text);
        return text ? { t, text } : null;
      }
      if (t === "math") {
        const sides = storyTextList(raw.sides);
        const years = storyDollars(raw.years);
        const rows = (Array.isArray(raw.rows) ? raw.rows : []).map((r) => {
          const a = storyDollars(r && r.a), b = storyDollars(r && r.b), label = storyText(r && r.label);
          return a === null || b === null || !label ? null : { label, a, b, how: storyText(r.how) };
        }).filter(Boolean);
        if (sides.length !== 2 || !years || rows.length === 0) return null;
        return { t, label: storyText(raw.label) || "By the numbers", title: storyText(raw.title), sides, years, rows,
                 assumptions: storyTextList(raw.assumptions), note: storyText(raw.note) };
      }
      if (t === "sidebar") {
        const paragraphs = storyTextList(raw.paragraphs);
        const scenarios = (Array.isArray(raw.scenarios) ? raw.scenarios : [])
          .map((x) => ({ tag: storyText(x && x.tag), text: storyText(x && x.text) })).filter((x) => x.text);
        if (paragraphs.length === 0 && scenarios.length === 0) return null;
        return { t, label: storyText(raw.label), title: storyText(raw.title), paragraphs, scenarios, foot: storyText(raw.foot) };
      }
      if (t === "places") {
        const items = (Array.isArray(raw.items) ? raw.items : [])
          .map((x) => ({ name: storyText(x && x.name), stat: storyText(x && x.stat), text: storyText(x && x.text) }))
          .filter((x) => x.name && x.text);
        return items.length ? { t, items } : null;
      }
      return null;
    }

    function StoryMath({ b }) {
      const rows = b.rows.map((r) => ({ ...r, a: r.a * b.years, b: r.b * b.years }));
      const totalA = rows.reduce((sum, r) => sum + r.a, 0);
      const totalB = rows.reduce((sum, r) => sum + r.b, 0);
      const span = b.years === 1 ? "one year" : b.years + " years";
      return (
        <div className="story-box">
          <div className="story-label">{b.label}, cost over {span}</div>
          {b.title ? <div className="story-title">{b.title}</div> : null}
          <table className="dec">
            <thead><tr><th>Cost</th><th className="num">{b.sides[0]}</th><th className="num">{b.sides[1]}</th></tr></thead>
            <tbody>
              {rows.map((r, i) => (
                <React.Fragment key={i}>
                  <tr className={r.how ? "story-has-how" : null}>
                    <td>{r.label}</td><td className="num">{formatDollars(r.a)}</td><td className="num">{formatDollars(r.b)}</td>
                  </tr>
                  {/* The working of a row spans the table so the figures keep their width on a phone. */}
                  {r.how ? <tr className="story-how"><td colSpan={3}>A year: {r.how}</td></tr> : null}
                </React.Fragment>
              ))}
              <tr className="story-total"><td>Total over {span}</td><td className="num">{formatDollars(totalA)}</td><td className="num">{formatDollars(totalB)}</td></tr>
            </tbody>
          </table>
          {b.assumptions.length ? (
            <div className="story-small">What the example assumes:<ul>{b.assumptions.map((x, i) => <li key={i}>{x}</li>)}</ul></div>
          ) : null}
          {b.note ? <p style={{ marginTop: 8 }}>{b.note}</p> : null}
        </div>
      );
    }

    function StoryBlock({ b }) {
      switch (b.t) {
        case "head": return <h4 className="story-h">{b.text}</h4>;
        case "subhead": return <div className="story-sh">{b.text}</div>;
        case "p": return <p>{b.text}</p>;
        case "pullquote": return <blockquote className="story-quote">{b.text}</blockquote>;
        case "disclaimer": return <p className="story-disclaimer">{b.text}</p>;
        case "math": return <StoryMath b={b} />;
        case "sidebar":
          return (
            <div className="story-box">
              {b.label ? <div className="story-label">{b.label}</div> : null}
              {b.title ? <div className="story-title">{b.title}</div> : null}
              {b.paragraphs.map((x, i) => <p key={i}>{x}</p>)}
              {b.scenarios.length ? (
                <ul>{b.scenarios.map((x, i) => <li key={i}>{x.tag ? <strong>{x.tag}: </strong> : null}{x.text}</li>)}</ul>
              ) : null}
              {b.foot ? <div className="story-small">{b.foot}</div> : null}
            </div>
          );
        case "places":
          return (
            <ul className="lst" style={{ margin: "8px 0 12px" }}>
              {b.items.map((x, i) => (
                <li key={i}><div className="t">{x.name}{x.stat ? <span className="faint"> &middot; {x.stat}</span> : null}</div><div className="d">{x.text}</div></li>
              ))}
            </ul>
          );
        default: return null;
      }
    }

    function StoryBody({ data }) {
      const blocks = (data.blocks || []).map(storyBlockShape).filter(Boolean);
      // Only labelled http(s) links, the website's rule (the backend applies it too).
      const sources = (data.sources || []).filter((x) => x && x.label && /^https?:\/\//i.test(x.url || ""));
      return (
        <div>
          {data.missing_figures > 0 ? (
            <div className="live-note story-missing">Some figures in this story could not be loaded right now and show as "[figure missing]". Check the sources below.</div>
          ) : null}
          {blocks.map((b, i) => <StoryBlock key={i} b={b} />)}
          {sources.length ? (
            <div className="story-sources">
              Sources
              <ol>
                {sources.map((x, i) => (
                  <li key={i}><a href={x.url} target="_blank" rel="noopener noreferrer">{x.label}</a>{x.checked ? <span> &middot; checked {x.checked}</span> : null}</li>
                ))}
              </ol>
            </div>
          ) : null}
        </div>
      );
    }

    function SectionBody({ s, coords }) {
      switch (s.type) {
        case "facts": return <Facts data={s.data} />;
        case "prose": return <Prose data={s.data} />;
        case "killer": return <Killer data={s.data} />;
        case "list": return <ItemList data={s.data} />;
        case "places_live": return <LivePlaces coords={coords} note={s.note} picks={s.picks} />;
        case "bah": return <BAHCalc data={s.data} />;
        case "realestate": return <RealEstate data={s.data} />;
        case "schools_live": return <SchoolsLive data={s.data} />;
        case "rentbuy": return <RentBuy data={s.data} />;
        case "pcs_first30": return <PCSFirst30 data={s.data} />;
        case "faq": return <FAQ data={s.data} />;
        case "story": return <StoryBody data={s.data} />;
        case "places_pending":
          return <div className="live-note">{s.note || "Live nearby recommendations (Google Places) appear here in the app."}</div>;
        case "pending":
        default:
          return <div className="pending">{s.note || "Content pending verification."}</div>;
      }
    }
    // Accuracy provenance: a section's official source travels with it, next to its check line.
    //
    // RULE (Chris, decision card 2026-11-23, "Convert to advice"): a June 2026 section that no
    // official page could confirm has been rewritten as plain advice. It carries "advice": true and
    // "confirm_with" (who to ask) and NO "verified" date, and shows "Our advice. Confirm with <who>."
    // where other sections show their date - the same words milspoliving.com uses
    // (src/lib/guide-check-notes.ts in the website repo).
    // ACCURACY RULE: an advice section is NEVER shown as checked or dated. Advice is tested first,
    // so even a stray "verified" left on one cannot surface: a date would claim an official page
    // confirmed it, and nothing in advice is a fact a page can confirm. Its source link stays,
    // because that is where the reader goes to confirm.
    // A section with no date and no advice shows its source alone, or no line at all.
    function sectionCheckLine(s) {
      if (s.advice) {
        const confirmWith = typeof s.confirm_with === "string" ? s.confirm_with.trim() : "";
        return confirmWith ? "Our advice. Confirm with " + confirmWith + "." : "Our advice.";
      }
      // Same word as the website ("Checked <date>"), so a family reads one term in both places
      // (Chris, decision card 2026-11-23 "Use 'Checked' in the app").
      return s.verified ? "Checked " + s.verified : "";
    }
    function SrcLine({ s }) {
      const checkLine = sectionCheckLine(s);
      if (!s.source && !checkLine) return null;
      return (
        <div className="srcline">
          {s.source ? <a href={s.source.url} target="_blank" rel="noopener noreferrer">Source: {s.source.label}</a> : null}
          {s.source && checkLine ? " · " : null}
          {checkLine ? <span>{checkLine}</span> : null}
        </div>
      );
    }
    function Accordion({ s, open, onToggle, coords }) {
      return (
        <div className={"acc" + (open ? " open" : "")}>
          <div className="acc-head" onClick={onToggle}>
            <span className="sec-ic"><Icon name={sectionIcon(s.id)} size={18} /></span>
            <h3>{s.title}</h3>
            <span className="acc-chev"><Icon name="chevron" size={18} /></span>
          </div>
          {open ? <div className="acc-body"><SectionBody s={s} coords={coords} /><SrcLine s={s} /></div> : null}
        </div>
      );
    }

    // Tiny markdown renderer (AI answers come back as markdown). Builds React
    // nodes (no dangerouslySetInnerHTML). Handles bold, links, headings, lists,
    // blockquotes, and horizontal rules - enough for the assistant's output.
    function mdInline(text, kp) {
      const nodes = []; let rest = String(text); let k = 0;
      const re = /(\*\*([^*]+)\*\*)|(\[([^\]]+)\]\((https?:[^)]+)\))/;
      while (rest.length) {
        const m = rest.match(re);
        if (!m) { nodes.push(rest); break; }
        if (m.index > 0) nodes.push(rest.slice(0, m.index));
        if (m[1]) nodes.push(<strong key={kp + "b" + (k++)}>{m[2]}</strong>);
        else nodes.push(<a key={kp + "l" + (k++)} href={m[5]} target="_blank" rel="noopener noreferrer">{m[4]}</a>);
        rest = rest.slice(m.index + m[0].length);
      }
      return nodes;
    }
    function Markdown({ text }) {
      const lines = String(text).replace(/\r/g, "").split("\n");
      const blocks = []; let para = [], list = [];
      const flushP = () => { if (para.length) { blocks.push({ t: "p", x: para.join(" ") }); para = []; } };
      const flushL = () => { if (list.length) { blocks.push({ t: "ul", items: list.slice() }); list = []; } };
      for (const ln of lines) {
        const s = ln.trim();
        if (!s) { flushP(); flushL(); continue; }
        if (/^###\s+/.test(s)) { flushP(); flushL(); blocks.push({ t: "h3", x: s.replace(/^###\s+/, "") }); }
        else if (/^#{1,2}\s+/.test(s)) { flushP(); flushL(); blocks.push({ t: "h2", x: s.replace(/^#{1,2}\s+/, "") }); }
        else if (/^[-*]\s+/.test(s)) { flushP(); list.push(s.replace(/^[-*]\s+/, "")); }
        else if (/^>\s?/.test(s)) { flushP(); flushL(); blocks.push({ t: "q", x: s.replace(/^>\s?/, "") }); }
        else if (/^---+$/.test(s)) { flushP(); flushL(); blocks.push({ t: "hr" }); }
        else { flushL(); para.push(s); }
      }
      flushP(); flushL();
      return (
        <div className="md">
          {blocks.map((b, i) => {
            if (b.t === "h2") return <h3 key={i} className="md-h">{mdInline(b.x, "h" + i)}</h3>;
            if (b.t === "h3") return <div key={i} className="md-h3">{mdInline(b.x, "h" + i)}</div>;
            if (b.t === "ul") return <ul key={i} className="md-ul">{b.items.map((it, j) => <li key={j}>{mdInline(it, "li" + i + "_" + j)}</li>)}</ul>;
            if (b.t === "q") return <div key={i} className="md-quote">{mdInline(b.x, "q" + i)}</div>;
            if (b.t === "hr") return <hr key={i} className="md-hr" />;
            return <p key={i}>{mdInline(b.x, "p" + i)}</p>;
          })}
        </div>
      );
    }

    // "Ask about this base" - grounded AI Q&A via the backend.
    function AskBox({ slug }) {
      const [q, setQ] = useState("");
      const [a, setA] = useState(null);
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState(false);
      const inputRef = useRef(null);
      const ask = async () => {
        const question = q.trim();
        if (!question) return;
        setLoading(true); setA(null); setErr(false);
        try {
          const d = await postJSON(apiUrl("/api/ai/relay"), { slug, question });
          setA(d.answer || "(no answer)");
        } catch (e) { setErr(true); }
        setLoading(false);
      };
      const clear = () => {
        setQ(""); setA(null); setErr(false);
        if (inputRef.current) inputRef.current.focus();
      };
      return (
        <div className="ask">
          <div className="ask-title">Ask about this base</div>
          <div className="ask-row">
            <div className="ask-inputwrap">
              <input ref={inputRef} value={q} onChange={(e) => setQ(e.target.value)}
                placeholder="e.g. Where should we live?"
                onKeyDown={(e) => { if (e.key === "Enter") ask(); }} />
              {q ? <button className="ask-clear" onClick={clear} aria-label="Clear question" title="Clear">&times;</button> : null}
            </div>
            <button onClick={ask} disabled={loading}>{loading ? "..." : "Ask"}</button>
          </div>
          {loading ? <div className="ask-ans faint ask-thinking"><span className="spin spin-sm" />Thinking&hellip;</div> : null}
          {err ? <div className="ask-ans faint">Couldn't reach the assistant. Start the backend and try again.</div> : null}
          {a ? <div className="ask-ans"><Markdown text={a} /></div> : null}
          <div className="faint tiny" style={{ marginTop: 6 }}>Answers come only from this guide's verified content.</div>
        </div>
      );
    }

    /* ---------------- ACCOUNT (the same account as milspoliving.com) ----------------
       The reader signs in against the SAME Supabase project the website uses, so the app knows it
       is the same person: saved bases are the website's public.saved_bases rows and a base saved in
       either place shows in both (Chris, decision cards 2026-11-24: "Yes, account then look",
       "6-digit code", "Yes, both now", "No social logins"). The website's finished slice is the
       model (its src/lib/account.ts, account-settings.ts, saved-bases*.ts): the same sentences,
       rules and names, without the Next.js plumbing. This slice is the account only; no restyle.

       RULES
       - No password, ever. Sign-in is a code emailed by Supabase Auth (email OTP).
         WARNING: the code's LENGTH is a project setting (Supabase Auth, "email OTP length": 8 on
         2026-11-24, 6 in older projects, up to 10). The app never assumes a length: it accepts
         CODE_MIN_DIGITS to CODE_MAX_DIGITS. The first test (2026-11-24) failed because the app
         demanded exactly six digits and cut an 8-digit code short.
         WHY a code and not the website's link: a store app cannot rely on an emailed link opening
         the app, and a link completes only on the device that asked for it; a code works on the
         web, the installed PWA and the native builds alike.
       - Email only. ROAD NOT TAKEN (Chris, "No social logins"): Apple or Google sign-in would tie
         a military family to a third identity provider, and offering any third-party login brings
         Apple's "Sign in with Apple" requirement with it.
       - The first code makes the account (shouldCreateUser). There is no separate sign-up step.
       - The role (member / editor / owner) is read from public.profiles, the account's own row,
         and never set from here. editor and owner are set by hand in the database.
       - The first name is OPTIONAL (Chris, 2026-11-24, after the first test: "the header must
         make the state obvious", decision card "On the sign-in screen"). It is asked above the
         address on the sign-in screen, kept in public.profiles.first_name (FIRST_NAME_MAX_CHARS)
         and greets the reader in the top bar as "Hi <name>", or "Hi there" when none is stored.
         It reaches the database two ways, both the website's contract (2026-11-24): as user
         metadata on signInWithOtp (a database trigger copies it when the account is made), and
         through the database function set_first_name once signed in. After every sign-in the
         typed name is also sent through set_first_name when the profile has none yet, which gives
         an existing account its name and covers a trigger that did not fire. ROAD NOT TAKEN:
         updating profiles.first_name from the client; the function is the one place the trim and
         length rules live, shared with the website. Until the website's migration is applied the
         function is missing and the screen says "Not available yet", like the delete functions.
         The name is never logged.
       - Logs carry a masked address only (maskEmail) and never a code.
       - Delete my account (Apple rule 5.1.1(v); Chris 2026-11-23): the request is recorded by the
         database function request_account_deletion; the account and its rows are removed 30 days
         later and nothing is sent while it waits; cancel_account_deletion withdraws it. The
         pending request shows as profiles.deletion_requested_at.

       WARNING (supabase-js): never call the client inside the onAuthStateChange callback; it can
       deadlock. The profile read is put on the next tick for that reason.
       WARNING (Supabase dashboard): the "Magic Link" email template must print {{ .Token }}, or the
       reader gets a link and no code. docs/app-accounts.md has the step. */
    const ACCOUNT_LOG = "[ACCOUNT]";
    const SAVED_LOG = "[SAVED]";
    const ACCOUNT_ROLES = ["member", "editor", "owner"];
    const ROLE_LABEL = { member: "Member", editor: "Editor (MilSpo Living team)", owner: "Owner" };
    // Days between the deletion request and the removal (Chris, 2026-11-23). The database job
    // applies the same number; this one only tells the reader the date.
    const DELETION_WAIT_DAYS = 30;
    // The longest first name the database function set_first_name keeps (the website's contract,
    // 2026-11-24). The boxes stop at the same length so the stored name is what the reader typed.
    const FIRST_NAME_MAX_CHARS = 40;
    // The greeting in the top bar. RULE (Chris, 2026-11-24): the header must make the state
    // obvious - signed in reads "Hi <first name>", and "Hi there" while no name is stored, so the
    // address is never the thing that says "signed in" (it stays on the account screen).
    function greeting(firstName) { return firstName ? "Hi " + firstName : "Hi there"; }

    // WORDING RULE (Chris 2026-11-23, memory 152): public text says only that MilSpo Living is
    // "affiliated with MilHousing Network"; nothing about ownership or company structure.
    const PUBLISHER_LINE = BRAND + " is published by MilSpo Life LLC. It is affiliated with MilHousing Network.";
    const PRIVACY_URL = "https://milspoliving.com/privacy";

    // The sign-in screen's words carry a version: the screen is the record of what a family agreed
    // to (website, account-settings.ts, SIGN_IN_SCREEN_VERSION). The sentences are the website's
    // with one change: the website emails a link, the app emails a code. "-c" (2026-11-24): the
    // optional "First name" box above the address; a reader who signed up on "-b" was never asked.
    const SIGN_IN_SCREEN_VERSION = "2026-11-24-c";
    // The emailed code's length is set in Supabase Auth, not here (see the WARNING above): accept the
    // whole range Supabase allows so a settings change never locks readers out.
    const CODE_MIN_DIGITS = 6;
    const CODE_MAX_DIGITS = 10;
    const SIGN_IN_TEXT = {
      label: "Sign in",
      title: "Save my move",
      whatYouGet: "We keep your saved bases, so you find them on any phone or computer. No password: we email you a code.",
      firstNameLabel: "First name (optional)",
      emailLabel: "Email address",
      // WHY the weekly email is stated here although the sends are later slices on the website:
      // Chris decided 2026-11-23 that every alert is ON from sign-up and that this screen is where
      // that is said. A statement, not a tick box.
      weeklyEmail: "You also get one weekly email: changes at your bases on top (housing allowance and rents, spouse jobs, new stories and guide updates, crime figures), then the MilSpo Minute. Be the first to know when new allowance rates come out. Unsubscribe at any time.",
      noCallsNoTexts: PUBLISHER_LINE + " No calls, no texts.",
      button: "Send me a code",
      policyLine: "By continuing you accept our privacy policy.",
      codeLabel: "Code from the email",
      codeButton: "Sign in",
      // The code's life is Supabase's default for an email OTP (one hour; Supabase Auth docs, read 2026-11-24).
      sent: "Check your inbox and enter the code from the email. The code works for one hour. If it does not arrive, look in spam, then ask for a new one.",
    };
    const SIGN_IN_MESSAGE = {
      "bad-email": "Check the email address and try again.",
      // Supabase allows one request per address every 60 seconds (Supabase Auth docs, read 2026-11-23).
      "too-soon": "We sent you a code less than a minute ago. Wait a minute, then ask again.",
      // Supabase's hourly cap on sign-in emails for the whole project (error code
      // over_email_send_rate_limit): not the reader's fault, and not a minute's wait. Found on the
      // first app test, 2026-11-24, when the 2-an-hour test mailer was still on.
      "mailer-busy": "Our sign-in emails are paused for a short while. Please try again in an hour.",
      off: "Accounts are not available here yet.",
      failed: "The code did not go out. Try again in a few minutes.",
      "bad-code": "That code did not work. Check the digits or ask for a new code.",
      "check-failed": "Could not check the code. Try again.",
    };

    /** "chris@gmail.com" -> "c***@gmail.com". A log line never holds a full address. */
    function maskEmail(email) {
      const at = email.lastIndexOf("@");
      if (at < 1) return "***";
      return email.charAt(0) + "***" + email.slice(at);
    }
    // The website's check (email-address.ts): only a sent email proves an address, so a strict
    // pattern would turn away real addresses. Supabase answers with an error for a bad one.
    function isValidEmail(email) {
      if (email.length < 6 || email.length > 254) return false;
      return /^[^\s@<>()",;:\\]+@[^\s@<>()",;:\\]+\.[^\s@<>()",;:\\.]{2,}$/.test(email);
    }

    // One client for the whole app. The session is kept by supabase-js in localStorage (its
    // default), so an installed app stays signed in. detectSessionInUrl is off: nothing arrives in
    // the address bar with a code flow, and the PWA's own ?vcheck= query must never be parsed.
    let supabaseSingleton = null;
    function supabaseClient() {
      if (!ACCOUNTS_ON) return null;
      if (supabaseSingleton) return supabaseSingleton;
      if (!window.supabase || typeof window.supabase.createClient !== "function") {
        console.warn(ACCOUNT_LOG + " supabase-js did not load; accounts are off for this visit");
        return null;
      }
      supabaseSingleton = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
      });
      return supabaseSingleton;
    }

    // The signed-in state, one store for the whole app (read with useAccount). Shapes:
    //   { status: "off" } | { status: "loading" } | { status: "signed-out" } |
    //   { status: "signed-in", user: { id, email }, role, firstName, deletionRequestedAt, profileRead }
    // role, firstName and deletionRequestedAt are null until the profile row is read (or when the
    // read failed); firstName stays null when the account has no name.
    const accountListeners = new Set();
    let accountState = ACCOUNTS_ON ? { status: "loading" } : { status: "off" };
    let accountStarted = false;
    function setAccountState(next) { accountState = next; accountListeners.forEach((fn) => fn()); }

    // select("*") and not a column list: the deletion column arrives with the website's delete
    // slice, and a column list naming it would fail the whole read where that migration is not
    // applied yet. RLS returns the account's own row only.
    async function readProfile(supabase, userId) {
      const { data, error } = await supabase.from("profiles").select("*").eq("id", userId).maybeSingle();
      if (error) { console.warn(ACCOUNT_LOG + " profile not read: " + error.message); return null; }
      const firstName = data && typeof data.first_name === "string" ? data.first_name.trim() : "";
      return {
        role: data && ACCOUNT_ROLES.includes(data.role) ? data.role : null,
        firstName: firstName || null,
        deletionRequestedAt: data && typeof data.deletion_requested_at === "string" ? data.deletion_requested_at : null,
      };
    }
    // The name typed on the sign-in screen, held until the profile is read after that sign-in: an
    // account that has no name yet gets it through set_first_name (see the RULES above). Cleared
    // after one attempt so a later token refresh never resends it.
    let firstNameTypedAtSignIn = "";
    async function refreshProfile() {
      const supabase = supabaseClient();
      if (!supabase || accountState.status !== "signed-in") return;
      const userId = accountState.user.id;
      const profile = await readProfile(supabase, userId);
      if (accountState.status !== "signed-in" || accountState.user.id !== userId) return;
      setAccountState({ ...accountState, role: profile ? profile.role : null, firstName: profile ? profile.firstName : null,
        deletionRequestedAt: profile ? profile.deletionRequestedAt : null, profileRead: !!profile });
      const typed = firstNameTypedAtSignIn;
      firstNameTypedAtSignIn = "";
      if (typed && profile && !profile.firstName) await setFirstName(typed);
    }
    function applySession(session) {
      if (!session || !session.user) { setAccountState({ status: "signed-out" }); return; }
      const user = { id: session.user.id, email: session.user.email || "" };
      if (accountState.status === "signed-in" && accountState.user.id === user.id) {
        setAccountState({ ...accountState, user }); // a token refresh: keep the profile already read
        return;
      }
      setAccountState({ status: "signed-in", user, role: null, firstName: null, deletionRequestedAt: null, profileRead: false });
      setTimeout(refreshProfile, 0); // next tick: see the deadlock WARNING above
    }
    function startAccount() {
      if (accountStarted) return;
      accountStarted = true;
      const supabase = supabaseClient();
      if (!supabase) { setAccountState({ status: "off" }); return; }
      // INITIAL_SESSION arrives first with the stored session (or null), then every change:
      // SIGNED_IN after verifyOtp, SIGNED_OUT, TOKEN_REFRESHED, USER_UPDATED.
      supabase.auth.onAuthStateChange((_event, session) => applySession(session));
    }
    function subscribeAccount(fn) { accountListeners.add(fn); startAccount(); return () => accountListeners.delete(fn); }
    function accountSnapshot() { return accountState; }
    function useAccount() { return useSyncExternalStore(subscribeAccount, accountSnapshot); }

    /** The name as the database keeps it: trimmed, at most FIRST_NAME_MAX_CHARS, "" when blank. */
    function cleanFirstName(name) { return String(name || "").trim().slice(0, FIRST_NAME_MAX_CHARS); }

    // Step 1: ask for the code. Answers "sent" | "bad-email" | "off" | "too-soon" | "mailer-busy" | "failed".
    // A typed first name travels as user metadata so the database trigger can copy it into the
    // profile when this code makes a new account; blank sends no metadata at all.
    async function sendSignInCode(email, firstName) {
      const address = email.trim();
      if (!isValidEmail(address)) return "bad-email";
      const supabase = supabaseClient();
      if (!supabase) return "off";
      const name = cleanFirstName(firstName);
      const options = name ? { shouldCreateUser: true, data: { first_name: name } } : { shouldCreateUser: true };
      // No emailRedirectTo: with none, Supabase's template still gets {{ .Token }} to print and the
      // link in it (if the template keeps one) is not what signs the reader in here.
      const { error } = await supabase.auth.signInWithOtp({ email: address, options });
      if (error) {
        console.warn(ACCOUNT_LOG + " code not sent for " + maskEmail(address) + ": " + (error.status || "") + " " + error.message);
        // Two different 429s: the per-address minute (too-soon) and the project's hourly email cap.
