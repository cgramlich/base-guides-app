<!DOCTYPE html>
<!--
  BASE GUIDES - single-file mobile web app  (MilSpo Living)
  Stack: React 18 + Babel Standalone (CDN). No build step. Open or host the file.
  Architecture: the app ships with NO base content. Each base's guide is fetched
  ON DEMAND (data/bases/<slug>.json now; backend API later) and cached by the
  service worker. One app, all bases, light forever. (Anti-Touch-Stay design.)
  Live layer (AI Q&A + nearby places) is served by the backend via API_BASE.
  Long-form base stories come from the backend too (/api/bases/<slug>/story), the
  same stories milspoliving.com shows, read from the shared database.
  Account: a reader can sign in (a code by email, or an optional password) against
  the SAME Supabase project as milspoliving.com; saved bases are then the website's
  rows, so a base saved in either place shows in both (ACCOUNT and SAVED BASES
  sections below). The one pay grade is kept the same way (PAY GRADE section).
  Notes: all console/log output is plain ASCII (no emoji) by design.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Base Guides" />
  <meta name="theme-color" content="#121621" />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Base Guides</title>
  <meta property="og:title" content="Base Guides" />
  <meta property="og:description" content="Living guides to U.S. military bases - by MilSpo Living." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- The look's faces (see THE NEW LOOK in the style block): Instrument Serif for headings, Outfit
       for body text and the wordmark, Crimson Pro for long-form reading. sw.js caches Google Fonts
       by host, so a change here needs no change there. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <!-- The first screen's faces (FIRST SCREEN LOOK in the style block): the website's three, only
       the weights that screen uses. Cached by sw.js like the link above. -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- Supabase Auth + the account's own rows (ACCOUNT section in the script below). Exact version
       pinned; sw.js caches this URL as an immutable asset. If it fails to load, accounts are off
       for that visit and nothing else in the app changes. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>

  <style>
    /* ===== THE NEW LOOK (Navy and Gold) =====
       WHAT THIS BLOCK IS: the whole look of the app, the MenuCaptain redesign applied to Base Guides.
       Copied from menucaptain-native-build, www/index.html, "THE NEW LOOK" (Stage 1 releases 1.593.0
       to 1.595.x), which carries Media's round 2 kit (Design review 2026-11/moments/round2/shared.css).
       Every colour value here is the kit's Navy & Gold colourway; nothing was invented.
       DECISION (Chris, 2026-11-24, cards "Yes, account then look" and "Navy and Gold"): slice 2 is the
       look only, and the colourway is Navy & Gold - navy ink (#131b2e) on white by day, the navy
       ground (#121621) with light text at night, gold details.
       ROAD NOT TAKEN: a preview switch. MenuCaptain keeps its new look behind "Try the new look" for
       two testers while members keep the old one; this app has no members yet, so the release IS
       the look, the old dark palette is gone (git remembers it) and no screen asks which look to draw.

       HOW: a token layer --n-* with a light set (--nl-*) and a dark set (--nd-*); the mode copies one
       into --n-*; then today's names (--bg, --text, --accent and the rest) point at --n-*, so every
       rule below repaints at once. The n- prefix keeps the kit's names (bg, ink, dim, faint, line,
       soft, solid, onsolid, danger, accent) from colliding with --bg and --accent, which mean other
       things. The mode: <html data-mode="light|dark">, set before first paint by the script under
       this block and kept by applyLook (section LOOK of the app script) - the phone's setting unless
       the reader chose Light or Dark in the Appearance row of the account screen.

       THE RULES, in the kit's words:
       - Square corners everywhere. Hairline rows, not boxes: a card is the page with a line under it.
       - Buttons are solid ink or an ink outline. The accent (gold) is for SMALL details only - the
         tab bar's dot, a count, an underline, a pull-quote's rule - never the fill of a button.
       - Fields are underlines: --faint at rest, ink while typing. Labels in sentence case.
       - Headings in the serif (Instrument Serif, one weight, 400); the line under a page title is
         the italic serif in --dim; the wordmark is Outfit small caps with wide letter spacing.
       - Placeholders in --faint. Second lines in --dim; --faint is never running text.
       - The tab bar sits on the page ground with a hairline top, 11px labels, the active tab in
         ink with a 4px gold dot under it.
       - Red is for errors and delete only. A weather alert keeps red (it is a warning). */
    :root{
      --n-brass-metal:linear-gradient(135deg,#4a3109 0%,#b8821f 16%,#f0c04a 30%,#ffe9a0 40%,#c58f26 52%,#5a3b0a 68%,#d29a2c 84%,#7a5210 100%);
      /* Navy & Gold, light set: navy ink on white, brass details (the kit's Navy & Gold over Brass). */
      --nl-bg:#fff; --nl-ink:#131b2e; --nl-dim:#56627a; --nl-faint:#8794a8; --nl-line:#e0e5ee; --nl-soft:#f0f3f8;
      --nl-solid:#131b2e; --nl-onsolid:#fff; --nl-danger:#b42318;
      --nl-accent:var(--n-brass-metal); --nl-accent-flat:#a8741a; --nl-onaccent:#000;
      --nl-accent-rgb:168,116,26; --nl-danger-rgb:180,35,24; --nl-ink-rgb:19,27,46; --nl-edge:#e0e5ee;
      /* Navy & Gold, dark set: the navy ground the app always had, light text, flat gold details. */
      --nd-bg:#121621; --nd-ink:#eef2f8; --nd-dim:#aab6c8; --nd-faint:#8291a6; --nd-line:#2b3647; --nd-soft:#1c2433;
      --nd-solid:#eef2f8; --nd-onsolid:#121621; --nd-danger:#f97066;
      --nd-accent:var(--n-brass-metal); --nd-accent-flat:#e7b24c; --nd-onaccent:#121621;
      --nd-accent-rgb:231,178,76; --nd-danger-rgb:249,112,102; --nd-ink-rgb:238,242,248; --nd-edge:#334053;
      /* The mode: light unless data-mode="dark" (or the phone is dark and nothing chose, below). */
      --n-bg:var(--nl-bg); --n-ink:var(--nl-ink); --n-dim:var(--nl-dim); --n-faint:var(--nl-faint); --n-line:var(--nl-line);
      --n-soft:var(--nl-soft); --n-solid:var(--nl-solid); --n-onsolid:var(--nl-onsolid); --n-danger:var(--nl-danger);
      --n-accent:var(--nl-accent); --n-accent-flat:var(--nl-accent-flat); --n-onaccent:var(--nl-onaccent);
      --n-accent-rgb:var(--nl-accent-rgb); --n-danger-rgb:var(--nl-danger-rgb); --n-ink-rgb:var(--nl-ink-rgb);
      --n-sheet:var(--nl-bg); --n-sheet-edge:var(--nl-edge);
      --n-shadow:0 6px 24px rgba(0,0,0,0.10);
      color-scheme:light;
    }
    :root[data-mode="dark"]{
      --n-bg:var(--nd-bg); --n-ink:var(--nd-ink); --n-dim:var(--nd-dim); --n-faint:var(--nd-faint); --n-line:var(--nd-line);
      --n-soft:var(--nd-soft); --n-solid:var(--nd-solid); --n-onsolid:var(--nd-onsolid); --n-danger:var(--nd-danger);
      --n-accent:var(--nd-accent); --n-accent-flat:var(--nd-accent-flat); --n-onaccent:var(--nd-onaccent);
      --n-accent-rgb:var(--nd-accent-rgb); --n-danger-rgb:var(--nd-danger-rgb); --n-ink-rgb:var(--nd-ink-rgb);
      --n-sheet:var(--nd-soft); --n-sheet-edge:var(--nd-edge);
      --n-shadow:0 8px 28px rgba(0,0,0,0.55);
      color-scheme:dark;
    }
    /* A dark phone before the script has run (or with scripts off) gets the dark set, so the page
       never paints white and then switches. The same declarations as data-mode="dark" on purpose. */
    @media (prefers-color-scheme: dark){
      :root:not([data-mode="light"]){
        --n-bg:var(--nd-bg); --n-ink:var(--nd-ink); --n-dim:var(--nd-dim); --n-faint:var(--nd-faint); --n-line:var(--nd-line);
        --n-soft:var(--nd-soft); --n-solid:var(--nd-solid); --n-onsolid:var(--nd-onsolid); --n-danger:var(--nd-danger);
        --n-accent:var(--nd-accent); --n-accent-flat:var(--nd-accent-flat); --n-onaccent:var(--nd-onaccent);
        --n-accent-rgb:var(--nd-accent-rgb); --n-danger-rgb:var(--nd-danger-rgb); --n-ink-rgb:var(--nd-ink-rgb);
        --n-sheet:var(--nd-soft); --n-sheet-edge:var(--nd-edge);
        --n-shadow:0 8px 28px rgba(0,0,0,0.55);
        color-scheme:dark;
      }
    }
    /* Today's names, pointed at the tokens, so the rules below and the few inline colours in the app
       script (color: var(--accent) on a saved bookmark, the Killer subtitle) follow the mode.
       WARNING, the --accent-is-ink rule (kit; MenuCaptain 1.593.1): --accent is the INK, not the
       gold. Everything the app paints with --accent (links, icons, a filled bookmark, the back link)
       is drawn in ink by the kit; gold is kept for the small details, which name --n-accent or
       --n-accent-flat themselves. The flat brass reads 4.06:1 on white, under the 4.5:1 text needs,
       so pointing --accent at gold would fail every link in light mode. Do not "fix" this.
       --text-faint is --dim for the same reason: second lines are --dim; only placeholders and
       disabled things get --n-faint, by name. --surface-2 (chips, the second tier of a box) has no
       drawing of its own: a whisker of ink over the ground. */
    :root{
      --bg:var(--n-bg); --bg-2:var(--n-bg); --surface:var(--n-soft); --surface-2:color-mix(in srgb, var(--n-ink) 7%, var(--n-bg));
      --line:var(--n-line); --line-soft:var(--n-line);
      --text:var(--n-ink); --text-dim:var(--n-dim); --text-faint:var(--n-dim);
      --accent:var(--n-ink); --accent-dim:var(--n-ink);
      --danger:var(--n-danger);
      --serif:'Instrument Serif',Georgia,serif;
      --shadow:var(--n-shadow);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
    /* Body text is Outfit, the kit's body face (MenuCaptain's too). Long-form reading - a guide
       section's prose, the story, an answer - stays Crimson Pro, the app's reading face: the kit
       has no long-form page and a magazine read wants a serif. Headings are the kit's serif. */
    body{
      font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
      font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
      overscroll-behavior-y:none;
    }
    .acc-body, .acc-body p, .ask-ans, .md, .basehero .tag, .hero .tag{ font-family:'Crimson Pro',Georgia,serif; }
    .acc-body{ font-size:15.5px; line-height:1.6; }
    input,textarea,select,button{font-family:inherit; font-size:16px;}
    button{cursor:pointer; border:none; background:none; color:inherit;}
    /* ---- TAP TARGETS (auditor round 3, item 28; Chris's card 2026-11-24 "The clear fixes, one batch") ----
       RULE: everything a finger taps is at least 44 x 44 px, with at least 8px between two small
       neighbours. Measured before this rule: row bookmark 30 x 30, guide bookmark 32 x 32, "This is
       my base" 36 high, the back link 76 x 21, "Sign in" 70 x 30, chips 28 high, fields 39 high.
       HOW: one floor for every button, field and dropdown, so a control added later starts at the
       right size without anyone remembering this rule. The glyph or the words keep their size; the
       box grows around them. Where a taller box would push its row apart (the back link, "Remove",
       a notice's button), a negative margin lets the box reach into the padding around it, which
       holds nothing else to tap.
       NOT covered, on purpose: a link inside a sentence (a source line, a link in an answer, the
       privacy policy). Making one 44px tall opens gaps between lines of text, and WCAG's target
       size rule leaves inline links out for that reason. A tick box in the checklist: its whole
       row is the target. A dot on the map: the same places are rows under the map.
       WARNING: a later rule that gives a button a smaller min-height or a fixed height undoes this. */
    button, select, textarea, input:not([type="checkbox"]):not([type="radio"]){ min-height:44px; }
    button{ min-width:44px; }
    h1,h2,h3{font-family:var(--serif); font-weight:400; margin:0; line-height:1.15; letter-spacing:0;}
    ::placeholder{ color:var(--n-faint); opacity:1; }
    a{ color:var(--n-ink); }

    /* WARNING: every corner is square (Chris kept square corners everywhere, 2026-11-20), so ONE rule
       squares them all, inline corners and Leaflet's included, and the short list under it keeps the
       true circles: the brand coin, the spinner, the tab bar's dot, the first screen's branch dot.
       A new circle must be added to
       that list or it draws as a square. Road not taken: squaring each rule by hand, which leaves
       strays. */
    *, *::before, *::after{ border-radius:0 !important; }
    :is(.brandmark, .spin, .home-logo, .fs-dot), .nav button.on::before{ border-radius:50% !important; }

    /* ---- the shell: the top bar (kit t01b, t03, t17) and the page ---- */
    #app-shell{
      max-width:540px; margin:0 auto; min-height:100vh; background:var(--bg);
      position:relative; padding-bottom:calc(72px + env(safe-area-inset-bottom));
    }
    .topbar{ position:sticky; top:0; z-index:30; background:var(--n-bg); padding:calc(6px + env(safe-area-inset-top)) 20px 0; }
    .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:46px;}
    .wordmark{ display:flex; align-items:center; gap:8px; font-family:'Outfit',sans-serif; font-size:11px; font-weight:500;
      letter-spacing:0.42em; text-transform:uppercase; color:var(--n-ink); white-space:nowrap; }
    .content{padding:14px 20px 24px; overflow-x:clip;}
    .screen-h{font-size:38px; line-height:1.1; margin:6px 0 14px;}

    .banner{
      margin:0 20px; padding:10px 2px; font-size:13.5px; color:var(--n-ink);
      display:flex; align-items:center; gap:10px; border-top:1px solid var(--n-line); border-bottom:1px solid var(--n-line);
    }
    .banner + .banner{ border-top:0; }
    /* -3px up, not -8px: a notice sits right under the top bar, and its button must stay 8px
       clear of the account entry there (TAP TARGETS). */
    .banner button{margin:-3px 0 -8px auto; font-size:12.5px; color:var(--n-ink); font-weight:500;}

    /* ---- Home ---- */
    /* The coin and its line: a small masthead over the first screen's question, in the website's
       caption style (FIRST SCREEN LOOK, below). WARNING: the launch mark in the HTML draws these
       same three classes before the app has compiled; change them and both change together. */
    .home-hero{ display:flex; align-items:center; gap:14px; padding:4px 0 26px; }
    .home-logo{ flex:none; width:56px; height:56px; }
    .home-tag{ font-family:var(--w-sans); font-size:14px; line-height:1.45; color:var(--n-dim); }
    .home-controls{ margin-bottom:6px; }
    .home-search{ margin-bottom:9px; }
    .home-selects{ display:flex; gap:12px; margin-bottom:12px; }
    .home-selects select{ flex:1; min-width:0; }
    .state-header{ font-family:var(--serif); font-size:26px; line-height:1.15; color:var(--n-ink); margin:22px 0 2px; }

    /* Rows: a card is the page with a hairline under it, running the full screen width with the
       text 20px in (kit .row; the page margin is 20px). The branch colour that edged each row is
       gone with the box (the kit has no tinted edges; the branch is the row's second line). */
    .card{
      background:transparent; border:0; border-bottom:1px solid var(--n-line);
      padding:14px 20px; margin:0 -20px;
    }
    .card .card{ margin:12px 0 0; padding:14px 0 0; border-bottom:0; border-top:1px solid var(--n-line); }
    .card.tap{transition:opacity 0.08s ease; cursor:pointer;}
    .card.tap:active{opacity:0.7;}
    .base-name{font-family:var(--serif); font-size:20px; line-height:1.15; letter-spacing:0;}
    .meta-line{font-size:13.5px; color:var(--n-dim); margin-top:3px;}
    .parent-line{font-size:12.5px; margin-top:1px;}
    /* Labels you cannot tap: a hairline edge in --line, --dim text (kit .chip.tag). */
    .pill{display:inline-block; font-size:11px; line-height:1.4; padding:1px 7px; border:1px solid var(--n-line); color:var(--n-dim); margin-left:8px; vertical-align:2px; font-family:'Outfit',sans-serif;}
    /* The publisher's line under the wordmark (auditor round 2, item 19): the first screen says who makes the app. */
    .wordmark{ flex-direction:column; align-items:flex-start; gap:2px; }
    .wordmark-by{ font-size:9px; letter-spacing:0.22em; text-transform:none; color:var(--n-dim); font-weight:400; }
    /* The weather block keeps its height before the forecast arrives so the Ask box does not jump (auditor round 2, item 23). */
    .wx-slot{ min-height:46px; }
    /* Rows of bases on the Map and Guide tabs when no base is open (Chris's screenshots 2026-11-24). */
    .pick-rows{ margin-top:6px; }
    .pick-hint{ font-size:14px; color:var(--n-dim); margin:0 0 10px; }
    .pick-h{ font-family:var(--serif); font-size:22px; line-height:1.15; margin:14px 0 4px; }
    .pick-map{ height:200px; margin:6px 0 10px; background:var(--n-soft); }
    /* Add to Home Screen hint (auditor round 2, item 25). */
    .a2hs{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--n-dim); padding:8px 0 10px; border-bottom:1px solid var(--n-line); margin-bottom:8px; }
    .a2hs span{ flex:1; }
    .a2hs button{ color:var(--n-ink); font-size:13px; font-weight:500; padding:0 2px; margin:-8px 0; }
    /* Source chips under an answer (auditor round 2, item 21): the guide sections the answer drew on. */
    .ask-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
    .ask-chips .lbl{ font-size:12px; color:var(--n-dim); margin-right:2px; }
    .chip-src{ font-size:12px; padding:3px 9px; border:1px solid var(--n-line); color:var(--n-ink); background:transparent; }
    /* Map labels (auditor round 2, item 26). */
    .leaflet-tooltip.map-label{ font-size:11px; padding:1px 5px; background:rgba(255,255,255,0.92); border:1px solid #c9ccd2; color:#1b1f26; box-shadow:none; }
    .leaflet-tooltip.map-label.base{ font-weight:600; font-size:12px; }
    .card-go{color:var(--n-dim); flex:none; display:flex; align-items:center; margin-left:10px;}
    .card-actions{display:flex; align-items:center; gap:2px; flex:none;}
    .iconbtn{color:var(--n-dim); padding:6px; display:flex; align-items:center; justify-content:center;}

    /* ---- the guide ---- */
    /* A button 44px tall whose box reaches 10px up and 6px down into the page's own padding, so
       the guide starts where it did when this was a 21px line of text. */
    .back{font-size:14px; color:var(--n-ink); font-weight:500; display:inline-flex; gap:6px; align-items:center; margin:-10px 0 -6px; padding:0; cursor:pointer;}
    .hero{margin:2px 0 4px;}
    .hero .tag{color:var(--n-dim); font-size:14px; margin-top:6px;}
    /* The one coloured edge kept: the branch's 3px rule over the base's name (its colour is set
       inline from BRANCH_COLORS). */
    .basehero{border-top:3px solid var(--n-ink); border-bottom:1px solid var(--n-line); padding:14px 0 16px; margin-top:8px;}
    .basehero h1{font-size:38px; line-height:1.1;}
    .basehero .tag{color:var(--n-dim); font-size:15px; margin-top:7px;}
    .basehero-meta{margin-top:10px; font-size:13.5px; color:var(--n-dim);}
    .localtime{margin-top:6px; font-size:13.5px; color:var(--n-dim);}
    .sec-ic{color:var(--n-ink); display:inline-flex; align-items:center; flex:none;}

    /* ---- ask box ---- */
    .ask{ padding:14px 0 12px; border-bottom:1px solid var(--n-line); }
    .ask-title{ font-family:var(--serif); font-size:22px; line-height:1.15; margin-bottom:8px; }
    .ask-row{ display:flex; gap:12px; align-items:flex-end; }
    .ask-inputwrap{ position:relative; flex:1; min-width:0; display:flex; }
    .ask-row input{ flex:1; min-width:0; background:transparent; border:0; border-bottom:1px solid var(--n-faint); color:var(--text); padding:9px 44px 9px 0; }
    .ask-row input:focus{ outline:none; border-bottom-color:var(--n-ink); }
    .ask-clear{ position:absolute; right:0; top:50%; transform:translateY(-50%); background:transparent; border:0; color:var(--n-dim); font-size:20px; line-height:1; padding:0 5px; cursor:pointer; }
    .ask-clear:hover{ color:var(--text); }
    .ask-row > button{ flex:0 0 auto; background:var(--n-solid); color:var(--n-onsolid); font-weight:500; padding:9px 18px; }
    .ask-row > button:disabled{ opacity:0.6; }
    .ask-thinking{ display:flex; align-items:center; gap:9px; }
    .spin-sm{ width:15px; height:15px; border-width:2px; }
    .ask-ans{ margin-top:12px; font-size:15px; color:var(--text); line-height:1.55; background:var(--n-soft); padding:12px 14px; }
    .md > :first-child{ margin-top:0; } .md > :last-child{ margin-bottom:0; }
    .md p{ margin:0 0 9px; }
    .md-h{ font-family:var(--serif); font-size:20px; font-weight:400; color:var(--text); margin:12px 0 6px; }
    .md-h3{ font-size:15px; font-weight:600; color:var(--text); margin:10px 0 5px; }
    .md-ul{ margin:6px 0 9px; padding-left:18px; } .md-ul li{ margin:3px 0; }
    .md-quote{ border-left:2px solid var(--n-accent-flat); padding:4px 0 4px 12px; margin:9px 0; color:var(--n-dim); }
    .md-hr{ border:none; border-top:1px solid var(--n-line); margin:11px 0; }

    /* ---- sections (accordions): serif names on hairline rows ---- */
    .acc{border-bottom:1px solid var(--n-line); margin:0;}
    .acc-head{display:flex; align-items:center; gap:12px; padding:14px 0; cursor:pointer;}
    .acc-head h3{font-size:20px; flex:1;}
    .acc-chev{color:var(--n-dim); display:inline-flex; align-items:center; transition:transform 0.18s ease;}
    .between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
    .row{display:flex; align-items:center; gap:10px;}
    .muted{color:var(--n-dim);}
    .faint{color:var(--n-dim);}
    .tiny{font-size:12.5px;}
    .small{font-size:13.5px;}
    .acc.open .acc-chev{transform:rotate(180deg);}
    .acc-body{padding:0 0 16px; font-size:15px; color:var(--n-dim);}
    .acc-body p{margin:0 0 10px;}

    /* 8px between rows, not 7: on the account screen each row ends in a 44px button (TAP TARGETS). */
    /* align-items:baseline: a label sits on the first line of its value, also when the value is a
       row of 44px buttons (the account screen) or runs to several lines (a guide's quick facts). */
    dl.facts{margin:0; display:grid; grid-template-columns:auto 1fr; gap:8px 14px; align-items:baseline;}
    dl.facts dt{color:var(--n-dim); font-size:13.5px;}
    dl.facts dd{margin:0; color:var(--text); font-size:14.5px;}

    table.dec{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:6px;}
    table.dec th, table.dec td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--n-line); vertical-align:top;}
    table.dec th{color:var(--n-dim); font-weight:500; font-size:13px;}
    table.dec td:first-child{color:var(--text);}

    .lst{list-style:none; margin:0; padding:0;}
    .lst li{padding:9px 0; border-top:1px solid var(--n-line);}
    .lst li:first-child{border-top:none;}
    .lst .t{color:var(--text); font-weight:500; font-size:14.5px;}
    .lst .t .faint{font-weight:400;}
    .lst .d{color:var(--n-dim); font-size:13.5px; margin-top:2px;}

    .pending{font-size:14px; color:var(--n-dim); font-style:italic;}
    .place-detail{margin:8px 0 4px; padding:12px 14px; background:var(--n-soft);}
    .place-photo{width:100%; height:150px; object-fit:cover; display:block; margin-bottom:9px;}
    .place-summary{font-family:'Crimson Pro',Georgia,serif; font-size:14.5px; color:var(--n-dim); margin-bottom:9px; line-height:1.5;}
    .place-hours{font-size:12.5px; color:var(--n-dim); margin-bottom:9px;}
    .place-hours div{line-height:1.55;}
    .place-links{display:flex; flex-wrap:wrap; gap:16px;}
    .place-links a{color:var(--n-ink); font-size:13.5px; font-weight:500; display:inline-flex; align-items:center; min-height:44px; min-width:44px;}
    /* A notice (kit .req-banner): hairlines above and below, ink text, no fill. */
    .live-note{border-top:1px solid var(--n-line); border-bottom:1px solid var(--n-line); padding:10px 2px; font-size:13.5px; color:var(--n-ink);}
    /* Story section (the website's long-form story). */
    .story-h{font-family:var(--serif); font-size:20px; font-weight:400; color:var(--text); margin:16px 0 6px;}
    .story-h:first-child{margin-top:2px;}
    .story-sh{font-weight:600; font-size:14.5px; color:var(--text); margin:12px 0 4px;}
    .story-quote{margin:12px 0; padding:4px 0 4px 12px; border-left:2px solid var(--n-accent-flat); font-family:var(--serif); font-size:20px; color:var(--text); line-height:1.3;}
    .story-box{margin:12px 0; padding:12px 14px; background:var(--n-soft);}
    .story-label{font-size:13px; color:var(--n-dim); font-weight:500;}
    .story-title{font-family:var(--serif); font-weight:400; font-size:20px; color:var(--text); margin:2px 0 8px;}
    .story-box ul{margin:6px 0; padding-left:18px;}
    .story-box li{font-size:14px; line-height:1.5; margin-bottom:4px;}
    .story-small{font-size:13px; color:var(--n-dim); margin-top:8px;}
    table.dec tr.story-total td{color:var(--text); font-weight:600;}
    table.dec tr.story-has-how td{border-bottom:none; padding-bottom:2px;}
    table.dec tr.story-how td{padding-top:0; font-size:12.5px; color:var(--n-dim);}
    table.dec td.num, table.dec th.num{text-align:right; white-space:nowrap;}
    .story-disclaimer{font-size:13px; color:var(--n-dim); font-style:italic;}
    .story-missing{margin-bottom:12px;}
    .story-sources{margin-top:14px; padding-top:9px; border-top:1px solid var(--n-line); font-size:12.5px; color:var(--n-dim);}
    .story-sources ol{margin:4px 0 0; padding-left:18px;}
    .story-sources li{margin-bottom:3px; line-height:1.45;}
    .story-sources a{color:var(--n-ink); word-break:break-word;}
    .srcline{margin-top:12px; padding-top:9px; border-top:1px solid var(--n-line); font-size:12.5px; color:var(--n-dim);}
    .srcline a{color:var(--n-ink);}
    .feedback{ margin:22px 0 4px; padding:14px 0; border-top:1px solid var(--n-line); border-bottom:1px solid var(--n-line); text-align:center; }
    .feedback-q{ display:block; font-size:14px; color:var(--n-dim); margin-bottom:7px; }
    .feedback-link{ display:inline-flex; align-items:center; min-height:44px; color:var(--n-ink); font-weight:500; font-size:14.5px; }
    .feedback-note{ font-size:12.5px; color:var(--n-dim); margin-top:7px; }
    .website-guide-link{ text-align:center; padding:10px 0 4px; font-size:13.5px; }
    .website-guide-link a{ color:var(--n-dim); display:inline-flex; align-items:center; min-height:44px; }
    .website-tool{ display:block; padding:6px 0; color:inherit; text-decoration:none; }
    .website-tool-label{ display:block; font-weight:500; color:var(--n-ink); }

    /* ---- fields and buttons (kit .field, .btn) ---- */
    .fld{width:100%; background:transparent; border:0; border-bottom:1px solid var(--n-faint); color:var(--text); padding:9px 0; font-size:16px;}
    .fld:focus{outline:none; border-bottom-color:var(--n-ink);}
    select.fld{ -webkit-appearance:none; appearance:none; padding-right:22px;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23808080' stroke-width='1.6'/></svg>");
      background-repeat:no-repeat; background-position:right 2px center; }
    .fld-l{display:block; font-size:13px; color:var(--n-dim); margin-bottom:2px;}
    .task{display:flex; align-items:flex-start; gap:10px; padding:11px 0; min-height:44px; font-size:14.5px; color:var(--n-dim); cursor:pointer;}
    .task input{margin-top:3px; width:17px; height:17px; accent-color:var(--n-ink); flex:none;}
    .task-done{text-decoration:line-through; color:var(--n-faint);}
    /* min-height here too: a link can wear this class (the allowance part's link to the DoD calculator),
       and the TAP TARGETS floor names buttons, not links. */
    .btn-quiet{font-size:13.5px; color:var(--n-ink); display:inline-flex; align-items:center; gap:5px; font-weight:500; min-height:44px;}
    .btn-quiet:disabled{color:var(--n-faint);}
    /* The primary button. Named for the fill it had; it is solid ink now (the kit's .btn.primary):
       the accent is never a button's fill. The name stays because the screens carry it. */
    .btn-gold{display:inline-block; background:var(--n-solid); color:var(--n-onsolid); font-weight:500; padding:11px 18px; text-decoration:none; margin-top:10px; border:1px solid var(--n-solid);}
    .btn-gold:disabled{opacity:0.5;}
    .btn-plain{display:inline-block; background:transparent; border:1px solid var(--n-ink); color:var(--n-ink); font-weight:500; padding:11px 18px; margin-top:10px;}
    .btn-danger{display:inline-block; background:transparent; border:1px solid var(--n-danger); color:var(--n-danger); font-weight:500; padding:11px 18px; margin-top:10px;}
    .bridge{border-top:1px solid var(--n-line); border-bottom:1px solid var(--n-line); padding:16px 0; margin-bottom:14px;}
    .bridge-h{font-family:var(--serif); font-size:22px; margin-bottom:7px;}
    .bridge p{font-family:'Crimson Pro',Georgia,serif; color:var(--n-dim); font-size:15.5px; margin:0; line-height:1.55;}
    .wx{display:flex; align-items:center; gap:9px; margin:12px 0 2px;}
    .wx-temp{font-family:var(--serif); font-size:22px; color:var(--text);}
    .wx-cond{font-size:13.5px; color:var(--n-dim);}
    .wx-src{margin-left:auto; font-size:11px; letter-spacing:0.05em; color:var(--n-dim);}
    .wx-alert{margin:12px 0 0; padding:8px 0 8px 12px; border-left:2px solid var(--n-danger); color:var(--n-danger); font-size:13.5px;}
    .wx-alert-h{margin-top:3px; color:var(--n-dim); font-size:13px;}
    .bah-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-end;}
    .bah-sel{flex:0 0 88px; width:88px;}

    .seg{display:flex; border:1px solid var(--n-ink); overflow:hidden; flex:1; min-width:200px;}
    .seg button{flex:1 1 0; padding:9px 6px; font-size:13.5px; color:var(--n-ink); background:transparent;}
    .seg button.on{background:var(--n-solid); color:var(--n-onsolid); font-weight:500;}
    .bah-out{display:flex; align-items:baseline; gap:8px; margin:6px 0 8px;}
    .bah-amt{font-family:var(--serif); font-size:38px; color:var(--text); line-height:1;}
    .bah-mo{color:var(--n-dim); font-size:13.5px;}
    .bah-help{margin-top:8px; font-size:12.5px; line-height:1.5; color:var(--n-dim);}
    .picks-title{font-family:var(--serif); font-size:20px; color:var(--text); margin:2px 0 4px;}
    .picks{list-style:none; margin:0; padding:0;}
    .pick-card{padding:10px 0; border-bottom:1px solid var(--n-line);}
    .pick-top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
    .pick-name{font-weight:500; font-size:14.5px; color:var(--text);}
    .pick-cat{font-size:12.5px; color:var(--n-dim); white-space:nowrap;}
    .pick-blurb{font-family:'Crimson Pro',Georgia,serif; font-size:14.5px; color:var(--n-dim); margin-top:3px; line-height:1.45;}
    .pick-link{display:inline-flex; align-items:center; min-height:44px; color:var(--n-ink); font-size:13px; font-weight:500;}
    .picks-divider{font-family:var(--serif); font-size:20px; color:var(--text); margin:16px 0 8px;}

    .rb-card{flex:1 1 180px; min-width:0; background:var(--n-soft); padding:12px 14px;}
    .rb-h{font-weight:500; font-size:14px; color:var(--text); margin-bottom:7px;}
    .rb-list{margin:0; padding-left:18px;}
    .rb-list li{font-size:14px; color:var(--n-dim); line-height:1.5; margin-bottom:4px;}
    .rb-bottom{margin-top:10px; font-size:14.5px; color:var(--text); line-height:1.5;}
    .pcs-steps{margin:8px 0 0; padding-left:22px;}
    .pcs-steps li{margin-bottom:11px;}
    .pcs-t{font-weight:500; font-size:14.5px; color:var(--text);}
    .pcs-d{font-size:14px; color:var(--n-dim); line-height:1.5; margin-top:2px;}
    .faq-item{padding:10px 0; border-bottom:1px solid var(--n-line);}
    .faq-item:last-child{border-bottom:0;}
    .faq-q{font-weight:500; font-size:14.5px; color:var(--text); margin-bottom:4px;}
    .faq-a{font-size:14.5px; color:var(--n-dim); line-height:1.55;}

    .leaflet-bar a, .leaflet-touch .leaflet-bar a{ width:44px; height:44px; line-height:44px; }
    /* The PCS checklist's "Moving to" field (PlanBaseField) and the Saved screen's compare link. */
    .plan-base{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:44px; border-bottom:1px solid var(--n-faint); }

    .leaflet-control-attribution a{ color:#000 !important; }

    /* ---- account (sign in / account screen) ---- */
    .acct-entry{display:inline-flex; align-items:center; gap:6px; color:var(--n-ink); font-size:13px; font-weight:500; padding:6px 0 6px 8px; max-width:55%; flex:none;}

    .acct-code{letter-spacing:0.3em; font-size:24px; font-family:var(--serif); text-align:center;}
    .acct-msg{margin-top:10px; font-size:13.5px; color:var(--n-danger);}

    .acct-list .rm{color:var(--n-ink); font-size:13.5px; font-weight:500; padding:6px 0 6px 10px; margin:-5px 0; flex:none;}
    /* MY BASE: the Home row, the guide button, the one-tap pick on a card. 44px targets. */
    .mybase-row{display:flex; align-items:center; gap:8px; width:100%; margin:0 0 12px; padding:10px 12px; min-height:44px; border:1px solid var(--n-line); background:transparent; color:var(--text); font-size:14.5px; text-align:left;}
    .mybase-row .mybase-lbl{color:var(--n-dim); flex:none;}

    .mybase-explained{margin:-6px 0 12px;}
    .mybase-hint{margin-bottom:8px;}
    .basehero-actions{display:flex; align-items:center; gap:8px; flex:none;}
    .mybase-btn{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--n-ink); border:1px solid var(--n-ink); background:transparent; padding:6px 10px;}

       under its box; the grade's list is wide enough for "No pay grade". */
    .pw-field{margin-bottom:12px;}
    .pw-rule{margin-top:4px;}

    .look{padding:8px 20px 20px; border-top:1px solid var(--n-line); margin-top:8px;}
    .look-l{font-size:13px; color:var(--n-dim); margin:12px 0 8px;}

    /* ---- the tab bar (kit board t01) ---- */
    .nav{
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:540px; display:flex; background:var(--n-bg);
      border-top:1px solid var(--n-line); z-index:40;
      padding-bottom:env(safe-area-inset-bottom);

    .nav button{position:relative; flex:1; padding:11px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--n-dim); font-size:11px; letter-spacing:0;}
    .nav button.on{color:var(--n-ink); font-weight:500;}
    .nav button.on::before{content:""; position:absolute; left:50%; bottom:3px; margin-left:-2px; width:4px; height:4px; background:var(--n-accent);}
    .nav .ic{display:flex; align-items:center; justify-content:center; height:21px;}

    .center{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 20px; text-align:center; color:var(--n-dim);}
    .spin{width:22px;height:22px;border:2px solid var(--n-line);border-top-color:var(--n-ink);animation:sp 0.8s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg);}}

    /* ===== FIRST SCREEN LOOK (the website's look; one screen so far) =====
       WHAT THIS BLOCK IS: milspoliving.com's type and colour as tokens (--w-*) and a few roles
       (w-label, w-caption, w-display, w-btn-*), used by the first screen (FIRST SCREEN in the app
       script) and by nothing else yet.
       DECISION (Chris, decision card 2026-11-25, look: "Yes, match the website"; first build: "My
       base first screen only"): the first screen is drawn in the website's look, and THE REST OF
       THE APP FOLLOWS SCREEN BY SCREEN. Until then every other screen keeps THE NEW LOOK above. A
       screen moves over by using these tokens and roles; nothing here has to change for it.
       WHERE THE VALUES COME FROM: the website repo, src/app/globals.css (the :root palette, the
       label, caption and figure styles, the button roles btn, btn-lg, btn-primary, btn-secondary
       and btn-quiet, the dark-section rules) and src/lib/branch-colors.ts, read 2026-11-25. Nothing
       was invented: light is the website's page (ink on paper), dark is the website's dark section
       (paper on its night ground, hairlines at 28% paper).
       WARNING, one difference from the website: in a dark section the website draws second lines
       in paper at 72%. Here that holds on the night ground (9.3:1), but text ON A BRANCH COLOUR
       (the hero) is always full paper: at 72% it reads 3.5:1 on the Coast Guard blue and 4.2:1 on
       the Marine Corps red, under the 4.5:1 small text needs (computed 2026-11-25). The signal red
       is 4.2:1 on paper, so it is used as a rule beside a notice, never as the colour of its words.

       THE SEAM WITH THE REST OF THE APP: while the first screen is up, <html data-screen="first">
       points the shell's own tokens (--n-bg, --n-ink, --n-dim, --n-line, --n-soft, --n-solid) at
       this look, so the top bar, a notice and the tab bar sit on the same ground with the same
       hairline as the screen between them. The attribute is set before first paint by the script
       under the style block and kept by useFirstScreenLook. On every other tab it is absent and
       the shell is THE NEW LOOK again. ROAD NOT TAKEN: restyling the top bar and the tab bar
       themselves; that is "a tab redesign", which Chris's card left out.

       THE FACES: Playfair Display 500 (display), Archivo 400 and 600 (text), IBM Plex Mono 400
       (labels and figures), the website's three, only the weights this screen uses, from the
       second fonts link in the head. sw.js caches Google Fonts by host, cache-first.
       WHY display=swap and not optional: with optional a face that is not in hand within about
       100ms is dropped for the whole visit, and a cold start behind the service worker often
       misses that, so the screen would open in the fallback faces. With swap, the launch script
       under the launch mark starts fetching the faces at once and the app takes a second or more
       to compile, so they are in hand before the screen is drawn. What can still move is the base
       name in the launch mark, once, if the fallback wraps it differently. */
    :root{
      --wl-surface:#f5f4f0; --wl-raise:#ffffff; --wl-text:#151514; --wl-dim:#55534e; --wl-line:#cfcdc6; --wl-tint:#eae8e2;

      --wd-surface:#0b0e10; --wd-raise:#1b1b1a; --wd-text:#f5f4f0; --wd-dim:rgb(245 244 240 / 0.72); --wd-line:rgb(245 244 240 / 0.28); --wd-tint:#1b1b1a;
      --wd-solid:#f5f4f0; --wd-solid-hover:#eae8e2; --wd-onsolid:#151514;

      --w-tint:var(--wl-tint); --w-solid:var(--wl-solid); --w-solid-hover:var(--wl-solid-hover); --w-onsolid:var(--wl-onsolid);
    }
    :root[data-mode="dark"]{
      --w-surface:var(--wd-surface); --w-raise:var(--wd-raise); --w-text:var(--wd-text); --w-dim:var(--wd-dim); --w-line:var(--wd-line);
      --w-tint:var(--wd-tint); --w-solid:var(--wd-solid); --w-solid-hover:var(--wd-solid-hover); --w-onsolid:var(--wd-onsolid);
    }
    /* The same declarations as data-mode="dark", for a dark phone before the script has run. */
    @media (prefers-color-scheme: dark){
      :root:not([data-mode="light"]){
        --w-surface:var(--wd-surface); --w-raise:var(--wd-raise); --w-text:var(--wd-text); --w-dim:var(--wd-dim); --w-line:var(--wd-line);
        --w-tint:var(--wd-tint); --w-solid:var(--wd-solid); --w-solid-hover:var(--wd-solid-hover); --w-onsolid:var(--wd-onsolid);
      }
    }
    /* THE SEAM (above). WARNING: this must stay BELOW the three --n-* blocks of THE NEW LOOK; it
       has the same weight as they do and wins only by coming later. */
    :root[data-screen="first"]{
      --n-bg:var(--w-surface); --n-ink:var(--w-text); --n-dim:var(--w-dim); --n-line:var(--w-line); --n-soft:var(--w-tint);
      --n-solid:var(--w-solid); --n-onsolid:var(--w-onsolid);

    .fs{ font-family:var(--w-sans); color:var(--w-text); overflow-x:clip; }
    /* :where() so this reset has no weight and any class below can set its own margin. */
    :where(.fs p){ margin:0; }
    .w-label{ font-family:var(--w-mono); font-size:12px; line-height:1.4; letter-spacing:0.08em; text-transform:uppercase; }
    .w-caption{ font-size:14px; line-height:1.45; color:var(--w-dim); }
    .w-display{ font-family:var(--w-display); font-weight:500; letter-spacing:-0.01em; text-wrap:balance; }
    .w-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:48px; padding:6px 24px;
      border:1px solid transparent; font-size:17px; font-weight:600; line-height:1.2; text-align:center;
      transition:background-color 200ms var(--w-ease), border-color 200ms var(--w-ease), color 200ms var(--w-ease); }
    .w-btn-primary{ background:var(--w-solid); border-color:var(--w-solid); color:var(--w-onsolid); }
    .w-btn-primary:hover{ background:var(--w-solid-hover); }
    .w-btn-secondary{ background:var(--w-raise); border-color:var(--w-text); color:var(--w-text); }
    .w-btn-secondary:hover{ background:var(--w-tint); }
    .w-btn:disabled{ opacity:0.6; cursor:default; }
    .w-btn-quiet{ display:inline-flex; align-items:center; min-height:44px; padding:0; font-size:14px; font-weight:600; color:var(--w-text);
      text-decoration:underline; text-decoration-color:var(--w-line); text-underline-offset:0.2em; text-align:left; }

    /* ---- the hero: the website's guide hero (a branch-colour ground, a dot and a bar in the
       branch's mark colour, the name in the display face). --fs-tone-* come from BRANCH_TONES. ---- */
    .fs-hero{ background:var(--fs-tone-main, #1b1b1a); color:var(--w-ontone); padding:22px 20px 0; }
    .fs-name{ font-size:32px; line-height:1.08; margin:6px 0 0; color:var(--w-ontone); overflow-wrap:anywhere; }
    .fs-bar{ width:96px; height:6px; margin-top:14px; background:var(--fs-tone-mark, #cec185); }

    .fs-dot{ flex:none; width:10px; height:10px; background:var(--fs-tone-mark, #cec185); }
    /* The time and the weather. RULE (auditor round 2, item 23, kept here): the block has its full
       height from the first paint, also in the launch mark, so nothing under it moves when the
       weather arrives late or never. 144px = two 44px rows, 40px for two lines of forecast, 16px. */
    .fs-facts{ margin-top:16px; min-height:144px; padding-bottom:16px; }
    .fs-fact{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; min-height:44px; padding-top:12px; border-top:1px solid var(--w-ontone-line); }
    .fs-fact .w-label{ flex:none; }
    .fs-fact-v{ font-family:var(--w-mono); font-variant-numeric:tabular-nums; font-size:17px; line-height:1.3; text-align:right; }
    .fs-fact-sub{ min-height:40px; font-size:14px; line-height:20px; }
    .fs-hero .w-btn-quiet{ color:var(--w-ontone); text-decoration-color:var(--w-ontone-line); margin:-12px 0; }

    /* ---- under the hero ---- */
    .fs-section{ padding:22px 20px 0; }
    .fs-section > .w-label{ display:block; color:var(--w-dim); margin-bottom:8px; }
    .fs-section > .w-caption{ margin-top:6px; }
    .fs-step{ font-size:20px; line-height:1.25; }
    .fs-result{ font-size:24px; line-height:1.25; margin-top:14px; }
    .fs-actions{ display:grid; gap:8px; }
    /* A notice in words: a warning from the weather service, or something that could not load. */
    .fs-note{ border-left:2px solid var(--w-signal); padding:2px 0 2px 12px; font-size:14px; line-height:1.45; }
    .fs-note strong{ font-weight:600; }
    .fs-note .w-btn-quiet{ margin:-4px 0 -12px; }
    /* Rows of bases: joined rows with a hairline between, the whole row is the target. */
    .fs-rows{ list-style:none; margin:0; padding:0; border-top:1px solid var(--w-line); }
    .fs-rows li{ border-bottom:1px solid var(--w-line); }
    .fs-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:60px; padding:9px 0; text-align:left; color:var(--w-text); }
    .fs-row-name{ display:block; font-family:var(--w-display); font-weight:500; font-size:20px; line-height:1.25; letter-spacing:-0.01em; }
    .fs-row-meta{ display:block; font-size:14px; line-height:1.45; color:var(--w-dim); }
    .fs-row-go{ flex:none; display:flex; color:var(--w-dim); }
    .fs-foot{ display:flex; flex-wrap:wrap; gap:8px 28px; padding-bottom:28px; }
    /* The Add to Home Screen hint (its rule is beside AddToHomeScreenHint). Its wrapper takes no
       room once the hint is dismissed or the app is installed. */
    .fs-hint:empty{ display:none; }
    .fs-hint .a2hs{ margin:0; padding:0 0 12px; font-size:14px; line-height:1.45; }

    /* ---- the question ("Where are you headed?"), drawn inside .content so the coin sits where
       the launch mark drew it ---- */
    .fs-question{ font-size:32px; line-height:1.08; margin:0 0 16px; }
    .fs-field{ display:block; width:100%; min-height:48px; padding:0 14px; border:1px solid var(--w-text); background:var(--w-raise); color:var(--w-text); font-size:17px; -webkit-appearance:none; appearance:none; }
    .fs-field::placeholder{ color:var(--w-dim); }
    .fs-field:focus{ outline:2px solid var(--w-text); outline-offset:2px; }
    .fs-matches{ margin-top:10px; }

    .fs-keep{ margin:-10px 0 4px; }
  </style>
  <script>
    /* The mode before first paint: the device's choice (Appearance row, bg_look_mode) or the phone's
       setting. The same reading as getLookMode/applyLook in the app script, done here so a dark phone
       never sees a white flash before the app script runs. */
    (function () {
      /* The app always opens on the first screen, so the shell takes that screen's ground from the
         first paint (THE SEAM, in FIRST SCREEN LOOK); the app removes it on every other tab. */
      document.documentElement.setAttribute("data-screen", "first");
      try {
        var choice = localStorage.getItem("bg_look_mode");
        var dark = choice === "dark" || (choice !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-mode", dark ? "dark" : "light");
      } catch (e) { /* storage blocked: the stylesheet follows the phone on its own */ }
    })();
  </script>

<body>
  <!-- LAUNCH MARK (auditor round 3, item 21; Chris's card 2026-11-24 "The clear fixes, one batch").
       WHY this is in the HTML: the app script is compiled in the browser on every launch (about a
       second on a fast machine, about three on a mid-range phone, measured 2026-11-25), and until
       then React has drawn nothing: the page was blank. This is what the reader sees meanwhile:
       the top bar's wordmark and the Home hero, in the same boxes and classes the app draws them
       in, so nothing moves when React takes over (React empties #root on its first render).
       WARNING: the three texts and the image below are a COPY of APP_NAME, BRAND, HOME_TAGLINE and
       ASSETS.logoMark in the app script; HTML cannot read those before the script has run. On every
       launch the app compares the two (checkLaunchMark) and logs "[LAUNCH] ... differ" when a rename
       changed one side only. Change both together.
       ROAD NOT TAKEN: precompiling the app so the wait itself goes away. That needs a build step,
       which this single-file web app does not have by design; it is planned for the store wrapper.
       THE FIRST SCREEN AT FIRST PAINT (0.28): the mark below is the first screen WITHOUT a base (the
       coin over the question). For a reader WITH a base the script right under it hides the coin and
       draws that base's hero from what the phone kept (FIRST SCREEN MEMORY in the app script), in
       the classes and heights the app draws it in. The coin stays in the page, hidden, so
       checkLaunchMark still has all four copies to compare. -->
  <div id="root"><div id="app-shell" data-launch-mark="true" aria-busy="true">
    <div class="topbar"><div class="topbar-row">
      <div class="wordmark"><span data-launch="app-name">Base Guides</span><span class="wordmark-by">by <span data-launch="brand">MilSpo Living</span></span></div>
    </div></div>
    <div class="content"><div class="home-hero">
      <img class="home-logo" src="logo-mark.png" alt="MilSpo Living" data-launch="logo" />
      <div class="home-tag" data-launch="tagline">Guides for your next duty station.</div>
    </div></div>
  </div></div>

  <script>
    /* THE FIRST SCREEN AT FIRST PAINT (see LAUNCH MARK above and FIRST SCREEN in the app script).
       Two jobs, both before the app has compiled:
       1. start fetching the first screen's faces, so they are in hand when the screen is drawn
          (FIRST SCREEN LOOK, "WHY display=swap");
       2. for a reader with a base, draw its hero from the phone's own copy ("bg_first_screen").
       WARNING: the markup built here is a COPY of the hero in MyBaseFirstScreen. Change one and
       change the other, or the hero jumps when the app takes over. The name and the line are set
       as text, never as markup; the two colours are used only if they are plain hex values. */
    (function () {
      try {
        if (document.fonts && document.fonts.load) {
          ["500 32px 'Playfair Display'", "400 14px Archivo", "600 14px Archivo", "400 12px 'IBM Plex Mono'"].forEach(function (face) {
            document.fonts.load(face).catch(function () { /* a face that cannot load leaves its fallback, which is readable */ });
          });
        }
        var kept = JSON.parse(localStorage.getItem("bg_first_screen") || "null");
        var hex = /^#[0-9a-f]{6}$/i;
        if (!kept || typeof kept.name !== "string" || !kept.name || !hex.test(kept.toneMain || "") || !hex.test(kept.toneMark || "")) return;
        var shell = document.querySelector("[data-launch-mark]");
        var coin = shell && shell.querySelector(".content");
        if (!coin) return;
        var screen = document.createElement("div");
        screen.className = "fs";
        screen.setAttribute("data-launch-first", "base");
        screen.innerHTML = '<header class="fs-hero"><div class="w-label">My base</div><h1 class="fs-name w-display"></h1>' +
          '<div class="fs-bar"></div><div class="fs-branch"><span class="fs-dot"></span><span></span></div><div class="fs-facts"></div></header>';
        var hero = screen.firstChild;
        hero.style.setProperty("--fs-tone-main", kept.toneMain);
        hero.style.setProperty("--fs-tone-mark", kept.toneMark);
        hero.querySelector(".fs-name").textContent = kept.name;
        hero.querySelector(".fs-branch").lastChild.textContent = typeof kept.line === "string" ? kept.line : "";
        coin.hidden = true;
        shell.appendChild(screen);
      } catch (e) { /* storage blocked or an old value: the coin stays, which is right for a reader with no base */ }
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.log("[bg] sw register failed:", e && e.message);
        });
      });
    }
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef, useSyncExternalStore } = React;

    /* ---------------- CONFIG (single source of brand/version) ----------------

    const APP_NAME = "Base Guides";
    const BRAND = "MilSpo Living";
    // The line under the coin on Home. A constant because the launch mark in the HTML carries a copy

    const HOME_TAGLINE = "Guides for your next duty station.";
    // Brand artwork behind named files so a rebrand is a drop-in swap (see CLAUDE.md
    // "Rebranding"): replace these + the icon-*/apple-touch/favicon PNGs + CSS :root.
    const ASSETS = { logoMark: "logo-mark.png" };
    const CONTACT_EMAIL = "support@milspoliving.com"; // realtor-intro inbox (Porkbun forwarding)
    const APP_VERSION = "0.30.0";
    // Deployed backend (Railway). Content + live layer both come from here.
    // Empty string would fall back to local static data/ files for content.
    const API_BASE_DEFAULT = "https://web-production-43053.up.railway.app";
    const USING_API = !!API_BASE_DEFAULT;
    const DATA_BASE = USING_API ? API_BASE_DEFAULT.replace(/\/$/, "") + "/api/bases" : "data/bases";
    // Backend for the LIVE layer (AI Q&A + nearby places).
    const API_BASE = API_BASE_DEFAULT || "http://localhost:8000";

    // WHAT EACH LIVE LOOKUP COSTS, and so whether a screen may load it by itself.
    // RULE (Chris, decision card 2026-11-25, paid lookups: "Free data first, then a cap"): a
    // lookup marked "free" may load when a screen opens; one marked "paid" loads only after a tap
    // that asks for it. The first screen reads this table (FIRST SCREEN, rule 1). The cap is not

    // The providers, read from the backend's main.py on 2026-11-25: weather = the National Weather
    // Service (api.weather.gov; no key, no charge, U.S. places only); directions = OSRM's public
    // server over OpenStreetMap roads (no key, no charge); places = Google Places (charged per

    // WARNING: this is a COPY of what the backend does. If the backend moves a lookup to a paid
    // provider, change its word here in the same release, or the app goes on loading it unasked.
    const LIVE_DATA_COST = { weather: "free", directions: "free", places: "paid", ask: "paid" };

    // WHY a key may ship in the client: this is Supabase's PUBLISHABLE key, made for browsers.

    // supabase/migrations/20261123210000_accounts_slice_1.sql). The backend's "keys never reach the
    // client" rule is about SECRET keys and still holds. ROAD NOT TAKEN: proxying auth through the
    // Railway backend - a hop and a session store for no security gain.
    const SUPABASE_URL = "https://jmnhviumgulbcdlzuawa.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Ds2HorZMHqHMsI1CrGANhg_0sbTixvB";
    const ACCOUNTS_ON = !!SUPABASE_PUBLISHABLE_KEY;

    function indexUrl() { return USING_API ? DATA_BASE : DATA_BASE + "/index.json"; }
    function baseUrl(slug) { return USING_API ? DATA_BASE + "/" + slug : DATA_BASE + "/" + slug + ".json"; }
    // Stories live only in the shared database (served by the backend), so file mode has none: null.
    function storyUrl(slug) { return USING_API ? DATA_BASE + "/" + slug + "/story" : null; }
    function apiUrl(path) { return API_BASE.replace(/\/$/, "") + path; }

    async function fetchJSON(url) {
      const r = await fetch(url, { cache: "no-cache" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }

    // Browser storage for what stays on the phone: the PCS plan, its ticks, and the device copies of
    // the saved bases, My base and the pay grade while signed out (SAVED BASES, MY BASE, PAY GRADE).
    const LS = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
    };

    // Inline SVG icons (replace placeholder text glyphs - crisp at any size).
    function Icon({ name, size = 20 }) {
      const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
      switch (name) {
        case "home": return <svg {...p}><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></svg>;
        case "guide": return <svg {...p}><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5z" /><path d="M9 3v18" /></svg>;
        case "map": return <svg {...p}><path d="M12 21s-6.5-5.7-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.3 12 21 12 21z" /><circle cx="12" cy="10.5" r="2.3" /></svg>;
        case "search": return <svg {...p}><circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" /></svg>;
        case "chevron": return <svg {...p}><path d="m6 9 6 6 6-6" /></svg>;
        case "cardchev": return <svg {...p}><path d="m9 6 6 6-6 6" /></svg>;
        case "back": return <svg {...p}><path d="m15 6-6 6 6 6" /></svg>;
        case "info": return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 11v5" /><path d="M12 8h.01" /></svg>;
        case "flag": return <svg {...p}><path d="M5 21V4" /><path d="M5 4h12l-2 4 2 4H5" /></svg>;
        case "compass": return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="m15.5 8.5-2 5.5-5 1.5 2-5.5z" /></svg>;
        case "shield": return <svg {...p}><path d="M12 3l7 3v5c0 4.5-3 7.4-7 9-4-1.6-7-4.5-7-9V6z" /></svg>;

        case "cart": return <svg {...p}><circle cx="9.5" cy="20" r="1.3" /><circle cx="17" cy="20" r="1.3" /><path d="M3 4h2l2.4 11h10l1.8-7H6.2" /></svg>;
        case "calendar": return <svg {...p}><rect x="3" y="4.5" width="18" height="16.5" rx="2" /><path d="M3 9.5h18" /><path d="M8 2.5v4" /><path d="M16 2.5v4" /></svg>;
        case "bookmark": return <svg {...p}><path d="M6 3h12v18l-6-4-6 4z" /></svg>;
        case "bookmarkOn": return <svg {...p}><path d="M6 3h12v18l-6-4-6 4z" fill="currentColor" /></svg>;
        case "download": return <svg {...p}><path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M5 20h14" /></svg>;
        case "dollar": return <svg {...p}><path d="M12 2.5v19" /><path d="M16.5 6.6C16.5 4.9 14.5 3.8 12 3.8S7.5 4.9 7.5 6.9 9.5 9.4 12 10s4.5 1.5 4.5 3.5-2 3-4.5 3-4.5-1-4.5-2.7" /></svg>;
        case "person": return <svg {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg>;
        default: return null;
      }
    }

    // Per-branch accent color (scannable list + base-page header).
    const BRANCH_COLORS = { army: "#7d8b4e", "air force": "#4a90c2", navy: "#3f7cb0", marine: "#b23a3a", "coast guard": "#e07b39", "space force": "#8d9bb0", joint: "#9b7bc0" };
    function branchColor(b) {
      if (!b) return "var(--accent-dim)";
      const s = b.toLowerCase();
      if (s.indexOf("/") !== -1) return BRANCH_COLORS.joint;
      for (const k of Object.keys(BRANCH_COLORS)) if (s.indexOf(k) !== -1) return BRANCH_COLORS[k];
      return "var(--accent-dim)";
    }
    // BRANCH TONES: the first screen's hero colours, by branch. This is the WEBSITE'S table
    // (milspoliving src/lib/branch-colors.ts, read 2026-11-25), so a base wears the same colour on
    // the website's guide and here. main = the hero's ground; mark = its dot and bar; the words
    // on it are always the paper colour (--w-ontone).
    // RULE, the website's (its mapBranch): "U.S. " is dropped; a joint base wears the branch named
    // FIRST; "... Reserve" wears its service; any "... National Guard" wears National Guard;
    // anything else (the Defense Logistics Agency, a branch nobody listed) wears the neutral tone.
    // WARNING (carried over from the website's file): these values are not confirmed against the
    // branches' own brand guides.
    // ROAD NOT TAKEN: reusing BRANCH_COLORS above. Those are light accents for a thin edge on a
    // light page; a hero needs the website's dark grounds. The two tables become one when the
    // guide screen moves to the website's look.
    const BRANCH_TONE_NEUTRAL = { main: "#1b1b1a", mark: "#cec185" };
    const BRANCH_TONES = {
      "Army": { main: "#221f20", mark: "#ffcc01" },
      "Navy": { main: "#022a3a", mark: "#e8b010" },
      "Air Force": { main: "#00308f", mark: "#a6a6a8" },
      "Marine Corps": { main: "#a6192e", mark: "#cc9900" },
      "Coast Guard": { main: "#006ba6", mark: "#e03c31" },
      "Space Force": { main: "#000000", mark: "#97a3ae" },
      "National Guard": { main: "#00308f", mark: "#a6a6a8" },
    };
    function branchTone(branchText) {
      const known = (name) => Object.prototype.hasOwnProperty.call(BRANCH_TONES, name);
      let first = (branchText || "").trim();
      const joint = /^Joint\s*\((.+)\)\s*$/i.exec(first);
      if (joint) first = joint[1];
      first = first.split(/[/,]/)[0].trim().replace(/^U\.S\.\s+/i, "");
      if (known(first)) return BRANCH_TONES[first];
      if (/\bNational Guard$/i.test(first)) return BRANCH_TONES["National Guard"];
      const withoutReserve = first.replace(/\s+Reserve$/i, "");
      return known(withoutReserve) ? BRANCH_TONES[withoutReserve] : BRANCH_TONE_NEUTRAL;
    }
    const SECTION_ICONS = { quick_facts: "info", mission: "flag", two_state_decision: "compass", gates: "shield", housing: "home", bah: "dollar", housing_costs: "dollar", rent_buy: "dollar", pcs_first_30: "calendar", faq: "info", where_to_live: "home", schools: "cap", schools_live: "cap", healthcare: "health", shopping: "cart", nearby: "map" };
    function sectionIcon(id) { return SECTION_ICONS[id] || "info"; }

    /* ---------------- SECTION NAMES (one name per part, the website's) ----------------
       RULE (auditor round 3, item 29; Chris's cards 2026-11-24 "The clear fixes, one batch" and names
       "Use all four"): a part of a guide has ONE name, the same in the app and on milspoliving.com.
       A guide's file stores its own title for each section ("BAH Calculator", "Schools Near Base",
       "FAQ") and the website calls the same part something else. For the section types in this
       table the app shows the website's name and ignores the stored title.
       Where each name comes from (website repo, src/lib/guide-outline.ts): "Housing allowance (BAH)"
       and "Questions families ask" in sectionShortTitle; "Schools near the base" is
       SCHOOLS_PART_TITLE. Change both sides together.
       "realestate" has no part of its kind on the website (rents and home values are shown per town
       there, under "Towns compared"). Its stored title, "Housing Costs", is kept in the website's
       sentence case, so it does not read as a second name for the allowance.
       NOT in the table, on purpose: facts, prose, killer, list, rentbuy, pcs_first30, places_live and
       story. One type covers many different parts there ("Healthcare", "Pets" and "Gates & Access"
       are all prose or facts), or the title is the guide's own wording, so the stored title IS the
       name, as it is on the website. A type the table does not know shows its stored title.
       ROAD NOT TAKEN: renaming the sections in the 550 guide files. Rejected: the website and the
       backend read the same files, and one table here is one place to keep right. */
    const SECTION_NAMES_BY_TYPE = {

    /* ---------------- PWA self-update (ported from MenuCaptain) ---------------- */
    function useUpdateCheck() {
      const [newer, setNewer] = useState(null);
      useEffect(() => {
        (async () => {
          try {
            const u = location.pathname + "?vcheck=" + Date.now();
            const r = await fetch(u, { cache: "no-store" });
            const txt = await r.text();
            const m = txt.match(/APP_VERSION\s*=\s*"([0-9.]+)"/);
            if (m && m[1] && m[1] !== APP_VERSION) setNewer(m[1]);
          } catch (e) { /* offline - ignore */ }
        })();
      }, []);
      return newer;
    }
    function UpdateBanner() {
      const newer = useUpdateCheck();
      if (!newer) return null;
      const reload = () => {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage("clearCache");
        }
        setTimeout(() => location.reload(), 150);
      };
      return (
        <div className="banner">
          <span>Update available (v{newer}).</span>
          <button onClick={reload}>Refresh</button>
        </div>
      );
    }

    /* ---------------- LOOK (light or dark) ----------------
       The look's colours are CSS ("THE NEW LOOK" in the style block); this only sets data-mode on
       <html>. RULE: the mode follows the phone unless the reader chose Light or Dark in the
       Appearance row under the account screen (default: match the phone). It is a per-DEVICE
       setting (browser storage bg_look_mode), never the account's: choosing Dark on a phone must
       not change a laptop, and the account holds nothing about the look. The head script reads the
       same key before first paint so a dark phone never sees a white flash.
       The browser's own bar colour (Safari's tab bar, Android's status bar, the Home Screen app's
       clock) follows the page: the theme-color meta is set from the ground; the Home Screen app's
       status bar asks for a dark clock on the white ground and a light one at night. */
    const LOOK_MODE_KEY = "bg_look_mode"; // "light" | "dark"; absent means match the phone
    const LOOK_MODES = [["match", "Match my phone"], ["light", "Light"], ["dark", "Dark"]];
    function getLookMode() {
      try { const v = localStorage.getItem(LOOK_MODE_KEY); return v === "light" || v === "dark" ? v : "match"; }
      catch (e) { return "match"; }
    }
    function lookIsDark(mode) {
      if (mode === "dark") return true;
      if (mode === "light") return false;
      try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
      catch (e) { return false; }
    }
    function applyLook(mode) {
      const dark = lookIsDark(mode);
      const el = document.documentElement;
      el.setAttribute("data-mode", dark ? "dark" : "light");
      try {
        const ground = getComputedStyle(el).getPropertyValue("--n-bg").trim();
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta && ground) themeMeta.setAttribute("content", ground);
        // The installed web app reads this as it opens: "black-translucent" draws a white clock, which
        // would vanish on the white ground, so by day it asks for the default (dark) clock.
        const barMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (barMeta) barMeta.setAttribute("content", dark ? "black-translucent" : "default");
      } catch (e) { /* nothing to repaint beyond the page itself */ }
    }
    function setLookMode(mode) {
      try { if (mode === "match") localStorage.removeItem(LOOK_MODE_KEY); else localStorage.setItem(LOOK_MODE_KEY, mode); }
      catch (e) { /* storage blocked: the choice lasts this visit only */ }
      applyLook(mode);
    }
    // "Match my phone" follows the phone when it changes (sunset, Control Center), not only at load.
    try {
      const phoneScheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
      const follow = () => { if (getLookMode() === "match") applyLook("match"); };
      if (phoneScheme && phoneScheme.addEventListener) phoneScheme.addEventListener("change", follow);
      else if (phoneScheme && phoneScheme.addListener) phoneScheme.addListener(follow);
    } catch (e) { /* no matchMedia: the stylesheet still follows the phone */ }
    applyLook(getLookMode());
    // The Appearance row: three choices, drawn under the account screen whatever its state (the
    // account code does not know it exists - it is a device setting, not an account one).
    function LookChooser() {
      const [mode, setMode] = useState(getLookMode);
      return (
        <div className="look">
          <div className="look-l">Appearance</div>
          <div className="seg" role="radiogroup" aria-label="Appearance">
            {LOOK_MODES.map(([key, label]) => (
              <button key={key} type="button" role="radio" aria-checked={mode === key} className={mode === key ? "on" : ""}
                onClick={() => { setLookMode(key); setMode(key); }}>{label}</button>
            ))}
          </div>
        </div>
      );
    }

    const PRICE = {

    // RULE (Chris, 2026-11-25, on a screen that read "About 321 min (304.2 mi)": "321 min?"): a drive
    // is said the way a person says it. An hour or more is hours and minutes ("5 hr 21 min"); under an
    // hour is minutes. Miles are whole from 10 up ("304 miles"); under 10 they keep one decimal,
    // because 0.6 and 1.4 miles are different walks. ONE wording for both places that show a drive
    // from the reader's location (the first screen and the Map tab), so they can never disagree.
    // Road not taken: "5.4 hours" (a family plans a stop by the clock, not by a decimal).
    function driveWords(minutes, miles) {
      const wholeMinutes = Math.round(Number(minutes));
      if (!Number.isFinite(wholeMinutes) || wholeMinutes < 0) return "";
      const hours = Math.floor(wholeMinutes / 60);
      const rest = wholeMinutes % 60;
      const time = hours === 0 ? wholeMinutes + " min" : (rest === 0 ? hours + " hr" : hours + " hr " + rest + " min");
      const milesNumber = Number(miles);
      if (miles === null || miles === undefined || !Number.isFinite(milesNumber)) return "About " + time;
      const distance = milesNumber >= 10
        ? Math.round(milesNumber).toLocaleString("en-US") + " miles"
        : (Math.round(milesNumber * 10) / 10) + (milesNumber === 1 ? " mile" : " miles");
      return "About " + time + " (" + distance + ")";
    }

    // Live weather + active alerts (National Weather Service, via the backend).
    function LiveWeather({ coords }) {
      const [w, setW] = useState(null);
      useEffect(() => {

        let live = true;
        fetchJSON(apiUrl("/api/weather?lat=" + coords.lat + "&lng=" + coords.lng))
          .then((d) => { if (live) setW(d); })
          .catch(() => { if (live) setW(null); });

      }, [coords]);
      // RULE (auditor round 2, item 23): the block's space is reserved from the first paint (wx-slot),
      // so the Ask box under it does not move when the forecast arrives late or never.
      if (!w) return <div className="wx-slot" />;
      const c = w.current; const alerts = w.alerts || [];
      if (!c && !alerts.length) return <div className="wx-slot" />;
      const extra = [];
      if (w.high != null) extra.push("H " + w.high + "°");
      if (w.low != null) extra.push("L " + w.low + "°");
      if (w.precip != null) extra.push(w.precip + "% precip");
      return (
        <div className="wx-slot">
          {alerts.map((a, i) => (
            <div key={i} className="wx-alert"><strong>Weather alert: {a.event}</strong>{a.headline ? <div className="wx-alert-h">{a.headline}</div> : null}</div>

        </div>
      );
    }

    // BAH calculator - rates come from the single source of truth (/api/bah, backed
    // by the bah_rates table). Falls back to inline data.rates if the table is unreachable.
    // THE READER'S OWN RATE (Chris, decision card "Pay grade", 2026-11-27; PAY GRADE): with a pay
    // grade kept, the card shows that grade's rate with dependents and without (the app does not know
    // which applies) and "Change grade"; with none, the calculator as before and "Set your pay grade
    // to see your rate". ACCURACY RULE: every figure shown is a row of the table the backend sent.
    // A grade the table has no row for (the backend's table stops at O-7 and leaves out O-1E to O-3E)
    // says so and points to the DoD calculator; the app never derives a rate from another grade's.
    const BAH_FALLBACK_URL = "https://www.travel.dod.mil/Allowances/Basic-Allowance-for-Housing/BAH-Rate-Lookup/";
    function BAHCalc({ data }) {
      const [table, setTable] = useState(data.rates ? data : null);
      const [state, setState] = useState(data.rates ? "ok" : (data.mha ? "loading" : "err"));
      const [grade, setGrade] = useState("");
      const [deps, setDeps] = useState(true);
      const payGrade = usePayGrade();
      const [pickingGrade, setPickingGrade] = useState(false);
      const [gradeNote, setGradeNote] = useState("");
      useEffect(() => {
        if (data.rates || !data.mha) return;
        let live = true; setState("loading");
        fetchJSON(apiUrl("/api/bah?mha=" + encodeURIComponent(data.mha) + "&year=" + (data.year || 2026)))
          .then((d) => { if (live) { setTable(d); setState("ok"); } })
          .catch(() => { if (live) setState("err"); });
        return () => { live = false; };
      }, [data.mha, data.year]);
      useEffect(() => {

      const noteLine = gradeNote ? <div className="faint tiny" role="status" style={{ marginTop: 6 }}>{gradeNote}</div> : null;
      if (payGrade.grade) {

            {mine ? (

                <div className="bah-out"><span className="bah-amt">{amount(mine.wo)}</span><span className="bah-mo">/ month without dependents</span></div>

            ) : (

            )}

            {noteLine}

    // Real-estate (RentCast) - graceful "connect key" state via 503 until key is set.
    function RealEstate({ data }) {
